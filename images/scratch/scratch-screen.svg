<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="The Scratch screen: the groups of blocks down the left, the blocks, the code area, the stage at the top right and the sprites underneath it"><title>The Scratch screen</title><rect width="800" height="500" fill="#E9F1FC"/><rect width="800" height="40" fill="#4C97FF"/><text x="22" y="25" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700">File      Edit      Tutorials</text><rect x="8" y="46" width="78" height="26" rx="6" fill="#fff" stroke="#D9D9D9"/><text x="47" y="63" text-anchor="middle" fill="#855CD6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Code</text><text x="125" y="63" text-anchor="middle" fill="#8F96A8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">Costumes</text><text x="200" y="63" text-anchor="middle" fill="#8F96A8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">Sounds</text><rect x="0" y="72" width="64" height="428" fill="#fff" stroke="#D9D9D9"/><circle cx="32" cy="100" r="11" fill="#4C97FF" stroke="rgba(0,0,0,.15)"/><text x="32" y="124" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Motion</text><circle cx="32" cy="152" r="11" fill="#9966FF" stroke="rgba(0,0,0,.15)"/><text x="32" y="176" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Looks</text><circle cx="32" cy="204" r="11" fill="#CF63CF" stroke="rgba(0,0,0,.15)"/><text x="32" y="228" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Sound</text><circle cx="32" cy="256" r="11" fill="#FFBF00" stroke="rgba(0,0,0,.15)"/><text x="32" y="280" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Events</text><circle cx="32" cy="308" r="11" fill="#FFAB19" stroke="rgba(0,0,0,.15)"/><text x="32" y="332" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Control</text><circle cx="32" cy="360" r="11" fill="#5CB1D6" stroke="rgba(0,0,0,.15)"/><text x="32" y="384" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Sensing</text><circle cx="32" cy="412" r="11" fill="#59C059" stroke="rgba(0,0,0,.15)"/><text x="32" y="436" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Operators</text><circle cx="32" cy="464" r="11" fill="#FF8C1A" stroke="rgba(0,0,0,.15)"/><text x="32" y="488" text-anchor="middle" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10">Variables</text><rect x="64" y="72" width="186" height="428" fill="#F9F9F9" stroke="#D9D9D9"/><text x="78" y="96" fill="#575E75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Motion</text><rect x="78" y="110" width="128" height="34" rx="5" fill="#4C97FF" stroke="#3373CC"/><text x="88" y="131" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">move (10) steps</text><rect x="78" y="156" width="142.4" height="34" rx="5" fill="#4C97FF" stroke="#3373CC"/><text x="88" y="177" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">turn (15) degrees</text><rect x="78" y="202" width="156.8" height="34" rx="5" fill="#4C97FF" stroke="#3373CC"/><text x="88" y="223" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">go to x: (0) y: (0)</text><rect x="78" y="248" width="135.2" height="34" rx="5" fill="#4C97FF" stroke="#3373CC"/><text x="88" y="269" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">change x by (10)</text