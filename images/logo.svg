<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Computing Lesson Hub">
  <title>Computing Lesson Hub</title>
  <!-- An open book, for lessons, with code brackets across its pages, for
       computing. The gold spine sits between them where the slash of </>
       would go, and is the one bit of colour that still shows at the size
       of a browser tab. Flat colours only, so it stays crisp at 16px. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#2F6BAE"/>
  <path d="M30 18.5 C24.5 15.5 17 15 10 16.5 V45 C17 43.5 24.5 44 30 47 Z" fill="#FFFFFF"/>
  <path d="M34 18.5 C39.5 15.5 47 15 54 16.5 V45 C47 43.5 39.5 44 34 47 Z" fill="#FFFFFF"/>
  <rect x="30" y="17" width="4" height="31.5" rx="2" fill="#F2B705"/>
  <path d="M22 25.5 L16.5 31.5 L22 37.5" fill="none" stroke="#2F6BAE" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 25.5 L47.5 31.5 L42 37.5" fill="none" stroke="#2F6BAE" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
