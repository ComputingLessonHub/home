<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Computing Lesson Hub">
  <title>Computing Lesson Hub</title>
  <!-- A computer screen that is also a blackboard: </> written on it, the
       slash in gold, the one bit of colour that still shows at the size of a
       browser tab. Flat colours only, so it stays crisp at 16px. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#2F6BAE"/>
  <rect x="9" y="12" width="46" height="32" rx="4" fill="#1F3550" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M23 21.5 L16.5 28 L23 34.5 M41 21.5 L47.5 28 L41 34.5" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34.5 20 L29.5 36" stroke="#F2B705" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M26 52h12M32 45.5v6.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
</svg>
