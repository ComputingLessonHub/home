<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232" role="img" aria-label="A Python program with numbered lines: 1 password = input(&quot;Password: &quot;), 2 while password != &quot;cat123&quot;:, 3 print(&quot;Wrong password&quot;), 4 password = input(&quot;Try again: &quot;), 5 print(&quot;Welcome in!&quot;)"><title>A Python program with numbered lines: 1 password = input("Password: "), 2 while password != "cat123":, 3 print("Wrong password"), 4 password = input("Try again: "), 5 print("Welcome in!")</title><rect width="640" height="232" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="1" y="1" width="64" height="230" rx="9" fill="#f1f5f9"/><rect x="12" y="21" width="40" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="36" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#334155">1</text><text x="80" y="36" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="18"><tspan fill="#1f2937">password</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#1f2937">=</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#1d4ed8">input</tspan><tspan fill="#1f2937">(</tspan><tspan fill="#15803d">"Password: "</tspan><tspan fill="#1f2937">)</tspan></text><rect x="12" y="61" width="40" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="76" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#334155">2</text><text x="80" y="76" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="18"><tspan fill="#7c3aed">while</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#1f2937">password</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#1f2937">!</tspan><tspan fill="#1f2937">=</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#15803d">"cat123"</tspan><tspan fill="#1f2937">:</tspan></text><rect x="12" y="101" width="40" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="116" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#334155">3</text><text x="123.2" y="116" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="18"><tspan fill="#1d4ed8">print</tspan><tspan fill="#1f2937">(</tspan><tspan fill="#15803d">"Wrong password"</tspan><tspan fill="#1f2937">)</tspan></text><rect x="12" y="141" width="40" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="156" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#334155">4</text><text x="123.2" y="156" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="18"><tspan fill="#1f2937">password</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#1f2937">=</tspan><tspan fill="#1f2937"> </tspan><tspan fill="#1d4ed8">input</tspan><tspan fill="#1f2937">(</tspan><tspan fill="#15803d">"Try again: "</tspan><tspan fill="#1f2937">)</tspan></text><rect x="12" y="181" width="40" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="196" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#334155">5</text><text x="80" y="196" dominant-baseline="central" font-family="Consolas, 'Courier New', monospace" font-size="18"><tspan fill="#1d4ed8">print</tspan><tspan fill="#1f2937">(</tspan><tspan fill="#15803d">"Welcome in!"</tspan><tspan fill="#1f2937">)</tspan></text></svg>
