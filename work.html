<!-- ================= a lesson's markbook =================
     The same spreadsheet an assessment's markbook is: the figures along the
     top, the filters and Copy all and Save for Excel in one row, then the
     table, picked and copied the way markbook.js picks and copies. -->
<div id="progressPane" class="workwrap lessonmb" hidden>

  <div class="progress-types" id="progressTypes" hidden></div>
</div>

<!-- ================= the markbook =================
     In place of Progress for an assessment, standard or practical: drawn by
     markbook.js out of the same class, work and results this page fetches. -->
<div id="markbookPane" class="workwrap mbpane" hidden>
  <div id="mbHolder"></div>
</div>

<!-- ================= viewing work ================= -->
<div id="workPane" class="workwrap" hidden>
  <div class="worksplit">
    <div class="workmain">
      <div class="workbar">
    <button class="btn-ghost iconbtn" id="prevStu" title="Previous student">&larr;</button>
    <select id="stuPick"></select>
    <button class="btn-ghost iconbtn" id="nextStu" title="Next student">&rarr;</button>
    <button class="btn-ghost" id="onlyUnmarked" aria-pressed="false" title="List and go to only the students with no saved feedback">Unmarked only</button>
    <button class="btn-ghost" id="viewMode">All on one page</button>
    <button class="btn-ghost" id="openPdf">PDF</button>
    <button class="btn-ghost" id="refreshWork" title="Fetch what has been saved since this page was opened">Refresh</button>
    <span class="hint" id="workFresh"></span>
  </div>
      <!-- The second frame is the next student, loaded while this one is
           being marked, so Save and next has their work ready to show. The
           two swap ids when it is used (see swapInSpare). -->
      <div class="workframe"><iframe id="workFrame" title="Their work" allow="fullscreen" data-inspect="hub_inspect"></iframe><iframe id="spareFrame" class="spare" title="The next student's work" allow="fullscreen" data-inspect="hub_inspect_next" tabindex="-1" aria-hidden="true"></iframe></div>
    </div>
    <aside class="workside" id="workSide">
      <!-- A test's score, as Mark work has it now, mark changes and all. Kept
           to one short line so a Strength and Target still fit under it. -->
      <p class="fbscore" id="fbScoreRow" hidden><span class="fbscore-label">Score</span> <b id="fbScoreNum"></b> <span class="fbscore-note" id="fbScoreNote"></span></p>
      <!-- whose work it is, on the heading's own line, to leave the room for
           the boxes -->
      <h3 class="fbhead">Feedback <span id="fbWho"></span></h3>
      <!-- Practice only: a sandbox is several programs and feedback belongs
           to one of them, so the boxes below say which. It follows whatever
           is open in the frame, and opens one when it is changed here. -->
      <div class="bfield" id="progWrap" hidden>
        <label for="progPick">Program</label>
        <select id="progPick" class="bigselect"></select>
      </div>
      <div class="bfield" id="markWrap" hidden>
        <label id="markLabel">Mark</label>
        <span class="markrow2" id="scoreRow">
          <input id="fbScore" type="number" min="0"> <span id="outOfLabel">out of 20</span>
        </span>
      </div>
      <!-- Where a lesson has a bank of Strengths and Targets, a list of what
           it asks for is ticked off and writes the boxes below. Settings can
           swap it for a few Yes or No questions instead. -->
      <div class="fblist" id="fbList" hidden></div>
      <div class="fbask" id="fbAsk" hidden></div>
      <div class="fbask-again" id="fbAskAgain" hidden></div>
      <div class="bfield" id="fbStrengthWrap">
        <label for="fbStrength">Strength</label><textarea id="fbStrength" rows="5"></textarea>
      </div>
      <div class="bfield" id="fbTargetWrap">
        <label for="fbTarget">Target</label><textarea id="fbTarget" rows="5"></textarea>
      </div>
      <!-- Most work is marked with a Strength and a Target alone, so the
           comment box waits behind a button until it is wanted. -->
      <button class="bank-link fbcomment-add" id="fbCommentAdd" type="button" hidden>+ Additional comment</button>
      <div class="bfield" id="fbCommentWrap"><label>Additional comment</label><textarea id="fbComment" rows="2"></textarea></div>
      <!-- Marking a class is one student after another, so moving on is the
           button most pressed; Save on its own is for coming back to later. -->
      <!-- Held at the foot of the column however far down it is scrolled, with
           the message that says whether it saved. -->
      <div class="fbfoot" id="fbFoot">
        <div class="fbsave" id="fbSaveRow">
          <button class="btn-ghost" id="saveFb">Save</button>
          <button class="btn-primary" id="saveNext" title="Ctrl + Enter">Save and next</button>
        </div>
        <!-- While the list is being ticked, its own way on stands where Save
             does: nothing is ready to save until the Target is agreed. -->
        <div class="fbsave" id="fbListRow" hidden></div>
        <!-- Ticked, the Strength and Target go and the lesson's comment for
             lost work takes their place. Under the buttons, so it is never
             in the way of the ticks, and in the foot, so it is always to hand
             while nothing has been ticked. -->
        <label class="fblist-row fbnotsaved-tick" id="notSavedWrap" hidden>
          <input type="checkbox" id="notSaved">
          <span>Student was present but did not save their work properly</span>
        </label>
        <p class="hint" id="fbMsg"></p>
        <!-- Their feedback is saved: said here, in place of whatever the line
             above last said about how the boxes were filled in. -->
        <p class="fbmarked" id="fbMarked">✓ Marked</p>
        <!-- Save and next moves on before the save has finished. One that
             then fails is said here, whoever is on screen by then. -->
        <p class="fbbehind" id="fbBehind" hidden></p>
      </div>
    </aside>
  </div>

<script>
/* Puts everything except the cross and the closing buttons into a part that
   scrolls on its own, so a long pop-up can be read on a small screen without
   its buttons sliding off the bottom. */
function scrollBody(box){
  if (!box || box.querySelector(".modal-scroll")) return;
  const kids = Array.from(box.children);
  const middle = kids.filter(n =>
    !n.classList.contains("modal-x") &&
    !n.classList.contains("modal-cta") &&
    !n.classList.contains("modal-stay"));
  if (middle.length < 2) return;
  const scroller = document.createElement("div");
  scroller.className = "modal-scroll";
  box.insertBefore(scroller, middle[0]);
  middle.forEach(n => scroller.appendChild(n));
}

const $ = (id) => document.getElementById(id);
function on(id, ev, fn){
  const e = document.getElementById(id);
  if (!e){ console.warn("Nothing on the page with id:", id); return; }
  e.addEventListener(ev, fn);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
/* The class list, the picker, the feedback panel and the Progress markbook
   all list a class in the same order, and it is by username rather than by
   display name: two students called Amelia are still two different rows in
   the register, and the username is the one thing on this page that always
   tells them apart. */
function byUsername(a, b){ return (a.username || "").localeCompare(b.username || ""); }

function openModal(build){
  const box = $("mBox");
  box.className = "modal";
  box.innerHTML = "";
  build(box);
  if (!box.querySelector(".modal-x")){
    const x = el("button","btn-ghost iconbtn modal-x","\u2715");
    x.addEventListener("click", closeModal);
    box.insertBefore(x, box.firstChild);
  }
  scrollBody(box);
  $("mBack").hidden = false;
}
function closeModal(){ $("mBack").hidden = true; }

const API = (window.HUB && window.HUB.API) || "";
/* The session, or the key where there is no second factor to make one.
   teacher.js decides which; this page only has to ask. */
const H = () => window.teacherAuth.headers();
const HJ = () => window.teacherAuth.json();

const qs = new URLSearchParams(location.search);
/* ---- practice, rather than a lesson ----
   ?practice=1&group=8A[&student=jbloggs] shows a class's sandbox programs
   instead of a lesson's work. It is the same page throughout: the same
   student picker, the same feedback boxes down the right. What changes is
   where the work comes from (one reserved row per student rather than a
   lesson's), what is drawn in the frame (the sandbox rather than the lesson
   page) and that feedback is written against one program rather than the
   whole of it.

   Nothing in practice is marked, here or anywhere else, so the mark and the
   grade never appear, and neither does the Progress tab: a score on work
   nobody set would be the one thing the Practice tab was built not to be. */
const PRACTICE = qs.get("practice") === "1";
const SLOT = (window.practice && window.practice.sandbox && window.practice.sandbox.SLOT)
             || "__practice_sandbox";
/* A link handed in by a student carries the lesson on "id"; the console
   opens this page with "lesson" and a class alongside it. */
const lessonId = PRACTICE ? SLOT : (qs.get("lesson") || qs.get("id") || "");
const cls = qs.get("group") || "";
const OFFLINE = !!(window.HUB && window.HUB.OFFLINE);
let handedIn = null;          // the work that arrived on the address
let markedLink = "";          // what to hand back once it has been marked

let lessonJson = null;
let roster = [];        // everyone in the class, alphabetical
let rows = [];          // what they have saved
let idx = 0;
let allPages = false;
let lastStep = 0;                                     // the page being looked at
let lastScroll = 0;                                   // and how far down it
let lastFull = "";                                    // the task whose picture is open full screen

/* ---------------- getting everything ---------------- */

/* The dots belong to the wait, so anything that ends the wait without the work
   arriving takes them away with it. Three dots bouncing over "Sign in to see
   this class’s work." says the page is still on its way when it is not. */
function workStopped(why){
  $("loadPane").querySelector(".load-dots").hidden = true;
  $("loadPane").querySelector(".loadmsg").textContent = why;
}
function workWaiting(){
  $("loadPane").querySelector(".load-dots").hidden = false;
  $("loadPane").querySelector(".loadmsg").textContent = "Loading the class’s work…";
}

async function boot(){
  if (OFFLINE){ return bootFromLink(); }
  workWaiting();            // boot runs again after the sign-in asked for below
  if (!API){
    workStopped("This copy of the site has no server address in config.js.");
    return;
  }
  /* Opened straight from a bookmark rather than out of the console, so there
     is no session in this tab yet. Asking is better than sending them away. */
  if (!window.teacherAuth.have()){
    workStopped("Sign in to see this class’s work.");
    askToSignIn(boot);
    return;
  }
  try{
    /* There is no lesson behind a sandbox, so there is none to fetch: asking
       the catalogue for a lesson called __practice_sandbox would fail and
       take the whole screen down with it. */
    const [lesson, students, work] = await Promise.all([
      PRACTICE ? Promise.resolve(null) : fetchLesson(), fetchRoster(), fetchWork()
    ]);
    lessonJson = lesson;
    /* A practical is handed in to be marked by hand, and the console's
       button into it says Mark work, so the tab it opens on does too. */
    if (lessonJson && (lessonJson.practical || lessonJson.assessment)) $("tabWork").textContent = "Mark work";
    /* a test has no pages to lay out on one, only its marked answers */
    if (markingTest()) $("viewMode").hidden = true;
    roster = students.sort(byUsername);
    rows = work;
    if (!PRACTICE) await loadMarks();
    if (!PRACTICE) lockedPages = await fetchLocks(lessonJson);
    if (PRACTICE){
      /* No site name in front: the logo on Console already says where this
         is, and the name pushed the part worth reading off the end. */
      $("barTitle").textContent = "Practice programs \u00b7 " + cls;
      document.title = "Practice programs \u00b7 " + cls;
      practiceBar();
    } else {
      const doing = (lessonJson && (lessonJson.practical || lessonJson.assessment)) ? "Marking" : "Viewing";
      $("barTitle").textContent = doing + " \u00b7 " +
        (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
      document.title = "Student work \u00b7 " + (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
    }
    if (!PRACTICE) paintSecondTab();
    /* Never held up for this: it is a second fetch on top of the ones the
       markbook already needed, and the table above it is worth showing
       whether or not it ever arrives. An assessment has the markbook in
       place of Progress, and nothing to compare against a sibling lesson. */
    if (!PRACTICE && !markbookMode()) loadComparison().then(() => { if (!PRACTICE) paintProgress(); });
    /* Opened on one student, from a class list or the username search: start
       on them rather than on whoever is first alphabetically. */
    const asked = (qs.get("student") || "").toLowerCase();
    if (asked){
      const at = roster.findIndex(x => String(x.username || "").toLowerCase() === asked);
      if (at >= 0) idx = at;
    }
    paintPicker();
    $("loadPane").hidden = true;
    /* admin.html's unit-wide progress screen sends a teacher here already
       wanting the markbook, not the student's work, when they have drilled
       down from a specific lesson in the trend. */
    tab(wantedTab);
  }catch(e){
    workStopped(e.message);
  }
}

/* The few pieces of the bar that only make sense against a lesson. A PDF is
   built out of a lesson's tasks, and "All on one page" is about a lesson's
   pages; a sandbox has neither. Practice is not marked, so there is nothing
   for the Progress tab to show either. */
function practiceBar(){
  ["viewMode","openPdf"].forEach(id => { const e = $(id); if (e) e.hidden = true; });
  const tabW = $("tabWork");
  if (tabW) tabW.textContent = "Programs";
  const tabP = $("tabProgress");
  if (tabP) tabP.hidden = true;
}
/* ---------------- one student, arriving on a link (no server) ----------------
   The whole hand-in is in the address, so there is no class to page through.
   Everything else on this page works as it does online: the same viewer, the
   same feedback boxes down the right. */
async function bootFromLink(){
  const shut = workStopped;
  if (!window.workLink || !window.workLink.supported)
    return shut("This browser cannot read work links. Ask for the work as a PDF instead.");
  handedIn = await window.workLink.readHash();
  if (!handedIn)
    return shut("Open a student's work link to mark it. There is nothing to show on its own.");
  if (handedIn.kind === "broken")
    return shut("The work could not be read out of this link. It was probably cut short on its way here. Ask for it again.");

  /* The student has this link too: it is the one they copied. Opening it
     again should show them their work, not the marking screen, so the first
     thing it asks is which of the two is holding it. */
  if (!(await whoIsThis(handedIn.n || "the student"))){
    return openStudentView();
  }

  try{ lessonJson = await fetchLesson(); }
  catch(e){ return shut(e.message); }
  if (markingTest()) $("viewMode").hidden = true;

  /* One student, made to look like a class of one so the rest of the page
     does not have to know the difference. */
  const name = handedIn.n || "A student";
  roster = [{ username: "link", display_name: name }];
  rows = [{ username: "link", display_name: name, data: handedIn.d || {},
            feedback: handedIn.fb ? JSON.stringify(handedIn.fb) : "" }];
  if (handedIn.mk) marks.link = { score: handedIn.mk.score, outOf: handedIn.mk.outOf, grade: handedIn.mk.grade || "" };
  /* marked once already and sent back again: the marks changed then still stand */
  if (handedIn.ov && handedIn.ov.overrides) overridesBy.link = Object.assign({}, handedIn.ov.overrides);

  /* No class, so nobody to page to and no marks to compare. */
  document.querySelector(".worktabs").hidden = true;
  ["prevStu","nextStu","stuPick","refreshWork","workFresh"].forEach(id => { const e = $(id); if (e) e.remove(); });

  $("barTitle").textContent = "Marking " + name + " • " +
    (lessonJson && lessonJson.title ? lessonJson.title : lessonId);
  document.title = "Marking " + name;
  $("loadPane").hidden = true;
  tab("work");
  showStudent(0);
}

async function fetchLesson(){
  /* Offline the lessons folder is the only place a lesson can come from.
     With a server it is the database, and only the database: a leftover file
     of the same name must not stand in for what a teacher has published. */
  if (OFFLINE){
    const r = await fetch("lessons/" + encodeURIComponent(lessonId) + ".json", { cache:"no-store" });
    if (!r.ok) throw new Error("There is no lessons/" + lessonId + ".json.");
    return await r.json();
  }
  const reply = await fetch(API + "/api/catalog?lesson=" + encodeURIComponent(lessonId), { headers: H(), cache:"no-store" });
  const d = await reply.json();
  if (!reply.ok) throw new Error(d.error || "Could not open that lesson.");
  return d.lesson;
}
async function fetchRoster(){
  const r = await fetch(API + "/api/teacher/students?group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load the class.");
  return d.students || [];
}
async function fetchWork(){
  const r = await fetch(API + "/api/teacher/work?lesson=" + encodeURIComponent(lessonId) +
                        "&group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Could not load their work.");
  /* Lines ticked while marking live in the feedback. Laid over the work as
     it arrives, so every total on this screen counts them. raw keeps what
     the student saved, which is what an assessment's questions are marked
     from in the markbook, the same as the lesson page marks them. */
  return (d.rows || []).map(row => Object.assign({}, row,
    { raw: row.data,
      data: window.progressMath.withMarkingTicks(
        window.progressMath.withTeacherEdits(row.data, row.feedback), row.feedback) }));
}
/* What has been marked so far. Pulled out of boot so Refresh can ask for it
   again: a colleague marking the same class in the next room is exactly the
   sort of thing a teacher presses Refresh to see. */
async function loadMarks(){
  try{
    const r = await fetch(API + "/api/teacher/results?lesson=" + encodeURIComponent(lessonId) +
                          "&group=" + encodeURIComponent(cls), { headers: H(), cache:"no-store" });
    const d = await r.json();
    /* Kept whole for the markbook, which also wants the time taken and any
       mark a teacher changed by hand. */
    resultRows = d.rows || [];
    (d.rows || []).forEach(row => {
      /* By username: two students with the same name took each other's
         mark. The name is only for a server too old to send the username. */
      const st = row.username ? roster.find(x => x.username === row.username)
                              : roster.find(x => x.display_name === row.display_name);
      if (st) marks[st.username] = { score: row.score, outOf: row.out_of, grade: row.grade || "",
                                     strength: row.strength || "", target: row.target || "" };
    });
  }catch(e){}
}

/* The sign-in pop-up, when this tab has no session of its own. It stays open
   until the server accepts something, so a mistyped key is just a mistype. */
function askToSignIn(then){
  openModal(box => window.teacherAuth.form(box, {
    close: closeModal, then: then,
    why: "Sign in to see this class’s work." }));
}

/* Fetch what has been saved since the page was opened. Students carry on
   working while their work is being looked at, so what is on the screen goes
   stale within a lesson; without this the only way to see the rest was to
   reload and lose your place. */
async function refreshWork(){
  const btn = $("refreshWork");
  if (!btn || btn.disabled) return;
  const who = (roster[idx] || {}).username || "";
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "Checking…";
  $("workFresh").textContent = "";
  try{
    /* Fetched before the saves still going have landed, the list would come
       back without them and show those students unmarked again. */
    await saveChain;
    /* The lesson comes back as well: the frame is given this copy rather
       than fetching its own, so this is the one press that picks up a lesson
       a colleague has edited since this screen was opened. It is also the
       one thing here that can fail without spoiling the press, because the
       work is what Refresh is for and the copy already in hand still draws
       the page. */
    const [students, work, lesson] = await Promise.all([fetchRoster(), fetchWork(),
      PRACTICE ? Promise.resolve(null) : fetchLesson().catch(() => null)]);
    roster = students.sort(byUsername);
    rows = work;
    if (lesson) lessonJson = lesson;
    if (!PRACTICE) await loadMarks();
    if (!PRACTICE) lockedPages = await fetchLocks(lessonJson);
    /* Back to the same student, by name rather than by position: somebody
       added to the class since would otherwise shift everyone along. */
    const back = roster.findIndex(x => x.username === who);
    paintPicker();
    if (!PRACTICE) paintSecondTab();
    showStudent(back < 0 ? 0 : back);
    const now = new Date();
    $("workFresh").textContent = "Up to date as of " +
      String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  }catch(e){
    $("workFresh").textContent = e.message === "Failed to fetch" ? "Could not reach the server." : e.message;
  }finally{ btn.disabled = false; btn.textContent = label; }
}
on("refreshWork", "click", refreshWork);

/* ---------------- which half of the page is showing ---------------- */
/* The tab can be picked while the class is still loading. It is only
   remembered then, and the markbook or the work comes up once there is
   something to put in it: a teacher who knows they want the markbook should
   not have to wait for the work to arrive before they can say so. */
/* An assessment's Markbook button in the console asks for "markbook";
   either word opens whichever of the two this lesson has. */
let wantedTab = (qs.get("tab") === "progress" || qs.get("tab") === "markbook") ? "progress" : "work";
function tab(which){
  const progress = which === "progress";
  wantedTab = progress ? "progress" : "work";
  $("tabProgress").classList.toggle("on", progress);
  $("tabWork").classList.toggle("on", !progress);
  if (!$("loadPane").hidden) return;      // nothing to show yet
  const mb = markbookMode();
  $("progressPane").hidden = !progress || mb;
  $("markbookPane").hidden = !progress || !mb;
  $("workPane").hidden = progress;
  /* Drawn again on the way in, because marking on the other tab changes
     what it says: a mark saved there is a mark here. */
  if (progress && mb) paintMarkbookPane();
  else if (progress) syncProgressHeaderOffset();
  if (!progress && !framedYet) showStudent(idx);
}
on("tabProgress", "click", () => tab("progress"));
on("tabWork", "click", () => tab("work"));
tab(wantedTab);

/* ---------------- the markbook ----------------
   An assessment, standard or practical, has the markbook where a lesson has
   Progress. It moved here from a pop-up in the console, so the marks and
   the work behind them are one tab apart. markbook.js draws it; this page
   only hands over what it has already fetched. */
let resultRows = [];      // /api/teacher/results as it came, for the markbook
function markbookMode(){
  return !PRACTICE && !!(lessonJson && lessonJson.assessment);
}
function paintSecondTab(){
  if (markbookMode()) paintMarkbookPane(); else paintProgress();
}
function paintMarkbookPane(){
  if (!window.markbook) return;
  /* A mark saved on this page since it opened is in marks, not in the rows
     the server sent, so it is laid over them: the markbook says what Mark
     work just saved without waiting for Refresh. */
  const results = roster.map(st => {
    const row = resultRows.find(x => x.username ? x.username === st.username : x.display_name === st.display_name);
    const m = marks[st.username];
    if (!row && !m) return null;
    const out = Object.assign({ username: st.username, display_name: st.display_name }, row || {});
    if (m){
      out.score = m.score; out.out_of = m.outOf; out.grade = m.grade || "";
      if (m.strength !== undefined) out.strength = m.strength;
      if (m.target !== undefined) out.target = m.target;
    }
    return out;
  }).filter(Boolean);
  window.markbook.build({ lesson: lessonJson, roster: roster, work: rows, results: results,
                          title: (lessonJson && lessonJson.title) || lessonId, group: cls,
                          say: (t, text) => openModal(box => {
                            box.appendChild(el("h2","", t));
                            box.appendChild(el("p","modal-text", text));
                          }) });
  window.markbook.paint($("mbHolder"));
}

/* ---------------- the progress markbook ----------------
   A student's saved work already holds everything a quantifiable task needs
   to be marked: rQuiz's solved array, a checklist's checks and manual ticks,
   the answer to an mc/order/blanks/short block. This walks the lesson the
   same way buildPdf does (a page or a group is not itself a task, so it is
   opened rather than counted) and marks each leaf the same way the lesson
   page, the assessment mark and the admin markbook already do, so a total
   here is never a second opinion on a score shown somewhere else. */
/* quantifiableTasks, scoreTask and attempted now live in progressmath.js,
   shared with admin.html's unit-wide progress: the same lesson marked the
   same way wherever it is looked at. */
const TASK_LABEL = window.progressMath.TASK_LABEL;
function quantifiableTasks(){ return window.progressMath.quantifiableTasks(lessonJson); }
const scoreTask = window.progressMath.scoreTask;
const attempted = window.progressMath.attempted;

/* The pages this class cannot reach yet, so the markbook never asks about a
   task nobody has been able to attempt. Worked out exactly the way Manage
   does in the console, down to the same default when nobody has set locks
   by hand, because a page this reads as open has to be one the console
   agrees is open. Shared with admin.html's unit-wide progress and the
   comparison against a sibling lesson below, in progressmath.js. */
function defaultLocks(lesson){ return window.progressMath.defaultLocks(lesson); }
function fetchLocks(lesson){ return window.progressMath.fetchLockedPages(API, lessonId, cls, lesson); }

/* Task types picked out by the filter pills. Empty means no filter at all,
   which is why every pill opens unpicked: ticking one narrows the columns
   down to it, and there is no "everything" pill to press to get back,
   because un-ticking the one you picked already means that. */
let progressPicked = new Set();
let lockedPages = new Set();   // filled by fetchLocks in boot() and refreshWork()
let progressShowExt = false;   // extension tasks are left out until asked for
let progressHiddenCols = new Set();   // task ids a teacher has hidden by eye, for presenting the class
let shutProgressFullscreen = null;   // set while the full-screen markbook is open
let unitSiblings = null;   // null = not looked up yet; otherwise {before:[...]} in teaching order
let siblingCache = new Map();   // lesson id -> the result of markRoster against it, once fetched
let comparisonPrev = null;   // {title, pct} for the lesson before this one, false once known there isn't one
/* What the markbook is sorted by: "username", "displayName", "total" or a
   task id. */
let progressSort = { key: "username", dir: 1 };
function clickColumnSort(key){
  if (progressSort.key === key) progressSort.dir = -progressSort.dir;
  else progressSort = { key: key, dir: -1 };   // a mark you have just asked about is one you want the best or worst of first
  paintProgress();
}
function sortArrow(key){ return progressSort.key === key ? (progressSort.dir === 1 ? " ↑" : " ↓") : ""; }
/* Sticky headers stack: the page row pins to the top, and the task row
   pins just below it, however tall the page row turns out to be once its
   own text has wrapped. Getting that height needs a real layout, and
   paintProgress runs once while the pane is still hidden behind the
   loading screen, where everything measures as nothing; this is called
   again once the pane is actually shown, when the answer means something. */
function syncProgressHeaderOffset(){
  const table = $("progressTable");
  const rowPage = table && table.querySelector("thead tr:first-child");
  const rowTask = table && table.querySelector("thead tr:nth-child(2)");
  if (!rowPage || !rowTask) return;
  requestAnimationFrame(() => {
    const h = rowPage.getBoundingClientRect().height;
    if (!h) return;      // still hidden; whoever shows it next asks again
    Array.from(rowTask.children).forEach(th => { th.style.top = h + "px"; });
  });
}
/* The whole markbook, bigger: the filters, the table and the stats really
   are the same three elements, just moved into a full-screen pop-up and
   back again on the way out, rather than redrawn from scratch a second
   time in two places that could then disagree. getElementById finds them
   by id wherever in the document they currently sit, so paintProgress
   keeps working on whichever of the two copies is real without knowing
   there even is a pop-up. */
function openProgressFullscreen(){
  /* Already open: the button just moved inside it, so a second press on
     the same button asks to leave rather than to open a second one. */
  if (shutProgressFullscreen) return shutProgressFullscreen();
  const pane = $("progressPane");
  /* The stats stay behind: they are a summary of the table, not part of
     it, and a wall of numbers is not what a full screen view is for. */
  const parts = [$("progressFilters"), $("progressMsg"), document.querySelector(".progresswrap")]
    .filter(Boolean);
  const back = el("div","modal-back");
  const box = el("div","modal wide fullprev progress-full");
  const x = el("button","btn-ghost iconbtn modal-x","✕");
  x.title = "Close";
  const shut = () => {
    parts.forEach(p => pane.appendChild(p));
    back.remove();
    document.removeEventListener("keydown", esc);
    shutProgressFullscreen = null;
  };
  shutProgressFullscreen = shut;
  function esc(e){ if (e.key === "Escape") shut(); }
  x.addEventListener("click", shut);
  box.appendChild(x);
  parts.forEach(p => box.appendChild(p));
  back.appendChild(box);
  back.addEventListener("mousedown", (e) => { if (e.target === back) shut(); });
  document.addEventListener("keydown", esc);
  document.body.appendChild(back);
}
function paintProgress(){
  const filters = $("progressFilters"), table = $("progressTable"), msg = $("progressMsg");
  if (!filters || !table) return;
  const sheet = window.markbook && window.markbook.sheet;
  if (sheet) sheet.clear();
  /* A locked page is one the class cannot reach yet, so there is nothing
     behind its tasks worth asking about: a column of dashes for a page
     nobody could have opened would read as a class that has not tried,
     not as a page that is not open yet. Extension tasks are left out on
     the same principle by default: they are nobody's, until asked for. */
  const allTasks = quantifiableTasks();
  const openTasks = allTasks.filter(t => !lockedPages.has(t.pageIndex));
  const hasExt = openTasks.some(t => t.extension);
  const tasks = openTasks.filter(t => progressShowExt || !t.extension);
  filters.innerHTML = ""; table.innerHTML = "";

  /* the row over the table: which tasks, at one end; the spreadsheet's
     own buttons at the other, as on an assessment's markbook */
  const left = el("div","mbfilters");
  const tools = el("div","mbtools");
  const full = el("button","btn-ghost iconbtn progress-full-btn","");
  full.innerHTML = window.hubUI ? window.hubUI.icon("open", 17) : "⛶";
  full.title = "Show the markbook full screen";
  full.setAttribute("aria-label", "Show the markbook full screen");
  full.addEventListener("click", openProgressFullscreen);
  filters.appendChild(left);
  filters.appendChild(tools);
  const hint = $("progressHint");
  if (!tasks.length){
    tools.appendChild(full);
    msg.textContent = !openTasks.length
      ? (allTasks.length ? "Every page with a scored task on it is still locked for this class."
                         : "Nothing in this lesson can be scored automatically yet.")
      : "Every scored task left is inside an extension. Include extension tasks to see them.";
    if (hasExt) left.appendChild(extToggle());
    $("progressStats").innerHTML = "";
    $("progressTypes").hidden = true;
    if (hint) hint.hidden = true;
    return;
  }
  msg.textContent = "";
  if (hint) hint.hidden = false;
  const labels = [...new Set(tasks.map(t => t.label))];
  /* Only worth offering when there is more than one kind to choose between. */
  if (labels.length > 1){
    labels.forEach(label => {
      const pill = el("button","progress-pill" + (progressPicked.has(label) ? " on" : ""), label);
      pill.type = "button";
      pill.setAttribute("aria-pressed", progressPicked.has(label) ? "true" : "false");
      pill.addEventListener("click", () => {
        if (progressPicked.has(label)) progressPicked.delete(label); else progressPicked.add(label);
        paintProgress();
      });
      left.appendChild(pill);
    });
  }
  if (hasExt) left.appendChild(extToggle());
  const shown = progressPicked.size ? tasks.filter(t => progressPicked.has(t.label)) : tasks;

  /* Every mark, for every student, worked out once rather than once per
     sort: the column being sorted by is only known after this runs, and
     re-marking the whole class on every click would be asking scoreTask
     to do the same sum again for no reason. */
  const marks = {};      // username -> { taskId: {got,max}, total: {got,max} }
  roster.forEach(st => {
    const row = rows.find(r => r.username === st.username) || null;
    const data = row ? row.data : null;
    const perTask = {};
    let gotSum = 0, maxSum = 0;
    shown.forEach(t => {
      const sc = scoreTask(t.block, data ? data[t.id] : undefined);
      perTask[t.id] = sc;
      gotSum += sc.got; maxSum += sc.max;
    });
    marks[st.username] = { data: data, perTask: perTask, total: { got: gotSum, max: maxSum } };
  });

  const copyAll = el("button","btn-ghost bmini2","Copy all");
  copyAll.type = "button";
  copyAll.title = "Copy the whole table, ready to paste into a spreadsheet";
  copyAll.addEventListener("click", async () => {
    if (!sheet) return;
    copyAll.textContent = (await sheet.copyAll(table)) ? "Copied" : "Press Ctrl+C";
    setTimeout(() => { copyAll.textContent = "Copy all"; }, 1600);
  });
  const excel = el("button","btn-ghost bmini2","Save for Excel");
  excel.type = "button";
  excel.addEventListener("click", () => saveLessonMarkbook(shown, marks));
  tools.appendChild(copyAll);
  tools.appendChild(excel);
  tools.appendChild(full);

  const sorted = roster.slice().sort((a, b) => {
    const k = progressSort.key, d = progressSort.dir;
    let x, y;
    if (k === "username"){ x = a.username || ""; y = b.username || ""; }
    else if (k === "displayName"){ x = a.display_name || ""; y = b.display_name || ""; }
    else if (k === "total"){ x = marks[a.username].total.got; y = marks[b.username].total.got; }
    else { x = marks[a.username].perTask[k] ? marks[a.username].perTask[k].got : -1;
           y = marks[b.username].perTask[k] ? marks[b.username].perTask[k].got : -1; }
    if (typeof x === "string") return x.localeCompare(y) * d;
    if (x < y) return -1 * d;
    if (x > y) return 1 * d;
    return (a.username || "").localeCompare(b.username || "");   // a stable tie-break
  });

  const thead = el("thead"), tbody = el("tbody");
  table.appendChild(thead); table.appendChild(tbody);
  const rowPage = el("tr","mbgroup"), rowTask = el("tr");
  thead.appendChild(rowPage); thead.appendChild(rowTask);
  /* Columns for the same page sit under one heading between them, so a page
     with two checklists on it reads as one page with two columns rather
     than two unrelated columns that happen to be neighbours. An extension
     task never merges into its page's group: it is stamped with its own
     title in quantifiableTasks, so the two never look like one run. The
     three columns before them have no page, so one blank cell spans them. */
  const nameBlank = el("th","pcol-page pcol-lead");
  nameBlank.colSpan = 3;
  rowPage.appendChild(nameBlank);
  let i = 0;
  while (i < shown.length){
    let j = i + 1;
    while (j < shown.length && shown[j].pageIndex === shown[i].pageIndex &&
           shown[j].pageTitle === shown[i].pageTitle) j++;
    const pageHead = el("th","pcol-page" + (shown[i].extension ? " pcol-ext" : ""), shown[i].pageTitle);
    pageHead.colSpan = j - i;
    rowPage.appendChild(pageHead);
    i = j;
  }

  /* A heading sorts when pressed, unless the press was the end of a drag
     picking cells, which is the markbook's rule too. */
  const head = (label, key, cls, tip) => {
    const th = el("th","mbsort" + (cls ? " " + cls : "") + (progressSort.key === key ? " on" : ""));
    th.appendChild(el("span","", label + sortArrow(key)));
    th.dataset.copy = label;
    if (tip) th.title = tip;
    th.addEventListener("click", (e) => {
      if (e.shiftKey || (sheet && sheet.moved())) return;
      clickColumnSort(key);
    });
    return th;
  };
  rowTask.appendChild(head("Username", "username", "pcol-name"));
  rowTask.appendChild(head("Display name", "displayName"));
  rowTask.appendChild(head("Marks", "total", "pcol-total"));
  shown.forEach(t => {
    /* The type is what fits in the column; the page row above already says
       where it is, so the full title is left for a hover rather than
       crowding the header. */
    const th = head(t.label, t.id, "", t.pageTitle + " \u00b7 " + t.title);
    const hidden = progressHiddenCols.has(t.id);
    const eye = el("button","eye-toggle" + (hidden ? " off" : ""), "");
    eye.type = "button";
    eye.innerHTML = window.hubUI ? window.hubUI.icon("eye", 14) : "\u{1F441}";
    eye.title = hidden ? "Show this column's marks again" : "Hide this column's marks";
    eye.setAttribute("aria-label", eye.title);
    eye.addEventListener("mousedown", (e) => e.stopPropagation());
    eye.addEventListener("click", (e) => {
      e.stopPropagation();
      if (hidden) progressHiddenCols.delete(t.id); else progressHiddenCols.add(t.id);
      paintProgress();
    });
    th.appendChild(eye);
    rowTask.appendChild(th);
  });
  syncProgressHeaderOffset();

  sorted.forEach(st => {
    const m = marks[st.username];
    const tr = el("tr");
    const user = el("td","pcol-name", st.username || "");
    tr.appendChild(user);
    const name = el("td","");
    const open = el("span","mblink", st.display_name || "");
    open.title = "Open " + (st.display_name || "their") + "\u2019s work";
    open.addEventListener("click", () => { if (!(sheet && sheet.moved())) openStudentPreview(st); });
    name.appendChild(open);
    name.dataset.copy = st.display_name || "";
    tr.appendChild(name);
    const total = el("td","pcol-total", m.total.max ? m.total.got + " / " + m.total.max : "");
    total.dataset.copy = m.total.max ? String(m.total.got) : "";
    tr.appendChild(total);
    shown.forEach(t => {
      const sc = m.perTask[t.id];
      const td = el("td","progresscell mbtick");
      /* Hidden by eye rather than by filter: the mark still counts in the
         total, it is only the one cell that is not for showing right now,
         a projector in front of the class being the usual reason. */
      if (progressHiddenCols.has(t.id)){ td.appendChild(el("span","none","\u2022\u2022\u2022")); td.dataset.copy = ""; }
      else if (!attempted(m.data, t.id)){ td.appendChild(el("span","none","\u2013")); td.dataset.copy = ""; }
      else{
        const cls = sc.max === 0 ? "none" : sc.got === sc.max ? "yes" : sc.got > 0 ? "part" : "no";
        const mark = el("span", cls + " score", sc.got + "/" + sc.max);
        mark.title = "Open " + st.display_name + "\u2019s " + t.label.toLowerCase();
        mark.addEventListener("click", () => { if (!(sheet && sheet.moved())) openTaskPreview(st, t); });
        td.appendChild(mark);
        /* the mark itself: "1/2" pasted into Excel turns into a date */
        td.dataset.copy = String(sc.got);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  if (sheet) sheet.selectable(table);
  paintProgressStats(shown, marks);
}
/* Include extension tasks, or leave them out: a switch, the same one Unmarked
   only is, rather than a button that says what pressing it will do. */
function extToggle(){
  const sw = el("button","pace-switch progress-ext" + (progressShowExt ? " on" : ""));
  sw.type = "button";
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", progressShowExt ? "true" : "false");
  sw.appendChild(el("span","pace-switch-words", "Extension tasks"));
  sw.appendChild(el("span","pace-knob"));
  sw.addEventListener("click", () => { progressShowExt = !progressShowExt; paintProgress(); });
  return sw;
}
/* The same columns as the table, in the same order, with the page each task
   is on spelled out, because a spreadsheet has no row of page names above. */
function saveLessonMarkbook(shown, marks){
  const sheet = window.markbook && window.markbook.sheet;
  const head = ["Username", "Display name", "Marks", "Out of"];
  shown.forEach(t => head.push(t.pageTitle + ": " + t.label));
  const out = [head];
  roster.slice().sort((a, b) => (a.username || "").localeCompare(b.username || "")).forEach(st => {
    const m = marks[st.username];
    const row = [st.username || "", st.display_name || "", m.total.max ? m.total.got : "", m.total.max || ""];
    shown.forEach(t => row.push(attempted(m.data, t.id) ? m.perTask[t.id].got : ""));
    out.push(row);
  });
  if (sheet) sheet.save(out, ((lessonJson && lessonJson.title) || lessonId) + " " + cls);
}

/* ---------------- comparing against the rest of the unit ----------------
   Whether this lesson is ahead of, level with, or behind the one before it
   in the same unit. Reuses the same catalogue and per-lesson work fetch
   admin.html's unit-wide progress makes, aimed at one sibling lesson rather
   than a whole unit of them, so the cost of asking is the same as opening
   this markbook once more; nothing here is written anywhere. Run once in
   the background after boot, never blocking the markbook that is already
   on screen. */
async function fetchUnitSiblings(){
  if (unitSiblings !== null || PRACTICE || !lessonJson) return;
  try{
    const r = await fetch(API + "/api/catalog", { headers: H(), cache: "no-store" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "");
    const mine = (d.lessons || []).find(l => l.lesson_id === lessonId);
    const unit = mine ? (mine.unit || "") : "";
    if (!unit || !mine){ unitSiblings = { before: [] }; return; }
    const assigned = new Set((d.assignments || [])
      .filter(a => String(a.group_name || "").toLowerCase() === cls.toLowerCase())
      .map(a => a.lesson_id));
    const before = (d.lessons || [])
      .filter(l => l.unit === unit && l.lesson_id !== lessonId && assigned.has(l.lesson_id) &&
                   (l.position || 0) < (mine.position || 0))
      .sort((a, b) => (b.position || 0) - (a.position || 0));   // nearest first
    unitSiblings = { before: before };
  }catch(e){ unitSiblings = { before: [] }; }
}
/* One sibling lesson's class average, worked out the same way this lesson's
   own is: its own JSON for what counts as a task, its own work rows for
   what the class did with them. */
async function siblingProgress(sib){
  if (siblingCache.has(sib.lesson_id)) return siblingCache.get(sib.lesson_id);
  let result = null;
  try{
    const [lessonR, workR] = await Promise.all([
      fetch(API + "/api/catalog?lesson=" + encodeURIComponent(sib.lesson_id), { headers: H(), cache: "no-store" }),
      fetch(API + "/api/teacher/work?lesson=" + encodeURIComponent(sib.lesson_id) +
            "&group=" + encodeURIComponent(cls), { headers: H(), cache: "no-store" })
    ]);
    const lessonD = await lessonR.json(), workD = await workR.json();
    if (lessonR.ok && workR.ok){
      const locks = await window.progressMath.fetchLockedPages(API, sib.lesson_id, cls, lessonD.lesson);
      result = window.progressMath.markRoster(lessonD.lesson, roster, workD.rows || [], locks);
    }
  }catch(e){}
  siblingCache.set(sib.lesson_id, result);
  return result;
}
async function loadComparison(){
  await fetchUnitSiblings();
  const prev = unitSiblings.before[0];
  if (!prev){ comparisonPrev = false; return; }
  const res = await siblingProgress(prev);
  comparisonPrev = (res && res.pct !== null) ? { title: prev.title || prev.lesson_id, pct: res.pct } : false;
}

/* The cheap, whole-lesson numbers underneath the markbook. Nothing here
   costs more than adding up marks paintProgress had to work out anyway, so
   it never has a different idea of a mark than the table above it, and it
   moves with the same pills, the same Include Extension Tasks and the
   same locked pages, though not with the eye icons: what a mark counts
   for does not change because it is not being shown right now. */
function paintProgressStats(shown, marks){
  const box = $("progressStats");
  if (!box) return;
  box.innerHTML = "";
  $("progressTypes").hidden = true;
  const totals = roster.map(st => marks[st.username].total).filter(t => t.max > 0);
  if (!totals.length) return;
  const pctOf = (t) => Math.round(100 * t.got / t.max);
  const pctClass = (p) => p >= 80 ? "yes" : p >= 50 ? "part" : "no";
  const stat = (big, small, cls) => {
    const c = el("div","mbstat");
    c.appendChild(el("b", cls || "", big));
    c.appendChild(el("span","", small));
    return c;
  };

  const pcts = totals.map(pctOf);
  const avg = Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
  const bands = { high: pcts.filter(p => p >= 80).length,
                  mid: pcts.filter(p => p >= 50 && p < 80).length,
                  low: pcts.filter(p => p < 50).length };
  const attemptedCount = roster.filter(st => shown.some(t => attempted(marks[st.username].data, t.id))).length;
  const fullCount = totals.filter(t => t.got === t.max).length;
  const strugglingCount = totals.filter(t => t.got < t.max * 0.5).length;

  box.appendChild(stat(attemptedCount + " of " + roster.length, "Attempted"));
  box.appendChild(stat(avg + "%", "Average", pctClass(avg)));
  /* Against the lesson before this one in the same unit, once it is known:
     fetched in the background by loadComparison and repainted in when it
     arrives, so the rest of the stats are never held up waiting for it. */
  if (comparisonPrev){
    const diff = avg - comparisonPrev.pct;
    const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
    box.appendChild(stat(arrow + " " + Math.abs(diff) + "%",
      "vs " + comparisonPrev.title + " (" + comparisonPrev.pct + "%)",
      diff > 0 ? "yes" : diff < 0 ? "no" : ""));
  }
  box.appendChild(stat(bands.high + " / " + bands.mid + " / " + bands.low, "80%+ · 50–79% · under 50%"));
  box.appendChild(stat(String(fullCount), "Full marks", fullCount ? "yes" : ""));
  box.appendChild(stat(String(strugglingCount), "Under half", strugglingCount ? "no" : ""));

  /* One average per task type, however many columns of it there are, so
     two checklists on different pages still read as one Coding task
     figure; the weakest single column is kept apart from that, because
     two checklists miles apart in how the class did would average into a
     figure that points at neither of them. */
  const byLabel = {};
  let weakest = null;
  shown.forEach(t => {
    const b = byLabel[t.label] || (byLabel[t.label] = { got:0, max:0 });
    let got = 0, max = 0;
    roster.forEach(st => { const sc = marks[st.username].perTask[t.id]; got += sc.got; max += sc.max; });
    b.got += got; b.max += max;
    if (max){
      const p = Math.round(100 * got / max);
      if (!weakest || p < weakest.pct) weakest = { t, pct: p };
    }
  });
  if (weakest) box.appendChild(stat(weakest.pct + "%",
    "Weakest: " + weakest.t.label + " · " + weakest.t.pageTitle, pctClass(weakest.pct)));

  const typesRow = $("progressTypes");
  typesRow.innerHTML = "";
  typesRow.hidden = false;
  typesRow.appendChild(el("b","","By task type"));
  const list = el("div","progress-typeavgs");
  Object.keys(byLabel).forEach(label => {
    const b = byLabel[label];
    if (!b.max) return;
    const p = Math.round(100 * b.got / b.max);
    list.appendChild(el("span","typeavg " + pctClass(p), label + " " + p + "%"));
  });
  typesRow.appendChild(list);
}

/* What a student's work looks like with nothing else on the page: no
   comments, no marking. Both work pop-ups hand this the same shape and get
   the same read-only frame back, from the same hub_inspect key the "View
   work" tab's own frame uses. */
function setInspectPayload(st, row){
  const payload = {
    lesson: lessonId, idx: 0, json: OFFLINE ? undefined : lessonJson,
    list: [{ name: st.display_name, username: st.username,
             data: row ? row.data : {}, feedback: "" }]
  };
  try{ localStorage.setItem("hub_inspect", JSON.stringify(payload)); }
  catch(e){ delete payload.json; localStorage.setItem("hub_inspect", JSON.stringify(payload)); }
}
/* The shape behind both work pop-ups: a full-screen frame with its own
   close button, closable by Escape or by clicking outside it, and an
   optional bar along the bottom for whatever the caller wants there.

   Built the way author.html's openFullPreview is, rather than through
   openModal: that one wraps anything past a single child in a scrolling
   middle, which is right for a form and wrong for an iframe meant to fill
   the whole thing. */
/* Closes whichever of these is currently open, if one is. Each call to
   openWorkPreview builds its own back and its own Escape listener rather
   than sharing mBack, so without this a second click before the first has
   closed leaves one stuck behind the other with no way to reach either's
   close button, and the first's listener leaking silently besides. */
let shutWorkPreview = null;
function openWorkPreview(src, frameTitle, buildFoot){
  if (shutWorkPreview) shutWorkPreview();
  const back = el("div","modal-back");
  const box = el("div","modal wide fullprev");
  const x = el("button","btn-ghost iconbtn modal-x","\u2715");
  x.title = "Close";
  const shut = () => {
    back.remove();
    document.removeEventListener("keydown", esc);
    shutWorkPreview = null;
  };
  shutWorkPreview = shut;
  function esc(e){ if (e.key === "Escape") shut(); }
  x.addEventListener("click", shut);
  box.appendChild(x);
  const frame = document.createElement("iframe");
  frame.className = "fullprev-frame";
  frame.allow = "fullscreen";              // a screenshot can be opened full screen
  frame.title = frameTitle;
  frame.src = src;
  box.appendChild(frame);
  if (buildFoot) box.appendChild(buildFoot(shut));
  back.appendChild(box);
  back.addEventListener("mousedown", (e) => { if (e.target === back) shut(); });
  document.addEventListener("keydown", esc);
  document.body.appendChild(back);
}
/* One task, one student, on its own: what clicking a mark opens. The same
   lesson.html view the "View work" tab already uses, jumped to the right
   page and told which task to point at. */
/* The way out of either pop-up into the real marking screen: the same
   student, on the page this pop-up was about. Left undefined, showStudent
   falls back to lastStep, the page whoever was looked at before this one
   was left on, which is the right answer for the summary screen, since
   that is never a page of its own to jump back to. */
function addFeedbackFoot(st, pageIndex){
  return (shut) => {
    const foot = el("div","fullprev-foot");
    const btn = el("button","btn-primary","Add feedback");
    btn.addEventListener("click", () => {
      shut();
      const at = roster.findIndex(x => x.username === st.username);
      if (at >= 0){ idx = at; tab("work"); showStudent(at, pageIndex); }
    });
    foot.appendChild(btn);
    return foot;
  };
}
function openTaskPreview(st, t){
  setInspectPayload(st, rows.find(r => r.username === st.username) || null);
  openWorkPreview(
    "lesson.html?id=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls) +
      "&view=1&embed=1&step=" + t.pageIndex + "&highlight=" + encodeURIComponent(t.id),
    t.label + " \u00b7 " + st.display_name + " \u00b7 " + t.pageTitle,
    addFeedbackFoot(st, t.pageIndex));
}
/* A whole student's work, on its own: what clicking a name in the markbook
   opens, on their summary screen since that is the one page that is never
   any particular task. &group= is what lets that screen's achievement
   card ask the same question the Progress tab already asked: which pages
   are actually released to this class, so its own total never counts a
   page nobody here could have reached. */
function openStudentPreview(st){
  setInspectPayload(st, rows.find(r => r.username === st.username) || null);
  openWorkPreview(
    "lesson.html?id=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls) +
      "&view=1&embed=1&summary=1",
    st.display_name + "\u2019s work",
    addFeedbackFoot(st));
}

/* ---------------- one student's work ---------------- */

/* Putting a new address on the frame only reloads it if the address has
   changed, so every student used to carry a timestamp on the end of theirs.
   That also meant the browser could never reuse the copy of lesson.html it
   already had: a third of a megabyte down the wire between one child and the
   next. Navigating the frame's own window reloads it whether the address has
   changed or not, so the timestamp can go and the cache can do its job. */
let framedYet = false;
function frameGo(url){
  framedYet = true;
  sendFrame($("workFrame"), url);
}
function sendFrame(frame, url){
  try{
    if (frame.contentWindow) return frame.contentWindow.location.replace(url);
  }catch(e){}
  frame.src = url;
}

/* ---------------- the next student, ready before they are asked for -------
   The frame is a whole lesson page, started again for every student, and
   that takes long enough to show its loading dots. Once Save and next stopped
   waiting for the save, the feedback column moved on at once and the work
   beside it sat on those dots, which is the wait that was left.

   So the next student is loaded in a second frame, out of sight behind this
   one, a moment after this one has finished arriving. Save and next, Next or
   the arrow then swaps the two over, and the work is already there. Anything
   else, or a next student whose work or page has changed since, loads the
   ordinary way.

   Each frame reads its student from its own storage key (data-inspect), so
   loading one never changes what the other is about to read. */
let spareKey = "";          // what the spare was loaded as, to tell if it still fits
let spareLesson = null;     // the lesson it was given; Refresh hands out a new one
let spareScroll = 0;        // how far down it was asked to open
let spareTimer = 0;
const spareHeld = [];       // what it said while out of sight, kept for when it is shown
/* Starting a lesson page holds up this one too, the two sharing a thread, so
   the spare waits until the work on screen has been drawn and settled. */
const SPARE_WAIT_MS = 700;

/* The box and address for one student, the same whichever frame shows them. */
function frameFor(i, step, frame){
  const st = roster[i];
  const row = rows.find(r => r.username === st.username);
  const draft = drafts[st.username] || null;
  /* Coming back to unsaved marking, the frame is shown it too: the code as
     it was being put right, and the lines ticked, so the work and the boxes
     beside it agree. */
  let frameFeedback = row ? (row.feedback || "") : "";
  if (draft){
    let f = {};
    try{ f = JSON.parse(frameFeedback || "{}") || {}; }catch(e){ f = { comment: frameFeedback }; }
    f.ticks = draft.markingTicks;
    frameFeedback = JSON.stringify(f);
  }
  /* The lesson page reads this to know whose work to put on the screen, and
     the lesson itself goes with it. The frame is loaded again for every
     student, and it used to ask the API for the same lesson every time: one
     round trip to the server, in front of the work, thirty times for a class
     of thirty. This page already fetched it when it opened. Refresh is what
     fetches it again, so a lesson edited next door is one press away. */
  const box = {
    /* Offline the frame reads the lesson out of the lessons folder and could
       not use this copy anyway, and that browser's storage is where a
       student's own work lives. */
    lesson: lessonId, idx: 0, json: OFFLINE ? undefined : lessonJson,
    list: [{ name: st.display_name, username: st.username,
             data: Object.assign({}, row ? row.data : {}, draft ? draft.pendingEdits : {}),
             feedback: frameFeedback,
             /* any question already re-marked, so the frame starts from the saved score */
             overrides: overridesFor(st.username) || undefined }]
  };
  /* A test is marked question by question in a page of its own, which has
     no pages to step through and no summary to jump to. */
  if (markingTest()){
    const page = "lesson.html?id=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls) +
      "&view=1&embed=1&marking=1";
    return {
      box: box,
      key: JSON.stringify([page, box.list]),
      url: page + (frame.dataset.inspect === "hub_inspect_next" ? "&box=next" : "") +
        (lastScroll > 0 ? "&scroll=" + lastScroll : "")
    };
  }
  /* The progress bar in the frame counts the summary as one past the last
     page, the same as the teacher console does, and posts that number out
     when it opens. Asking for it again by number would clamp to the last
     page, so it is asked for by name. */
  const pages = ((lessonJson && lessonJson.blocks) || []).length;
  const onSummary = !allPages && step !== undefined && step >= pages;
  const page = "lesson.html?id=" + encodeURIComponent(lessonId) + "&group=" + encodeURIComponent(cls) +
    "&view=1&embed=1" + (allPages ? "&all=1" : "") +
    (onSummary ? "&summary=1" : "") +
    (step !== undefined && !allPages && !onSummary ? "&step=" + step : "") +
    /* A screenshot open full screen stays open, now showing this student's,
       so a class's pictures can be read one after another at full size. The
       frame is a new page for every student and would otherwise close it. */
    (lastFull ? "&full=" + encodeURIComponent(lastFull) : "");
  return {
    box: box,
    /* the scroll is left out: the spare is told that on being shown */
    key: JSON.stringify([page, box.list]),
    url: page + (frame.dataset.inspect === "hub_inspect_next" ? "&box=next" : "") +
      /* the same distance down as well as the same page, so the question
         being read down the class stays where the eye already is */
      (lastScroll > 0 ? "&scroll=" + lastScroll : "")
  };
}
function handFrame(frame, box){
  const key = frame.dataset.inspect || "hub_inspect";
  try{ localStorage.setItem(key, JSON.stringify(box)); }
  catch(e){
    /* A long lesson and a page of work together can be more than this
       browser will keep. The work is the part that cannot be asked for
       again from inside the frame, so the lesson is what goes. */
    delete box.json;
    localStorage.setItem(key, JSON.stringify(box));
  }
}

/* Asked for once the frame on screen has finished arriving, and again when
   the teacher turns to another page, which the spare has to be on as well. */
function planSpare(wait){
  clearTimeout(spareTimer);
  if (OFFLINE || PRACTICE || !$("spareFrame")) return;
  spareTimer = setTimeout(loadSpare, wait);
}
function loadSpare(){
  const i = stepFrom(idx, 1);
  if (i < 0) return;
  const spare = $("spareFrame");
  const want = frameFor(i, lastStep, spare);
  if (want.key === spareKey && spareLesson === lessonJson) return;   // ready already
  handFrame(spare, want.box);
  spareKey = want.key;
  spareLesson = lessonJson;
  spareScroll = lastScroll;
  spareHeld.length = 0;
  sendFrame(spare, want.url);
}
/* The spare becomes the frame on screen, if it is the student wanted. What
   it said while out of sight is handed back, to be heard now. */
function swapInSpare(key){
  const spare = $("spareFrame"), live = $("workFrame");
  if (!spare || !spareKey || key !== spareKey || spareLesson !== lessonJson) return null;
  live.id = "spareFrame"; spare.id = "workFrame";
  live.classList.add("spare"); spare.classList.remove("spare");
  live.setAttribute("aria-hidden", "true"); spare.removeAttribute("aria-hidden");
  live.tabIndex = -1; spare.removeAttribute("tabindex");
  const title = live.title; live.title = spare.title; spare.title = title;
  spareKey = "";
  const held = spareHeld.splice(0);
  if (lastScroll !== spareScroll){
    try{ spare.contentWindow.postMessage({ hubWorkScrollTo: lastScroll }, location.origin); }catch(e){}
  }
  framedYet = true;
  return held;
}
/* Everything the spare says waits until it is the one on screen: it is
   somebody else's work, and its Strength and Target, its ticks and its page
   are about them, not the student whose feedback is in the boxes. This is
   the first message listener on the page, so it is heard before the rest. */
window.addEventListener("message", (e) => {
  const spare = $("spareFrame");
  if (!spare || !e || !e.source || e.source !== spare.contentWindow) return;
  e.stopImmediatePropagation();
  spareHeld.push(e.data);
});
function replayHeld(held){
  const from = $("workFrame").contentWindow;
  held.forEach(data => {
    try{ window.dispatchEvent(new MessageEvent("message", { data: data, source: from, origin: location.origin })); }
    catch(e){}
  });
}
/* Two students sharing a display name are still two different rows in the
   picker, so whichever shares it is given as much of their username as
   tells them apart: a letter first, and a second only if the first one
   still leaves them alike. Beyond that they are left alike; a class where
   two students match on both name and the start of their username is not
   one this is meant to solve on its own.

   Written the way an initial is, not the way a username is: a capital
   then a lower case letter, with nothing to mark it out as a fragment of
   something else, since it reads as one no matter what case the real
   username happens to be in. */
/* Two students with the same name are told apart by their usernames, in
   full. The first letter or two of it, which this used to add, made "Ada
   Bell Ad", which read as a name cut short rather than as a way of telling
   two Ada Bells apart. */
function pickerDisambig(st, group){
  if (group.length < 2 || !st.username) return "";
  return " (" + st.username + ")";
}
function paintPicker(){
  const sel = $("stuPick");
  if (!sel) return;             // a single hand-in has nobody to page between
  sel.innerHTML = "";
  const byName = {};
  roster.forEach(st => { (byName[st.display_name] = byName[st.display_name] || []).push(st); });
  const only = unmarkedOnly();
  roster.forEach((st, i) => {
    const marked = isMarked(st);
    /* the student on screen stays in the list, or it would show somebody else */
    if (only && marked && i !== idx) return;
    const o = document.createElement("option");
    o.value = String(i);
    const row = rows.find(r => r.username === st.username);
    const has = PRACTICE ? programsOf(row).length : !!row;
    o.textContent = st.display_name + pickerDisambig(st, byName[st.display_name]) +
      (marked ? "  \u00b7 \u2713 Marked" : has ? "" : (PRACTICE ? "  \u00b7 no programs" : "  \u00b7 nothing saved"));
    sel.appendChild(o);
  });
  sel.value = String(idx);
  const btn = $("onlyUnmarked");
  if (btn){
    btn.hidden = PRACTICE;
    btn.setAttribute("aria-pressed", only ? "true" : "false");
    btn.classList.toggle("on", only);
  }
}
/* Marked is feedback saved for them, the same thing the Save button says.
   A class is marked in more than one sitting, so the ones done already are
   marked in the list, and can be left out of it and out of Next altogether. */
function isMarked(st){
  if (PRACTICE || !st) return false;
  return savedFeedback(rows.find(r => r.username === st.username));
}
const UNMARKED_KEY = "hub_mark_unmarked";
function unmarkedOnly(){
  if (PRACTICE) return false;
  try{ return localStorage.getItem(UNMARKED_KEY) === "1"; }catch(e){ return false; }
}
/* The next student one way or the other, past anyone already marked when
   only the unmarked are wanted, or -1 when there is nobody left that way. */
function stepFrom(from, dir){
  for (let i = from + dir; i >= 0 && i < roster.length; i += dir){
    if (!unmarkedOnly() || !isMarked(roster[i])) return i;
  }
  return -1;
}
function goStep(dir, saved){
  const i = stepFrom(idx, dir);
  if (i >= 0){ showStudent(i); return; }
  const word = unmarkedOnly() ? "Everyone is marked that way." : "That was the last one.";
  /* nowhere further to go is news, so it is said over Marked */
  $("fbFoot").classList.remove("marked");
  $("fbMsg").textContent = (saved ? "Saved. " : "") + word;
}
window.addEventListener("message", (e) => {
  if (e && e.data && typeof e.data.hubWorkStep === "number"){
    /* A different page has no picture of that task on it, and keeping the
       note would pop the picture open again on whichever student is opened
       after the teacher comes back to its page. */
    if (e.data.hubWorkStep !== lastStep) lastFull = "";
    lastStep = e.data.hubWorkStep;
  }
  /* only from the frame the students are paged through, not the pop-ups
     opened from Progress, which are the same page embedded */
  if (e && e.data && typeof e.data.hubWorkFull === "string" &&
      e.source === $("workFrame").contentWindow) lastFull = e.data.hubWorkFull;
  if (e && e.data && typeof e.data.hubWorkScroll === "number") lastScroll = e.data.hubWorkScroll;
  /* the next student has to open on the page this one is on now */
  if (e && e.data && e.source === $("workFrame").contentWindow &&
      (typeof e.data.hubWorkStep === "number" || typeof e.data.hubWorkFull === "string"))
    planSpare(SPARE_WAIT_MS);
});
function showStudent(i, step){
  if (i < 0 || i >= roster.length) return;
  if (PRACTICE) return showPrograms(i);
  /* whatever was being written for the one on screen, kept before it goes */
  stashDraft();
  /* stay on the same page when moving to the next student */
  if (step === undefined) step = lastStep;
  idx = i;
  paintPicker();
  const st = roster[i];
  const row = rows.find(r => r.username === st.username);
  const draft = drafts[st.username] || null;
  clearTimeout(spareTimer);
  const want = frameFor(i, step, $("workFrame"));
  const held = swapInSpare(want.key);
  /* the last student's score goes until this one's frame says theirs */
  $("fbScoreRow").hidden = true;
  if (!held){
    handFrame($("workFrame"), want.box);
    frameGo(want.url);
  }
  $("fbWho").textContent = st.display_name + " · " + st.username + (row ? "" : " · nothing saved");
  /* a practical assessment is marked by hand, so the boxes appear */
  paintMarking(st.username);
  loadFeedback(row);
  /* What opening them gives, before anything is put back, so leaving with
     nothing changed keeps nothing. */
  loadedKey = draftKey(draftNow());
  shownUser = st.username;
  carriedEdits = {};
  if (draft) restoreDraft(row, draft);
  /* Their feedback is saved already, so the buttons say so and Next moves
     on without saving it again, until something is changed. */
  paintFb(draft ? "idle" : savedFeedback(row) ? "saved" : "idle");
  if (draft) $("fbMsg").textContent = "Not saved yet. This is where you left it.";
  paintBehind();
  if (held){
    /* the spare said these as it opened, before it was anyone's on screen */
    replayHeld(held);
    /* Arrived already, so no load is coming to ask for the next one. One
       still arriving asks for it itself when it gets there. */
    const doc = $("workFrame").contentDocument;
    if (doc && doc.readyState === "complete") planSpare(SPARE_WAIT_MS);
  }
}

/* ---------------- unsaved marking, kept while the page is open ----------
   Going back a student to check something used to throw away what had been
   typed and ticked for the one on screen. Now each student's unsaved
   marking is kept here, by username, and put back on returning to them.

   Only in this page's memory, on purpose: it goes when the page is reloaded
   or closed, and when that student is saved. sessionStorage would have
   survived a reload, and a reload is how a teacher says start again. */
const drafts = {};
let shownUser = "";        // whose marking the boxes hold
let loadedKey = "";        // what they held when that student opened
/* Code put right before moving away, handed back to the frame on return.
   The frame only reports what differs from the code it opened with, which
   is then this, so the two are put together rather than one replacing it. */
let carriedEdits = {};
function draftNow(){
  return { strength: $("fbStrength").value, target: $("fbTarget").value,
           comment: $("fbComment").value, score: $("fbScore").value,
           notSaved: notSaved, notSavedWas: notSavedWas, notSavedAway: notSavedAway,
           commentOpen: commentOpen,
           markingTicks: JSON.parse(JSON.stringify(markingTicks)),
           manualTicks: JSON.parse(JSON.stringify(manualTicks)),
           got: Object.assign({}, got),
           pendingEdits: JSON.parse(JSON.stringify(pendingEdits)),
           listOpen: Object.assign({}, listOpen),
           ask: ask, asking: !$("fbAsk").hidden };
}
function draftKey(d){
  return JSON.stringify([d.strength, d.target, d.comment, d.score, d.notSaved,
                         d.markingTicks, d.got, d.pendingEdits]);
}
function stashDraft(){
  if (PRACTICE || !shownUser) return;
  const d = draftNow();
  /* saved, or exactly as it opened: nothing to keep */
  if ($("saveFb").dataset.saved === "yes" || draftKey(d) === loadedKey){ delete drafts[shownUser]; return; }
  drafts[shownUser] = d;
}
function restoreDraft(row, d){
  $("fbStrength").value = d.strength;
  $("fbTarget").value = d.target;
  $("fbComment").value = d.comment;
  $("fbScore").value = d.score;
  notSaved = d.notSaved; notSavedWas = d.notSavedWas; notSavedAway = d.notSavedAway;
  $("notSaved").checked = notSaved;
  commentOpen = d.commentOpen;
  markingTicks = JSON.parse(JSON.stringify(d.markingTicks));
  manualTicks = JSON.parse(JSON.stringify(d.manualTicks));
  got = Object.assign({}, d.got);
  pendingEdits = JSON.parse(JSON.stringify(d.pendingEdits));
  carriedEdits = JSON.parse(JSON.stringify(d.pendingEdits));
  /* back to the same step of the list, or the same question */
  if (byQuestions()){
    if (d.ask && d.ask.row && d.ask.row.username === ((row && row.username) || "")){
      ask = d.ask;
      if (row) ask.row = row;          // Refresh hands out new rows
      showAsk(d.asking);
      if (d.asking) paintAsk();
    }
  } else {
    listOpen = Object.assign({}, d.listOpen);
    paintList(row);
  }
  paintNotSaved();
  paintNotSavedOffer(row);
}
/* ---------------- one student's practice programs ----------------
   The sandbox itself, in the frame, reading the programs out of localStorage
   the way lesson.html reads a hand-in: it is the editor they were written in,
   so a teacher sees the colouring, the files beside main.py and the console,
   and can press Run to find out what the program actually does.

   Nothing in the frame writes. What it does do is say which program is open,
   because that is what the feedback down the right is about. */
const INSPECT = "hub_sandbox_inspect";
let progs = [];            // the open student's programs
let progNotes = {};        // program id -> what has been written about it
let openProg = "";         // which one the frame is showing

function programsOf(row){
  const list = (row && row.data && Array.isArray(row.data.programs)) ? row.data.programs : [];
  return list.filter(p => p && typeof p === "object" && p.id);
}
function notesOf(row){
  try{
    const all = JSON.parse((row && row.feedback) || "{}") || {};
    const p = all.programs;
    return (p && typeof p === "object" && !Array.isArray(p)) ? p : {};
  }catch(e){ return {}; }
}

function showPrograms(i){
  idx = i;
  paintPicker();
  const st = roster[i];
  const row = rows.find(r => r.username === st.username);
  progs = programsOf(row);
  progNotes = notesOf(row);
  /* Whichever they were reading stays open where the next student has one of
     their own; otherwise the list, which is the honest thing to show when
     there is nothing in common between two children's programs. */
  openProg = progs.some(p => p.id === openProg) ? openProg : "";
  try{
    localStorage.setItem(INSPECT, JSON.stringify({
      name: st.display_name, username: st.username,
      programs: progs, notes: progNotes, open: openProg }));
  }catch(e){}
  frameGo("sandbox.html?view=1&embed=1");
  $("fbWho").textContent = st.display_name + " · " + st.username + (progs.length ? "" : " · no programs");
  $("markWrap").hidden = true;
  paintProgPick();
  loadProgFeedback();
  paintFb("idle");
}

function paintProgPick(){
  const wrap = $("progWrap"), sel = $("progPick");
  if (!wrap || !sel) return;
  wrap.hidden = false;
  sel.innerHTML = "";
  const none = document.createElement("option");
  none.value = "";
  none.textContent = progs.length ? "Choose a program" : "No programs yet";
  sel.appendChild(none);
  progs.forEach(p => {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = (p.name || "Program") + (progNotes[p.id] ? "  · feedback given" : "");
    sel.appendChild(o);
  });
  sel.value = openProg;
  sel.disabled = !progs.length;

}

   feedback on one of the programs in it. */
