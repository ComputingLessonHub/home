/* ---------------- feedback ---------------- */
function showing(which){
  if (notSaved && (which === "Strength" || which === "Target")) return false;
  return !!$("fb" + which).value.trim();
}
function loadFeedback(row){
  let f = {};
  if (row && row.feedback){
    try{ f = JSON.parse(row.feedback); }catch(e){ f = { comment: row.feedback }; }
  }
  $("fbComment").value = f.comment || "";
  commentOpen = false;
  notSaved = !!f.notSaved;
  notSavedWas = "";
  listWas = null;
  $("notSaved").checked = notSaved;
  /* Nothing of theirs to mark, so no Mark either, whether they
     were away or were there and lost it. A class rather than `hidden`,
     because paintMarking() owns that. */
  $("workSide").classList.toggle("fbempty",
    !PRACTICE && !!lessonJson && !window.progressMath.hasWork(lessonJson, row && row.data));
  /* Lines ticked while marking this student, saved with their feedback. A
     fresh copy for each student, so one child's ticks never travel with the
     next one's feedback. */
  markingTicks = (f.ticks && typeof f.ticks === "object") ? JSON.parse(JSON.stringify(f.ticks)) : {};
  /* and what was ticked on the list, kept with them for the same reason */
  got = (f.got && typeof f.got === "object") ? Object.assign({}, f.got) : {};
  pendingEdits = {};
  manualTicks = {};
  Object.keys(markingTicks).forEach(id => { if (markingTicks[id].manual) manualTicks[id] = markingTicks[id].manual; });
  /* An assessment marks itself and writes a strength and a target as it does.
     A teacher is editing those rather than starting from nothing, so whatever
     the assessment came up with fills the boxes until they write their own. */
  const auto = (row && marks[row.username]) || {};
  /* A practical has no questions to mark itself from, but its checklist lines
     can carry a Strength and a Target each. Those are put together for this
     student the same way, so a class of thirty is thirty reads and a press of
     Save rather than thirty sentences written from nothing. Never over
     anything already saved. */
  const nothingSaved = !f.strength && !f.target && !auto.strength && !auto.target;
  /* Nothing in a practical at all almost always means they were away for
     it. Every question would be a No and the target would be the first
     thing on the rubric, which is not what they need to hear, so the
     boxes say they were not here instead, and the questions wait. */
  const away = nothingSaved && !!(lessonJson && lessonJson.practical) && !PRACTICE &&
               !window.progressMath.hasWork(lessonJson, row && row.data);
  const fromList = (nothingSaved && !away) ? autoFor(row) : null;
  const awayWords = away ? window.progressMath.absentFeedback(lessonJson) : null;
  $("fbStrength").value = f.strength || auto.strength || (awayWords ? awayWords.strength : fromList ? fromList.strength : "");
  $("fbTarget").value = f.target || auto.target || (awayWords ? awayWords.target : fromList ? fromList.target : "");
  /* An assessment with STAR feedback switched off in the builder is given
     a mark and nothing more, so there is no Strength or Target to write.
     A comment still has its box. */
  const noStar = !!(lessonJson && lessonJson.assessment && !lessonJson.practical && lessonJson.star === false);
  ["fbStrengthWrap","fbTargetWrap"].forEach(id => { $(id).hidden = noStar; });
  notSavedAway = away;
  $("fbMsg").textContent = away
    ? AWAY_MSG
    : fromList && (fromList.strength || fromList.target)
    ? "Filled in from the ticks."
    : "";
  /* What the ticks say now. While the boxes still read exactly this, they
     are the ticks' words rather than the teacher's, and a tick given while
     marking can change them. */
  const now = autoFor(row) || {};
  lastAuto = { strength: now.strength || "", target: now.target || "" };
  /* Feedback already saved for this student is shown as it was saved; the
     questions are for writing it the first time, and a button away after.
     A saved "not saved properly" tick is not counted: the list waits behind
     it at the start, so unticking it opens on the ticks rather than on a
     Strength and Target nobody wrote. */
  feedbackMode(row, !!(f.strength || f.target) || away);
  paintNotSaved();
  paintNotSavedOffer(row);
}
/* ---------------- present, but nothing saved ----------------
   Nothing saved usually means away, and the boxes say so. Sometimes they
   were there and it was lost, and a Strength or Target would be about work
   nobody can see. Ticked, those go and the lesson's comment for lost work
   is written in the comment box instead, still there to be changed. */
let notSaved = false;
let notSavedWas = "";    // the comment box before the tick wrote over it
let notSavedAway = false; // the boxes underneath say they were away
let listWas = null;       // where the tick list stood when the tick was given
const AWAY_MSG = "Nothing saved, so these say they were away.";
function paintNotSaved(){
  $("workSide").classList.toggle("fbnotsaved", notSaved);
  if (notSaved) commentOpen = true;
  /* the comment is the whole of the feedback then, so it gets the room */
  $("fbComment").rows = notSaved ? 6 : 2;
  commentShow(true);
}
on("notSaved", "change", () => {
  const st = roster[idx];
  const row = st ? rows.find(r => r.username === st.username) : null;
  const box = $("fbComment");
  const words = window.progressMath.unsavedComment(lessonJson);
  notSaved = $("notSaved").checked;
  if (notSaved){ notSavedWas = box.value; box.value = words; }
  else {
    if (box.value.trim() === words) box.value = notSavedWas;
    commentOpen = !!box.value.trim();
  }
  /* untick, and the away words are back in the boxes, so say so again */
  $("fbMsg").textContent = !notSaved && notSavedAway ? AWAY_MSG : "";
  /* The tick list is left exactly where it was underneath, so unticking
     goes back to the same level of the same step, not to the start. */
  if (notSaved) listWas = Object.assign({}, listOpen);
  if (!notSaved && listWas && !byQuestions() && listWas.user === ((row && row.username) || "")){
    listOpen = listWas;
    paintList(row);
  } else feedbackMode(row, true);
  if (!notSaved) listWas = null;
  paintNotSaved();
  paintNotSavedOffer(row);
  paintFb("idle");
});

/* Whether the tick is offered. On the tick list it sits above the first
   ticks and goes as soon as anything is ticked on any level, because a
   student with something to tick did hand work in. Otherwise, as before,
   only for a student with nothing saved. A lesson with no wording of its
   own for lost work is never offered it. Once ticked it always shows, so
   it can be taken back. */
function notSavedOffered(row){
  if (notSaved) return true;
  if (PRACTICE || !lessonJson || !window.progressMath.unsavedComment(lessonJson)) return false;
  const noWork = !window.progressMath.hasWork(lessonJson, row && row.data);
  if (byQuestions()) return noWork;
  const items = listItems(row).items;
  if (!items.length) return noWork;
  if (items.some(it => it.ticked)) return false;
  return noWork || listOpen.phase === "levels";
}
function paintNotSavedOffer(row){
  $("notSavedWrap").hidden = !notSavedOffered(row);
}
/* The list, or the questions when Settings asks for them. */
function feedbackMode(row, saved){
  if (byQuestions()){
    $("fbList").hidden = true;
    startAsk(row, saved);
    paintNotSavedOffer(row);
    return;
  }
  ask = null;
  showAsk(false);
  /* Every line a checklist line, each already ticked or not by the work:
     the boxes already hold what the list would come to, so it waits behind
     Change the ticks for the teacher who disagrees with one. Not when some
     of those lines are the teacher's to tick, though: nothing has answered
     them yet, so the list opens for them to be ticked. */
  const items = (PRACTICE || !lessonJson) ? [] : listItems(row).items;
  const onlyChecklist = items.length > 0 && items.every(it => it.key === undefined && !it.manual);
  listOpen = { user: (row && row.username) || "", at: null, phase: (saved || onlyChecklist) ? "done" : "levels" };
  paintList(row);
}
/* What the boxes are filled in from: the list, or for the questions what a
   practical's checklists say, as they always were. */
function autoFor(row){
  return byQuestions() ? checklistAuto(row) : listAuto(row);
}
/* A line has been ticked or unticked in the work beside the boxes. The
   Strength and Target are worked out again, and replace what is there if it
   is still the checklist's own wording. Anything the teacher wrote is kept,
   with a button to take the new sentences instead. */
let lastAuto = { strength: "", target: "" };
/* `byHand` is a tick on the list here, as against one arriving from the
   work: only the teacher's own tick moves a level picked from a list. */
function ticksChanged(row, byHand){
  paintMarking(row.username);               // a level read from the ticks may have moved
  if (!$("fbAsk").hidden) $("markWrap").hidden = true;   // still asking: the questions decide it
  paintFb("idle");                          // the ticks are not saved yet
  if (!byQuestions()) paintList(row);
  const fresh = autoFor(row);
  if (!fresh) return;
  const kept = [];
  [["Strength","strength"],["Target","target"]].forEach(pair => {
    const box = $("fb" + pair[0]);
    const have = box.value.trim(), want = String(fresh[pair[1]] || "");
    if (!have || have === lastAuto[pair[1]].trim()) box.value = want;
    else if (want && have !== want.trim()) kept.push(pair[1]);
  });
  lastAuto = { strength: fresh.strength || "", target: fresh.target || "" };
  const msg = $("fbMsg");
  msg.textContent = kept.length
    ? "Ticks changed. Your own words are kept. "
    : "Updated from the ticks. Not saved yet.";
  if (kept.length){
    const use = el("button","btn-ghost bmini2","Use the ticks' words");
    use.addEventListener("click", () => {
      $("fbStrength").value = lastAuto.strength;
      $("fbTarget").value = lastAuto.target;
      msg.textContent = "Updated from the ticks. Not saved yet.";
      paintFb("idle");
    });
    msg.appendChild(use);
  }
}
/* The Strength and Target a practical's checklist lines add up to for one
   student. The Strength is from the two furthest lines they got done, which
   in a task that builds up is the best they managed rather than the first
   thing anyone does. The Target is from the first line they did not, which
   is the next step for them and not one three steps on. Done is read through
   checkDone, as the bank and every checklist total are, so it never
   disagrees with the ticks on the work beside it. */
function checklistAuto(row){
  if (PRACTICE || !lessonJson || !lessonJson.practical) return null;
  const data = (row && row.data) || {};
  const done = [], todo = [];
  quantifiableTasks().forEach(t => {
    if (!window.progressMath.hasChecklist(t.block)) return;
    (t.block.checks || []).forEach((c, i) => {
      (window.progressMath.checkDone(c, i, data[t.id]) ? done : todo).push(c);
    });
  });
  if (!done.length && !todo.length) return null;
  const said = (list, key) => list.map(c => String((c && c[key]) || "").trim()).filter(Boolean);
  const strengths = said(done, "strength"), targets = said(todo, "target");
  let strength = strengths.length ? praiseFor(row) + " " + joinSentences(strengths.slice(-2)) : (lessonJson.zeroStrength || "");
  let target = targets.length ? targets[0] : (todo.length ? "" : (lessonJson.perfectTarget || ""));
  /* The target ends by pointing at the next level. The level reached is
     not said in the Strength: the summary page already tells them, with
     what that level asks for underneath. */
  const lv = window.progressMath.levelReached ? window.progressMath.levelReached(lessonJson, data) : null;
  if (lv && lv.next && target){
    target = (/[.!?]$/.test(target) ? target : target + ".") + " Keep going and see how much further you can get.";
  }
  return { strength: strength, target: target };
}
/* ---------------- feedback by questions ----------------
   Where the lesson has a bank, the boxes are written by answering questions
   about the work rather than by reading the bank: Yes or No to each
   strength in turn, then the first thing answered No becomes the target.
   The boxes, and From your bank under them, are still there afterwards.

   Where the practical has levels, the questions go a level at a time,
   lowest first. A level with a No in it is not reached, and nothing above
   it can change that, so the questions never go past it. One No is not
   taken on its own, though: the question after it on the same level is
   asked too. A second No straight after confirms it and ends there. A Yes
   means part of that level is done, so the rest of it is asked, for the
   Strength, and they end at the end of the level. */
let ask = null;      // { row, items, ladder, answers, at, phase, stop, target, targetChosen, strength, strengthEdited, editingStrength }

/* One question per bank entry that says what doing it well looks like. A
   topic is on the rubric level the builder put it on, and a checklist line
   is on the level of the coding task it belongs to; anything on no level is
   asked after all of those. A checklist line comes with its own answer
   already picked, read the way its tick is, so a teacher can press straight
   through a practical the checklist has already judged. */
function askItems(row, ladder){
  if (PRACTICE || !lessonJson) return [];
  const out = [];
  const topics = lessonJson.topics || {};
  Object.keys(topics).forEach(k => {
    const t = topics[k] || {};
    if (t.strength || t.target)
      out.push({ key: k, topic: t.label || k, short: String(t.short || "").trim(), strength: t.strength || "", target: t.target || "",
                 level: ladder.indexOf(t.level) });
  });
  if (lessonJson.practical){
    const data = (row && row.data) || {};
    const chain = window.progressMath.levelChain(lessonJson) || [];
    quantifiableTasks().forEach(t => {
      if (!window.progressMath.hasChecklist(t.block)) return;
      const onLevel = chain.findIndex(b => b.id === t.id);
      (t.block.checks || []).forEach((c, i) => {
        const strength = String((c && c.strength) || "").trim(), target = String((c && c.target) || "").trim();
        if (!strength && !target) return;
        const v = data[t.id] || {};
        /* A coding task is a level of its own when it is one of the chain.
           Otherwise each line can say which rubric level it belongs to,
           which is how one Photoshop checklist covers all four. */
        const level = onLevel >= 0 ? onLevel : ladder.indexOf(String((c && c.level) || "").trim());
        out.push({ topic: String(c.label || "Checklist").trim(), short: String((c && c.short) || "").trim(),
                   strength, target, level, from: t.type,
                   met: window.progressMath.checkDone(c, i, v),
                   task: t.id, line: i, manual: !!(c && c.manual),
                   /* ticked by their program rather than by a teacher */
                   byCode: !(c && c.manual) && !!(Array.isArray(v.checks) && v.checks[i]) &&
                           !(v.teacher && v.teacher[i]) });
      });
    });
  }
  /* Lowest level first, in the builder's order within a level, then the
     ones on no level. sort is stable, so the builder's order holds. */
  const rank = (it) => it.level < 0 ? Infinity : it.level;
  return out.sort((x, y) => rank(x) - rank(y));
}

function showAsk(asking){
  $("fbAsk").hidden = !asking;
  ["fbStrengthWrap","fbTargetWrap","fbSaveRow"].forEach(id => { $(id).hidden = asking; });
  commentShow(!asking);
  /* The Mark waits until the questions are done with. */
  if (asking) $("markWrap").hidden = true;
  else if (ask && ask.row) paintMarking(ask.row.username);
  const again = $("fbAskAgain");
  again.innerHTML = "";
  again.hidden = asking || !ask || !ask.items.length;
  if (again.hidden) return;
  /* Never asked in the first place, so "again" would be the wrong word. */
  const btn = el("button","bank-link", ask.onlyChecklist ? "Revise Strength and Target" : "Answer the questions again");
  btn.type = "button";
  btn.addEventListener("click", () => { startAsk(ask.row, false, true); });
  again.appendChild(btn);
}

function startAsk(row, saved, force){
  const ladder = window.progressMath.levelLadder(lessonJson);
  const items = askItems(row, ladder);
  /* Every question a checklist line, each already answered by its tick: the
     boxes already hold what the questions would come to, so asking them is
     thirty students' worth of pressing Yes to things the work has decided.
     They wait behind a button for the teacher who disagrees with a tick. */
  const onlyChecklist = items.length > 0 && items.every(it => it.met !== undefined && !it.manual);
  ask = { row, items, ladder, answers: items.map(it => it.met === undefined ? null : it.met),
          at: 0, phase: "strength", stop: -1, target: "", targetChosen: false,
          strength: "", strengthEdited: false, editingStrength: false, onlyChecklist };
  if (!items.length || saved || (onlyChecklist && !force)){ showAsk(false); return; }
  $("fbMsg").textContent = "";
  showAsk(true);
  paintAsk();
}

/* The last question actually asked. Anything after it was never put to the
   teacher, so a checklist's own answer sitting there counts for nothing. */
const askedUpTo = () => ask.stop >= 0 ? ask.stop : ask.items.length - 1;

/* The first question on a level answered No, up to and including the one
   at upTo, or -1. Worked out from the answers each time rather than kept,
   so going Back and changing an answer moves it. */
function askFirstNo(upTo){
  for (let k = 0; k <= upTo; k++)
    if (ask.answers[k] === false && ask.items[k].level >= 0) return k;
  return -1;
}

/* Where to go after the question at `at` has been answered: the index of
   the next question, or -1 to stop. Nothing here knows how many levels or
   questions a lesson has; it only compares each question's level with the
   level of the first No. */
function askNext(at){
  const n = ask.items.length;
  const first = askFirstNo(at);
  if (first < 0) return at + 1 < n ? at + 1 : -1;   // no No yet: carry on
  const level = ask.items[first].level;
  /* Two Nos in a row on the level: confirmed, and nothing more to learn. */
  if (at === first + 1 && ask.answers[at] === false && ask.items[at].level === level) return -1;
  /* Otherwise on to the end of that level, and never past it. */
  return at + 1 < n && ask.items[at + 1].level === level ? at + 1 : -1;
}

/* The level the answers add up to, as an index into the ladder: one below
   the level of the first No, or the highest level asked about when there
   was none. -1 for none; null when there are no levels. */
function askReached(){
  const levelled = ask.items.filter(it => it.level >= 0);
  if (!ask.ladder.length || !levelled.length) return null;
  const first = askFirstNo(askedUpTo());
  if (first >= 0) return ask.items[first].level - 1;
  return Math.max.apply(null, levelled.map(it => it.level));
}

/* The two most recent Yes answers, which in level order are the furthest
   the student got, after a word of praise. Two rather than three, the same
   as a practical's checklist Strength: three made a paragraph. */
function askStrength(){
  const lines = ask.items.filter((it, i) => i <= askedUpTo() && ask.answers[i] === true && it.strength)
    .map(it => it.strength).slice(-2);
  return lines.length ? praiseFor(ask.row) + " " + joinSentences(lines) : (lessonJson.zeroStrength || "");
}

/* A few words of praise to open a Strength with. Not the level, which the
   summary page says already, and not the same words for the whole class:
   thirty Strengths that all begin "Well done" read like a form letter.
   Chosen from the username rather than at random, so a student's opener
   is the same every time their work is opened and does not change under a
   teacher who goes back to them. */
const PRAISE = ["Well done!", "Good work!", "Great effort!", "Nice work!", "Brilliant work!",
                "Fantastic effort!", "Excellent work!", "Super effort!"];
function praiseFor(row){
  const name = String((row && row.username) || "") + "|" + lessonId;
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PRAISE[h % PRAISE.length];
}
function askFirstTarget(){
  const i = ask.items.findIndex((it, k) => k <= askedUpTo() && ask.answers[k] === false && it.target);
  return i >= 0 ? ask.items[i].target : (lessonJson.perfectTarget || "");
}

function paintAsk(){
  const box = $("fbAsk");
  box.innerHTML = "";
  const n = ask.items.length;
  if (ask.phase === "strength"){
    const it = ask.items[ask.at];
    box.appendChild(el("p","bankhead","What has this student done well?"));
    /* With levels the questions end early, so a count out of all of them
       would promise more than will be asked. The level is said instead. */
    box.appendChild(el("p","fbask-count", it.level >= 0
      ? ask.ladder[it.level] + ", question " + (ask.items.filter((x, k) => k < ask.at && x.level === it.level).length + 1) +
        " of " + ask.items.filter(x => x.level === it.level).length
      : "Question " + (ask.at + 1) + " of " + n));
    const card = el("div","fbask-card");
    card.appendChild(el("b","", it.topic));
    if (it.strength) card.appendChild(el("p","", it.strength));
    if (it.met !== undefined)
      card.appendChild(el("p","fbask-met", it.met ? "Their checklist says this is done." : "Their checklist says this is not done yet."));
    box.appendChild(card);
    const row = el("div","fbask-yesno");
    [["Yes", true], ["No", false]].forEach(([word, value]) => {
      const b = el("button", ask.answers[ask.at] === value ? "btn-primary" : "btn-ghost", word);
      b.type = "button";
      b.addEventListener("click", () => {
        ask.answers[ask.at] = value;
        ask.targetChosen = false;          // the first No may have moved
        ask.strengthEdited = false;        // and so may the Yeses
        ask.editingStrength = false;
        const next = askNext(ask.at);
        if (next >= 0){ ask.stop = -1; ask.at = next; }
        else { ask.stop = ask.at; ask.phase = "summary"; }
        paintAsk();
      });
      row.appendChild(b);
    });
    box.appendChild(row);
    const foot = el("div","fbask-foot");
    if (ask.at > 0){
      const back = el("button","bank-link","Back");
      back.type = "button";
      back.addEventListener("click", () => { ask.at--; paintAsk(); });
      foot.appendChild(back);
    }
    const skip = el("button","bank-link","Skip the questions");
    skip.type = "button";
    skip.addEventListener("click", () => showAsk(false));
    foot.appendChild(skip);
    box.appendChild(foot);
    return;
  }
  if (!ask.strengthEdited) ask.strength = askStrength();
  if (!ask.targetChosen) ask.target = askFirstTarget();
  /* The Strength is shown whole and agreed to before the Target comes up,
     so the teacher reads what the student will read rather than taking it
     on trust from the questions. */
  if (ask.phase === "summary"){
    box.appendChild(el("p","fbask-count","This is their Strength:"));
    if (ask.editingStrength){
      const edit = el("textarea","fbask-edit");
      edit.rows = 4;
      edit.value = ask.strength;
      edit.addEventListener("input", () => { ask.strength = edit.value; ask.strengthEdited = true; });
      box.appendChild(edit);
      setTimeout(() => edit.focus(), 0);
    } else {
      const card = el("div","fbask-card");
      card.appendChild(el("p","", ask.strength || "Nothing from the bank. You can write one with Edit Strength."));
      box.appendChild(card);
    }
    const row = el("div","fbask-yesno");
    if (!ask.editingStrength){
      const change = el("button","btn-ghost","Edit Strength");
      change.type = "button";
      change.addEventListener("click", () => { ask.editingStrength = true; paintAsk(); });
      row.appendChild(change);
    }
    const ok = el("button","btn-primary","Looks good");
    ok.type = "button";
    ok.addEventListener("click", () => { ask.editingStrength = false; ask.phase = "target"; paintAsk(); });
    row.appendChild(ok);
    box.appendChild(row);
    const foot = el("div","fbask-foot");
    const back = el("button","bank-link","Back");
    back.type = "button";
    back.addEventListener("click", () => {
      ask.editingStrength = false; ask.phase = "strength"; ask.at = askedUpTo(); paintAsk();
    });
    foot.appendChild(back);
    box.appendChild(foot);
    return;
  }
  box.appendChild(el("p","fbask-count","And this is their Target:"));
  const card = el("div","fbask-card");
  card.appendChild(el("p","", ask.target || "Nothing from the bank. You can write one in the Target box."));
  box.appendChild(card);
  const change = el("button","btn-ghost","Edit target");
  change.type = "button";
  change.addEventListener("click", targetPopup);
  const use = el("button","btn-primary","Looks good");
  use.type = "button";
  use.addEventListener("click", () => {
    $("fbStrength").value = ask.strength;
    $("fbTarget").value = ask.target;
    /* Gone through to the end, so the level the answers come to is what
       Save writes for the markbook. Never shown here. */
    ask.agreed = true;
    showAsk(false);
    paintFb("idle");
    $("fbMsg").textContent = "Filled in from your answers.";
  });
  const row = el("div","fbask-yesno");
  row.appendChild(change); row.appendChild(use);
  box.appendChild(row);
  const foot = el("div","fbask-foot");
  const back = el("button","bank-link","Back");
  back.type = "button";
  back.addEventListener("click", () => { ask.phase = "summary"; paintAsk(); });
  foot.appendChild(back);
  box.appendChild(foot);
}

/* Targets only, one to pick. Picking it replaces the one proposed. */
function targetPopup(){
  const seen = new Set(), lines = [];
  const add = (topic, line) => { if (line && !seen.has(line)){ seen.add(line); lines.push({ topic, line }); } };
  ask.items.forEach(it => add(it.topic, it.target));
  add("Everything done", lessonJson.perfectTarget);
  openModal(box => {
    box.classList.add("narrow");

      b.type = "button";
      b.appendChild(el("b","", t.topic));
      b.appendChild(el("span","", t.line));
      b.addEventListener("click", () => {
        ask.target = t.line; ask.targetChosen = true;
        closeModal(); paintAsk();
      });
      list.appendChild(b);
    });
    box.appendChild(list);
    const stay = el("button","btn-ghost modal-stay","Keep this target");
    stay.addEventListener("click", closeModal);

  });
}

/* ---------------- feedback by ticking a list ----------------
   The questions stopped at the first level with two Nos in it, so a student
   who had done things further on never had them asked about, and never had
   them said back to them. The list puts everything in front of the teacher
   at once, a level at a time, and anything can be ticked: Level Up done and
   a Go for Gold idea tried as well is something to praise.

   A checklist line on the list is the same tick as the one on the work.
   Ticking it here ticks it there, the level follows, and it is saved with
   the feedback exactly as a tick given in the work is. A line their program
   ticked is theirs, so it is shown ticked and left alone. Anything else, a
   topic written for the lesson, is the teacher's word on what they saw. */
let got = {};        // the topics ticked on the list for this student, by key

/* Settings decides, and it is kept on this computer: how a teacher likes to
   mark is theirs rather than the lesson's. */
const QUESTIONS_KEY = "hub_mark_questions";
function byQuestions(){
  try{ return localStorage.getItem(QUESTIONS_KEY) === "1"; }catch(e){ return false; }
}
window.settingsSection = (holder) => {
  if (!holder || PRACTICE) return;
  const grp = el("div","set-group");
  grp.appendChild(el("span","set-label","Writing a Strength and Target"));
  const opts = el("div","font-opts");
  const choices = [[false, "Tick off a list of what they have done"],
                   [true, "Answer Yes or No questions, a level at a time"]];
  const paint = () => opts.querySelectorAll(".set-opt").forEach((b, k) =>
    b.classList.toggle("on", choices[k][0] === byQuestions()));
  choices.forEach(([on, label]) => {
    const b = el("button","set-opt", label);
    b.type = "button";
    b.addEventListener("click", () => {
      try{ localStorage.setItem(QUESTIONS_KEY, on ? "1" : "0"); }catch(e){}
      paint();
      /* the student on screen changes over now, not at the next one */
      const st = roster[idx];
      const row = st ? rows.find(r => r.username === st.username) : null;
      if (st && lessonJson) feedbackMode(row, savedFeedback(row));
    });
    opts.appendChild(b);
  });
  grp.appendChild(opts);
  grp.appendChild(el("p","subnote","Kept on this computer."));
  holder.appendChild(grp);
  paint();
};

/* Whether a Strength or Target has actually been saved for them, as against
   the boxes holding what the ticks wrote. */
function savedFeedback(row){
  let f = {};
  try{ f = JSON.parse((row && row.feedback) || "{}") || {}; }catch(e){ f = {}; }
  return !!(f.strength || f.target || f.comment);
}
/* Every line on the list with whether it is ticked for this student. */
function listItems(row){
  const ladder = window.progressMath.levelLadder(lessonJson);
  const items = askItems(row, ladder).map(it => Object.assign({}, it,
    { ticked: it.key !== undefined ? !!got[it.key] : !!it.met }));
  return { ladder, items };
}

/* What the ticks add up to: the two furthest things done, in level order,
   after a word of praise; the first thing not done as the target; and the
   level reached, which is the level below the first gap. Something ticked
   further on than that is in the Strength, not the level: a level is all
   of it. */
function listAuto(row){
  if (PRACTICE || !lessonJson) return null;
  const { ladder, items } = listItems(row);
  if (!items.length) return null;
  const done = items.filter(it => it.ticked && it.strength).map(it => it.strength).slice(-2);
  const gap = items.find(it => !it.ticked && it.target);
  const strength = done.length ? praiseFor(row) + " " + joinSentences(done) : (lessonJson.zeroStrength || "");
  let target = gap ? gap.target : (items.some(it => !it.ticked) ? "" : (lessonJson.perfectTarget || ""));
  let reached = null;
  const levelled = items.filter(it => it.level >= 0);
  if (ladder.length && levelled.length){
    const first = levelled.find(it => !it.ticked);
    reached = first ? first.level - 1 : Math.max.apply(null, levelled.map(it => it.level));
  }
  /* The target ends by pointing at the next level, the same as it always
     has. A practical built in levels says where they are from the ticks
     on the work; one graded from a list, from these. */
  const user = row && row.username;
  const lv = user ? levelFor(user) : null;
  const more = lv ? !!lv.next : (reached !== null && reached < ladder.length - 1);
  if (more && gap && target){
    target = (/[.!?]$/.test(target) ? target : target + ".") + " Keep going and see how much further you can get.";
  }
  return { strength, target, reached, ladder };
}

/* The list goes the way the questions did, without stopping anywhere: the
   levels one at a time, then the Strength the ticks wrote to read and agree
   to, then the Target, and then the boxes, filled in. While it is being
   ticked the boxes are put away, because the column is the length of one
   level then rather than of everything, but Save and next stays: for a
   class whose checklists have already decided it all, the boxes are already
   right and stepping through thirty of them would be work for nothing.
   Feedback already saved opens on the boxes, with a way back to the list. */
function paintList(row){
  const box = $("fbList");
  box.innerHTML = "";
  const { ladder, items } = (PRACTICE || !lessonJson) ? { ladder: [], items: [] } : listItems(row);
  const user = (row && row.username) || "";
  if (listOpen.user !== user) listOpen = { user, at: null, phase: "levels" };
  paintNotSavedOffer(row);
  const off = !items.length || byQuestions() || notSaved;
  box.hidden = off || listOpen.phase === "done";
  listBoxes(off || listOpen.phase === "done");
  paintListAgain(row, !off && listOpen.phase === "done");
  /* Save waits until the Target is agreed: there is nothing to save before
     then. A class rather than `hidden`, because showAsk() and
     paintMarking() already set that. */
  $("workSide").classList.toggle("fbticking", !box.hidden);
  const foot = $("fbListRow");
  foot.innerHTML = "";
  foot.hidden = box.hidden;
  if (box.hidden) return;
  if (listOpen.phase === "strength" || listOpen.phase === "target"){ paintListCheck(row); return; }
  box.appendChild(el("p","bankhead","What have they done?"));
  box.appendChild(el("p","bhelp","Tick anything you can see in their work, further on too."));
  /* It opens on the level they are working on. The count beside each name
     says how much of it is ticked, so a level done or one further on can be
     read without going to it. The level shown is kept while this student is
     on screen, because ticking repaints the list. */
  const groups = [];
  items.forEach(it => {
    const last = groups[groups.length - 1];
    if (last && last.level === it.level) last.items.push(it);
    else groups.push({ level: it.level, items: [it] });
  });
  if (listOpen.at === null){
    const working = groups.findIndex(g => g.items.some(it => !it.ticked));
    listOpen.at = working < 0 ? groups.length - 1 : working;
  }
  const at = Math.min(Math.max(listOpen.at, 0), groups.length - 1);
  const g = groups[at];
  const nameOf = (grp) => grp.level >= 0 ? ladder[grp.level] : "Beyond the levels";
  const countOf = (grp) => grp.items.filter(it => it.ticked).length + " of " + grp.items.length;
  const step = el("div","fblist-step");
  const go = (to, label, word) => {
    const btn = el("button","btn-ghost iconbtn fblist-go", word);
    btn.type = "button";
    btn.disabled = to < 0 || to >= groups.length;
    btn.title = btn.disabled ? "" : label + ": " + nameOf(groups[to]) + ", " + countOf(groups[to]);
    btn.setAttribute("aria-label", btn.title || label);
    btn.addEventListener("click", () => { listOpen.at = to; paintList(row); });
    return btn;
  };
  step.appendChild(go(at - 1, "Previous level", "‹"));
  const name = el("div","fblist-name");
  name.appendChild(el("b","", nameOf(g)));
  name.appendChild(el("span","fblist-count", countOf(g)));
  step.appendChild(name);
  step.appendChild(go(at + 1, "Next level", "›"));
  box.appendChild(step);
  /* where this level sits among them, each dot full once its level is */
  const dots = el("div","fblist-dots");
  groups.forEach((grp, k) => {
    const all = grp.items.every(it => it.ticked);
    const dot = el("button","fblist-dot" + (k === at ? " here" : "") + (all ? " full" : ""));
    dot.type = "button";
    dot.title = nameOf(grp) + ", " + countOf(grp);
    dot.setAttribute("aria-label", dot.title);
    dot.addEventListener("click", () => { listOpen.at = k; paintList(row); });
    dots.appendChild(dot);
  });
  box.appendChild(dots);
  g.items.forEach(it => box.appendChild(listRow(row, it)));
  /* Done ticking leads on to reading what the ticks have written, from any
     level: a student who stopped early has nothing further on to tick. */
  const last = at === groups.length - 1;
  const done = el("button", last ? "btn-primary" : "btn-ghost", "Done ticking");
  done.type = "button";
  done.addEventListener("click", () => { listOpen.phase = "strength"; paintList(row); });
  foot.appendChild(done);
  if (!last){
    const next = el("button","btn-primary","Next level ›");
    next.type = "button";
    next.addEventListener("click", () => { listOpen.at = at + 1; paintList(row); });
    foot.appendChild(next);
  }
}
let listOpen = { user: null, at: null, phase: "levels" };

/* The Strength, then the Target, as the student will read them, each to be
   agreed to or changed. They are the boxes' own words, so a change here is
   a change there, and a tick changed afterwards keeps it the way a change
   typed into the box is kept. Written straight into the box rather than
   behind an Edit button: most need a word changed at most, and one press
   fewer is thirty fewer down a class. Back and Looks good go where Done
   ticking and Next level were, so the way on is always in the same place. */
function paintListCheck(row){
  const box = $("fbList");
  const strength = listOpen.phase === "strength";
  const field = $(strength ? "fbStrength" : "fbTarget");
  box.appendChild(el("p","fbask-count", strength ? "This is their Strength:" : "And this is their Target:"));
  const edit = el("textarea","fbask-edit fblist-edit");
  edit.rows = 2;
  edit.value = field.value;
  edit.placeholder = strength ? "Write their Strength here." : "Write their Target here.";
  edit.setAttribute("aria-label", strength ? "Strength" : "Target");
  /* As tall as the words, up to the most the CSS allows. Past that it
     scrolls inside itself, so the column never has to. */
  const fit = () => { edit.style.height = "auto"; edit.style.height = edit.scrollHeight + 2 + "px"; };
  edit.addEventListener("input", () => { field.value = edit.value; fit(); paintFb("idle"); });
  box.appendChild(edit);
  fit();
  const foot = $("fbListRow");
  const back = el("button","btn-ghost","Back");
  back.type = "button";
  back.addEventListener("click", () => {
    listOpen.phase = strength ? "levels" : "strength";
    paintList(row);
  });
  foot.appendChild(back);
  const ok = el("button","btn-primary","Looks good");
  ok.type = "button";
  ok.addEventListener("click", () => {
    listOpen.phase = strength ? "target" : "done";
    paintList(row);
    if (listOpen.phase === "done") $("fbMsg").textContent = "Filled in from the ticks.";
  });
  foot.appendChild(ok);
}
/* The boxes, away while the list is being ticked. A lesson with STAR
   feedback switched off never shows the first two either way. */
function listBoxes(on){
  const noStar = !!(lessonJson && lessonJson.assessment && !lessonJson.practical && lessonJson.star === false);
  $("fbStrengthWrap").hidden = !on || noStar;
  $("fbTargetWrap").hidden = !on || noStar;
  commentShow(on);
}
/* The comment box, or the button that opens it. Open whenever there is a
   comment already, so a saved one is never hidden behind the button. */
let commentOpen = false;
function commentShow(boxesOn){
  boxesOn = boxesOn || notSaved;     // the comment is all there is then
  const has = commentOpen || !!$("fbComment").value.trim();
  $("fbCommentWrap").hidden = !boxesOn || !has;
  $("fbCommentAdd").hidden = !boxesOn || has;
}
on("fbCommentAdd", "click", () => {
  commentOpen = true;
  commentShow(true);
  $("fbComment").focus();
});
/* Once it is written, one small button back to the list. */
function paintListAgain(row, on){
  if (byQuestions()) return;          // the questions keep that button for themselves
  const again = $("fbAskAgain");
  again.innerHTML = "";
  again.hidden = !on;
  if (!on) return;
  const btn = el("button","bank-link","Change the ticks");
  btn.type = "button";
  btn.addEventListener("click", () => { listOpen.phase = "levels"; listOpen.at = null; paintList(row); });
  again.appendChild(btn);
}
function listRow(row, it){
  const line = el("label","fblist-row" + (it.ticked ? " on" : ""));
  const tick = el("input");
  tick.type = "checkbox";
  tick.checked = it.ticked;
  /* Their program did this. Taking it back here would leave the work
     beside it saying one thing and the feedback another. */
  const locked = it.byCode && it.ticked;
  tick.disabled = locked;
  line.appendChild(tick);
  /* the few words it goes by, and the whole line on hover */
  const words = el("span","fblist-words", it.short || it.topic);
  if (locked) words.appendChild(el("span","fblist-by", it.from === "image" ? " from their file" : " by their code"));
  line.appendChild(words);
  line.title = it.topic;
  tick.addEventListener("change", () => listTick(row, it, tick.checked));
  return line;
}

function listTick(row, it, on){
  if (!row) return;
  if (it.key !== undefined){
    if (on) got[it.key] = true; else delete got[it.key];
    ticksChanged(row, true);
    return;
  }
  /* A checklist line: the teacher's tick on the work, as if given there. */
  const id = it.task, i = it.line;
  const had = (row.data && row.data[id]) || {};
  const mt = markingTicks[id] || { teacher: Object.assign({}, had.teacher || {}),
                                   manual: Object.assign({}, had.manual || {}) };
  mt.teacher = mt.teacher || {}; mt.manual = mt.manual || {};
  const side = it.manual ? mt.manual : mt.teacher;
  if (on) side[i] = true; else delete side[i];
  markingTicks[id] = mt;
  manualTicks[id] = mt.manual;
  row.data = window.progressMath.withMarkingTicks(row.data, { ticks: { [id]: mt } });
  const frame = $("workFrame");
  try{ frame.contentWindow.postMessage({ hubApplyTicks: { id: id, ticks: mt } }, "*"); }catch(e){}
  ticksChanged(row, true);
}

/* Joins chosen sentences into one that reads properly, rather than a run of
   full stops. A full sentence keeps its own punctuation; a fragment is
   joined on with "and". */
function joinSentences(lines){
  const tidy = lines.map(t => String(t).trim()).filter(Boolean);
  if (!tidy.length) return "";
  if (tidy.length === 1) return tidy[0];
  const ended = (t) => /[.!?]$/.test(t);
  let out = "";
  tidy.forEach((line, i) => {
    if (!out){ out = line; return; }
    if (ended(out)){
      /* a new sentence: capital letter, and keep them apart */
      out += " " + line.charAt(0).toUpperCase() + line.slice(1);
    } else {
      /* still mid-sentence: join with a comma, and "and" before the last */
      const joiner = (i === tidy.length - 1) ? " and " : ", ";
      out += joiner + line.charAt(0).toLowerCase() + line.slice(1);
    }
  });
  if (!ended(out)) out += ".";
  return out;
}

/* There is nothing to save feedback against until a program is open, and it
   is asked here rather than only where the boxes are set up: paintFb runs
   after that as well as before it, and a plain `disabled = false` in the
   line below was quietly turning the button back on over a student with no
   programs at all. */
function fbLocked(){ return PRACTICE && !openProg; }

/* The Save button says where it is up to itself, the way a student's does,
   rather than leaving a line of text underneath to be read. It stays saying
   Saved until part of the feedback is changed. */
function paintFb(state){
  const btn = $("saveFb");
  if (!btn) return;
  if (state === "saving"){ btn.textContent = "Saving…"; btn.disabled = true; btn.dataset.saved = "no"; }
  else if (state === "saved"){ btn.textContent = "✓ Saved"; btn.disabled = fbLocked(); btn.dataset.saved = "yes"; }
  else { btn.textContent = "Save"; btn.disabled = fbLocked(); btn.dataset.saved = "no"; }
  /* Pressed twice while the first save is still going, it would skip a
     student whose feedback nobody had looked at. */
  /* Practice is never marked, so it never says so. */
  $("fbFoot").classList.toggle("marked", state === "saved" && !PRACTICE);
  const next = $("saveNext");
  if (next){
    next.disabled = state === "saving" || fbLocked();
    /* the same width either way: the row shares its space out, not by words */
    next.textContent = state === "saved" ? "Next" : "Save and next";
  }
}
["fbStrength","fbTarget","fbComment","fbScore"].forEach(id => {
  const e = $(id);
  if (!e) return;
  const undo = () => { if ($("saveFb").dataset.saved === "yes") paintFb("idle"); };
  e.addEventListener("input", undo);
  e.addEventListener("change", undo);
});

/* Save, and with andNext the next student in the picker. A lesson moves on
   at once and saves behind (see queueSave). Practice still waits: a save
   that fails stays put, so the message saying why is still on screen beside
   the feedback it is about. */
async function submitFeedback(andNext){
  /* Practice is not marked and a note on it is not a report: a teacher
     writing one line about a program somebody made in their own time should
     not be asked for the other half of it. */
  if (PRACTICE) return afterSave(await saveProgFeedback(), andNext);
  /* Both boxes are on screen, so a missing one is a choice rather than an
     oversight. Only say something when exactly one has been filled in. */
  const hasS = showing("Strength"), hasT = showing("Target");
  if (hasS && !hasT) return askMissing("target", "strength", andNext);
  if (hasT && !hasS) return askMissing("strength", "target", andNext);
  saveFeedback(andNext);
}
function afterSave(ok, andNext){
  if (ok) paintPicker();              // they are marked now
  if (!ok || !andNext) return;
  goStep(1, true);
}
on("saveFb", "click", () => submitFeedback(false));
/* Next, with nothing changed since it was saved, only moves on */
on("saveNext", "click", () => {
  if ($("saveFb").dataset.saved === "yes" && !PRACTICE){ goStep(1); return; }
  submitFeedback(true);
});
/* Ctrl + Enter is Save and next from anywhere on the marking screen, the
   feedback boxes included, so a class can be marked without the mouse. Not
   while a pop-up is open: that pop-up is asking something first. */
function saveNextKey(e){
  if (e.key !== "Enter" || !(e.ctrlKey || e.metaKey) || e.repeat) return;
  const btn = $("saveNext");
  if ($("workPane").hidden || !$("mBack").hidden || document.querySelector(".whogate")) return;
  if (!btn || btn.disabled || $("fbSaveRow").hidden || $("workSide").classList.contains("fbticking")) return;
  e.preventDefault();
  btn.click();
}
document.addEventListener("keydown", saveNextKey);
/* Keys pressed inside the frame stay inside it, and clicking the work to
   read it puts the focus there. It is the same site, so it can be listened
   to; the frame is loaded again for every student, hence every load. */
["workFrame","spareFrame"].forEach(id => {
  const frame = $(id);
  if (!frame) return;
  frame.addEventListener("load", () => {
    try{ frame.contentWindow.addEventListener("keydown", saveNextKey); }catch(e){}
    /* the one on screen has arrived, so the next can be readied behind it */
    if (frame.id === "workFrame" && framedYet) planSpare(SPARE_WAIT_MS);
  });
});
function askMissing(missing, given, andNext){
  openModal(box => {
    box.appendChild(el("h2","", "Add a " + missing + " as well?"));
    box.appendChild(el("p","modal-text",
      "You have written a " + given + " but no " + missing + ". Students get the most from having both."));
    const add = el("button","btn-primary modal-cta","Write a " + missing);
    add.addEventListener("click", () => {
      closeModal();
      $("fb" + (missing === "target" ? "Target" : "Strength")).focus();
    });
    const anyway = el("button","btn-ghost modal-stay","Save without a " + missing);
    anyway.addEventListener("click", () => { closeModal(); saveFeedback(andNext); });
    box.appendChild(add); box.appendChild(anyway);
  });
}
let marks = {};
function markFor(user){ return marks[user] || null; }
/* A practical is marked out of a total or against a rubric. A rubric one
   (practice, as it was called before the graded rubric was merged into it)
   has no mark row here: the Strength and Target are the whole of what a
   teacher writes, and the level is worked out for the markbook. */
function practiceRun(){ return window.progressMath.rubricRun(lessonJson); }
/* How far a rubric practical's checklists have got. Not shown here: it
   decides whether the Target says there is further to go. */
function levelFor(user){
  if (PRACTICE || !practiceRun() || !window.progressMath.levelReached) return null;
  const row = rows.find(r => r.username === user);
  return window.progressMath.levelReached(lessonJson, (row && row.data) || {});
}
/* The level a rubric practical's student reached, saved with their
   Strength and Target for the markbook and shown nowhere else. Read the
   way the boxes were written: off the coding tasks where the lesson is
   built in levels, otherwise off the list or the answers. Where neither
   has been gone through for this student, the level already saved stays,
   so opening their work and saving a comment does not wipe it. */
function levelToSave(row){
  const pm = window.progressMath;
  const user = (row && row.username) || "";
  const kept = (markFor(user) && markFor(user).grade) || "";
  const named = (name) => {
    const g = pm.rubricEntry(lessonJson, name);
    return g ? g.name : String(name || "");
  };
  const data = pm.withMarkingTicks((row && row.data) || {}, { ticks: markingTicks });
  const lv = pm.levelReached(lessonJson, data);
  if (lv) return lv.reached ? named(lv.reached.name) : "";
  if (byQuestions()){
    if (!ask || !ask.agreed || !ask.row || ask.row.username !== user) return kept;
    const at = askReached();
    return at === null ? kept : at >= 0 ? named(ask.ladder[at]) : "";
  }
  const { items } = listItems(row);
  if (!items.some(it => it.ticked)) return kept;
  const fresh = listAuto(row);
  if (!fresh || fresh.reached === null || fresh.reached === undefined) return kept;
  return fresh.reached >= 0 ? named(fresh.ladder[fresh.reached]) : "";
}
function paintMarking(user){
  const practical = !!(lessonJson && lessonJson.practical) && !practiceRun();
  $("markWrap").hidden = !practical;
  if (!practical) return;
  const mk = markFor(user);
  const total = lessonJson.outOf || 20;
  $("outOfLabel").textContent = "out of " + total;
  $("fbScore").max = String(total);
  $("fbScore").value = mk && typeof mk.score === "number" ? mk.score : "";
}
/* ---------------- saving behind the next student ----------------
   Save and next used to wait for two or three round trips to the server
   before the next student appeared, every time, thirty times a class. Now
   what is on screen is taken down in one go, kept here as saved, and sent
   while the next student is already being read.

   The saves go one after another rather than all at once, so a student
   saved twice in quick succession is written in the order it was done. One
   that fails is put back as unsaved marking, where it was left, and said in
   the foot of the column until it has been saved again. */
let saveChain = Promise.resolve();
const savesQueued = [];        // the saves still to go, oldest first
const saveFailed = {};         // username -> why it did not save
let behindSince = 0;           // when the oldest save still going was queued
let behindTimer = 0;
/* Long enough for a slow school connection, short enough that one stuck
   request does not hold every save behind it for the rest of the lesson. */
const SAVE_WAIT_MS = 20000;

/* Everything a save needs, read off the screen now, because by the time it
   is sent the screen is showing somebody else. */
function feedbackJob(){
  const st = roster[idx];
  if (!st) return null;
  const row = rows.find(x => x.username === st.username) || null;
  const strength = showing("Strength") ? $("fbStrength").value : "";
  const target = showing("Target") ? $("fbTarget").value : "";
  const draft = draftNow();
  const job = {
    username: st.username, name: st.display_name, draft: draft, key: draftKey(draft),
    edits: JSON.parse(JSON.stringify(pendingEdits)),
    feedback: { strength: strength, target: target, text: $("fbComment").value,
                ticks: Object.keys(markingTicks).length ? JSON.parse(JSON.stringify(markingTicks)) : undefined,
                got: Object.keys(got).length ? Object.assign({}, got) : undefined,
                notSaved: notSaved || undefined },
    mark: null,
    /* how this student stood before, to put back if the save fails */
    before: { row: row, data: row && row.data, edits: row && row.edits,
              feedback: row && row.feedback, mark: marks[st.username] }
  };
  /* The mark goes with the feedback. A rubric practical has no mark, but
     its results row is where the markbook reads the level and where the
     spreadsheet reads the Strength and Target, so it is always written,
     as nought out of one with the level in it. Nothing a student sees
     reads that level. */
  if (lessonJson && lessonJson.practical){
    const rubric = practiceRun();
    if (rubric || $("fbScore").value !== ""){
      job.mark = { score: rubric ? 0 : (parseInt($("fbScore").value, 10) || 0),
                   outOf: rubric ? 1 : (lessonJson.outOf || 20),
                   grade: rubric ? levelToSave(row || { username: st.username, data: {} }) : "",
                   strength: strength, target: target };
    }
  }
  return job;
}

/* This page's copy says what the server will, straight away. */
function keepLocally(job){
  let row = rows.find(x => x.username === job.username);
  const editIds = Object.keys(job.edits);
  if (row && editIds.length){
    row.data = Object.assign({}, row.data || {});
    let old = {};
    try{ old = JSON.parse(row.feedback || "{}") || {}; }catch(e){ old = {}; }
    row.edits = Object.assign({}, old.edits || row.edits || {});
    editIds.forEach(id => {
      row.data[id] = job.edits[id];
      row.edits[id] = { value: job.edits[id], at: new Date().toISOString() };
    });
  }
  if (job.mark) marks[job.username] = Object.assign({}, job.mark);
  if (!row){ row = { username: job.username, display_name: job.name, data: {} }; rows.push(row); }
  /* the server keeps any code put right; so does this copy */
  let keptEdits = row.edits;
  if (!keptEdits){ try{ keptEdits = (JSON.parse(row.feedback || "{}") || {}).edits; }catch(e){ keptEdits = undefined; } }
  const f = job.feedback;
  row.feedback = JSON.stringify({ strength: f.strength, target: f.target, comment: f.text,
    ticks: f.ticks, got: f.got, notSaved: f.notSaved,
    edits: keptEdits && Object.keys(keptEdits).length ? keptEdits : undefined });
  delete drafts[job.username];
  delete saveFailed[job.username];
}

async function postSave(path, body, fallback){
  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), SAVE_WAIT_MS);
  let r;
  try{
    r = await fetch(API + path, { method:"POST", headers: HJ(), body: JSON.stringify(body), signal: stop.signal });
  }catch(e){
    throw new Error(stop.signal.aborted ? "The server took too long to answer." : "Could not reach the server.");
  }finally{ clearTimeout(timer); }
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || fallback);
  return out;
}
/* Code first: the feedback saved after it reads the change back and keeps
   it. */
async function sendJob(job){
  if (Object.keys(job.edits).length)
    await postSave("/api/teacher/edit-work", { username: job.username, lesson: lessonId, edits: job.edits },
                   "Could not save the change to their code.");
  await postSave("/api/teacher/feedback", Object.assign({ username: job.username, lesson: lessonId }, job.feedback),
                 "Could not save it.");
  if (job.mark)
    await postSave("/api/teacher/set-mark", Object.assign({ username: job.username, lesson: lessonId, overrides: {} }, job.mark),
                   "Could not save the mark.");
}

/* Resolves true once it is on the server, false if it never got there. */
function queueSave(job){
  keepLocally(job);
  savesQueued.push(job);
  if (savesQueued.length === 1) behindSince = Date.now();
  paintBehind();
  const done = saveChain.then(() => sendJob(job)).then(() => true, (e) => { saveWentWrong(job, e); return false; })
    .then(ok => {
      savesQueued.splice(savesQueued.indexOf(job), 1);
      behindSince = savesQueued.length ? Date.now() : 0;
      paintBehind();
      return ok;
    });
  saveChain = done;
  return done;
}

function saveWentWrong(job, e){
  /* Saved again since, and still to go: that one carries the boxes as they
     are now, and only needs the code put right this time as well, which it
     would otherwise not send because it had already gone. */
  const later = savesQueued.find(j => j !== job && j.username === job.username &&
                                      savesQueued.indexOf(j) > savesQueued.indexOf(job));
  if (later){ later.edits = Object.assign({}, job.edits, later.edits); return; }
  const b = job.before;
  const row = rows.find(x => x.username === job.username);
  if (!b.row){ if (row) rows.splice(rows.indexOf(row), 1); }
  else if (row){ row.data = b.data; row.edits = b.edits; row.feedback = b.feedback; }
  if (b.mark) marks[job.username] = b.mark; else delete marks[job.username];
  saveFailed[job.username] = e.message || "Could not save it.";
  if (shownUser === job.username){
    if (draftKey(draftNow()) === job.key){
      /* still looking at what failed: show it again as unsaved, the way
         coming back to them would */
      drafts[job.username] = job.draft;
      shownUser = "";                 // or stashDraft throws the draft away as saved
      showStudent(idx);
    } else {
      /* changed since: what is on screen is newer, so it stays, with the code
         put right added back so the next save sends it */
      pendingEdits = Object.assign({}, job.edits, pendingEdits);
      paintFb("idle");
    }
    $("fbMsg").textContent = saveFailed[job.username];
  } else {
    /* opened and written in again since, then left: that is the newer
       marking, and only the code put right is added back to it */
    const d = drafts[job.username];
    if (d) d.pendingEdits = Object.assign({}, job.edits, d.pendingEdits);
    else drafts[job.username] = job.draft;
  }
  paintPicker();
}

/* Quiet while saves are keeping up. A save that is slow, or one that failed,
   is said under the buttons, by name, with a way back to them. */
function paintBehind(){
  const line = $("fbBehind");
  if (!line) return;
  clearTimeout(behindTimer);
  line.innerHTML = "";
  const failed = roster.filter(st => saveFailed[st.username] && st.username !== shownUser);
  if (failed.length){
    line.className = "fbbehind failed";
    line.appendChild(document.createTextNode("Not saved: "));
    failed.forEach((st, n) => {
      if (n) line.appendChild(document.createTextNode(", "));
      const go = el("button","bank-link", st.display_name);
      go.type = "button";
      go.title = saveFailed[st.username];
      go.addEventListener("click", () => showStudent(roster.indexOf(st)));
      line.appendChild(go);
    });
    line.appendChild(document.createTextNode(". Open them to save again."));
    line.hidden = false;
    return;
  }
  const waited = behindSince ? Date.now() - behindSince : 0;
  if (savesQueued.length && waited >= 2000){
    line.className = "fbbehind";
    line.textContent = "Still saving " + (savesQueued.length === 1 ? "one student" : savesQueued.length + " students") + "…";
    line.hidden = false;
  } else {
    line.hidden = true;
  }
  if (savesQueued.length) behindTimer = setTimeout(paintBehind, Math.max(250, 2000 - waited));
}
/* Closing the page with a save still going would lose it without a word. */
window.addEventListener("beforeunload", (e) => {
  if (!savesQueued.length) return;
  e.preventDefault();
  e.returnValue = "";
});

/* Save on its own waits and says so; Save and next does not wait at all. */
async function saveFeedback(andNext){
  if (!roster[idx]) return false;
  if (OFFLINE){
    const ok = await handBack();
    if (ok && andNext) goStep(1, true);
    return ok;
  }
  const job = feedbackJob();
  pendingEdits = {};
  carriedEdits = {};
  /* what the boxes hold once it has gone, to tell later whether anything
     has been changed since */
  job.key = draftKey(draftNow());
  $("fbMsg").textContent = "";
  const done = queueSave(job);
  paintPicker();                      // they are marked now
  if (andNext){
    paintFb("saved");
    goStep(1, true);
    return true;
  }
  paintFb("saving");
  const ok = await done;
  if (ok && shownUser === job.username && draftKey(draftNow()) === job.key) paintFb("saved");
  else if (ok && shownUser === job.username) paintFb("idle");
  return ok;
}

/* ---------------- who opened this link ----------------
   Resolves true for a teacher and false for the student it belongs to. The
   code is a staff-room word rather than a password: it keeps a class out of
   the marking screen, and it sits in this file where anyone could read it, so
   it is never the only thing protecting anything. */
const TEACHER_CODE = "memory4";

function whoIsThis(name){
  return new Promise(resolve => {
    const back = el("div","modal-back whogate no-print");
    const box = el("div","modal narrow");
    box.appendChild(el("h2","","Who are you?"));

    const mine = el("button","btn-primary modal-cta", name);
    mine.addEventListener("click", () => { back.remove(); resolve(false); });
    box.appendChild(mine);

    const asTeacher = el("button","btn-ghost modal-stay","Teacher");
    box.appendChild(asTeacher);

    /* The code box only appears once Teacher is pressed, so a student is not
       invited to have a go at it. */
    const codeWrap = el("div","field whocode");
    codeWrap.hidden = true;
    codeWrap.appendChild(el("label","","Teacher code"));
    const code = el("input");
    code.type = "password"; code.autocomplete = "off";
    codeWrap.appendChild(code);
    const err = el("p","err","");
    const go = el("button","btn-primary wide","Open the marking view");

    const check = () => {
      if (code.value.trim().toLowerCase() === TEACHER_CODE){ back.remove(); resolve(true); return; }
      err.textContent = "That code is not right.";
      code.select();
    };
    go.addEventListener("click", check);
    code.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
    code.addEventListener("input", () => { err.textContent = ""; });
    codeWrap.appendChild(err);
    codeWrap.appendChild(go);
    box.appendChild(codeWrap);

    asTeacher.addEventListener("click", () => {
      codeWrap.hidden = false;
      asTeacher.hidden = true;
      setTimeout(() => code.focus(), 30);
    });

    back.appendChild(box);
    document.body.appendChild(back);
    setTimeout(() => mine.focus(), 30);
  });
}

/* Their own work, as they last left it, with no marking anywhere near it. */
function openStudentView(){
  const url = new URL("lesson.html", location.href);
  url.search = "?id=" + encodeURIComponent(lessonId);
  url.hash = location.hash.slice(1);
  location.replace(url.href);
}

/* ---------------- handing marked work back (no server) ----------------
   There is nowhere to save it to, so the marking goes into a new link and
   the student opens that. It carries their work as well as the marking, so
   what comes back is the whole thing rather than a note about it. */
async function handBack(){
  const st = roster[idx];
  const row = rows.find(x => x.username === st.username) || {};
  const fb = {
    strength: showing("Strength") ? $("fbStrength").value : "",
    target: showing("Target") ? $("fbTarget").value : "",
    comment: $("fbComment").value
  };
  if (Object.keys(markingTicks).length) fb.ticks = markingTicks;
  if (Object.keys(got).length) fb.got = got;
  const box = { n: st.display_name, l: lessonId,
                d: Object.assign({}, row.data || {}, pendingEdits), fb: fb };

  if (lessonJson && lessonJson.practical && !practiceRun()){
    const total = lessonJson.outOf || 20;
    if ($("fbScore").value !== ""){
      box.mk = { score: parseInt($("fbScore").value, 10) || 0, outOf: total, grade: "" };
      marks[st.username] = box.mk;
    }
  }
  const ov = overridesFor(st.username);
  if (ov && Object.keys(ov).length) box.ov = { overrides: ov };
  if (Object.keys(manualTicks).length) box.mt = manualTicks;
  row.feedback = JSON.stringify(fb);

  paintFb("saving");
  $("fbMsg").textContent = "";
  try{
    const blob = await window.workLink.pack(box);
    const url = new URL("lesson.html", location.href);
    url.search = "?id=" + encodeURIComponent(lessonId);
    url.hash = "f=" + blob;
    markedLink = url.href;
    if (markedLink.length > window.workLink.MAX){
      paintFb("idle");
      $("fbMsg").textContent = "That is too long to send as a link. Shorten the feedback.";
      return false;
    }
    delete drafts[st.username];      // in the link now, so nothing to remember
    paintFb("saved");
    showMarkedLink();
    return true;
  }catch(e){ paintFb("idle"); $("fbMsg").textContent = "The link could not be made."; return false; }
}

function showMarkedLink(){
  let copied = false;
  try{ navigator.clipboard.writeText(markedLink); copied = true; }catch(e){}
  openModal(box => {
    box.appendChild(el("h2","","Send this back"));
    box.appendChild(el("p","modal-text",
      roster[idx].display_name + " opens this to see their marked work."));
    const field = el("input");
    field.type = "text"; field.className = "worklink"; field.readOnly = true;
    field.value = markedLink;
    box.appendChild(field);
    const note = el("p","handin");
    if (copied){ note.dataset.state = "done"; note.textContent = "Copied \u2713"; }
    box.appendChild(note);
    const copy = el("button","btn-primary modal-cta", copied ? "Copy it again" : "Copy the link");
    copy.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(markedLink);
        note.dataset.state = "done"; note.textContent = "Copied \u2713";
        copy.textContent = "Copy it again";
      }catch(e){
        field.focus(); field.select();
        note.dataset.state = ""; note.textContent = "Press Ctrl and C to copy it.";
      }
    });
    box.appendChild(copy);
    const done = el("button","btn-ghost modal-stay","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
    setTimeout(() => { field.focus(); field.select(); }, 30);
  });
}

/* Marks the teacher changed question by question, by student: the frame
   saves them itself, and says so here so this page's copy agrees. One copy
   for the whole page used to go out in the next student's link as well. */
const overridesBy = {};
/* The changed marks for a student: what was changed on this page since it
   opened, otherwise what the server sent. */
function overridesFor(user){
  if (overridesBy[user]) return overridesBy[user];
  const row = resultRows.find(r => r.username === user);
  try{
    const ov = row && row.overrides ? JSON.parse(row.overrides) : null;
    return ov && typeof ov === "object" ? ov : null;
  }catch(e){ return null; }
}
/* Mark work on a standard assessment is the marked answers with a score to
   change on each, rather than the test as it was sat (marking=1 in the
   frame). A practical is still its work, marked down the right. */
function markingTest(){
  return !PRACTICE && !!(lessonJson && lessonJson.assessment && !lessonJson.practical);
}
/* code put right in the work while marking, by task, waiting for Save */
let pendingEdits = {};
/* and the checklist lines they ticked off by hand */
let manualTicks = {};
/* Every line ticked on each task while marking, the ones the code did not
   tick and the ones only a teacher judges, saved with the feedback. */
let markingTicks = {};
window.addEventListener("message", (e) => {
  if (!e || !e.data) return;
  /* The frame's total, said when it opens and after every mark changed. The
     spare frame's waits with the rest of what it says until it is shown. */
  if (e.data.hubMarkTotal && e.source === $("workFrame").contentWindow){
    const t = e.data.hubMarkTotal;
    $("fbScoreNum").textContent = t.score + " / " + t.outOf;
    $("fbScoreNote").textContent = t.done ? "" : "Not finished";
    $("fbScoreRow").hidden = false;
  }
  if (e.data.hubMarks && e.source === $("workFrame").contentWindow){
    const m = e.data.hubMarks;
    const user = e.data.hubMarksFor || (roster[idx] && roster[idx].username) || "";
    if (user){
      overridesBy[user] = Object.assign({}, m.overrides || {});
      /* the markbook tab and the picker read this, so they say the new total */
      marks[user] = Object.assign({}, marks[user] || {}, { score: m.score, outOf: m.outOf });
      const row = resultRows.find(r => r.username === user);
      if (row){ row.overrides = JSON.stringify(overridesBy[user]); row.score = m.score; row.out_of = m.outOf; }
    }
  }
  /* Code the teacher has changed in the work, every task of it that no
     longer reads as it arrived, saved with the feedback on Save. */
  if (e.data.hubEdits && typeof e.data.hubEdits === "object" && e.source === $("workFrame").contentWindow){
    pendingEdits = Object.assign({}, carriedEdits, e.data.hubEdits);
    if (Object.keys(pendingEdits).length){
      paintFb("idle");
      $("fbMsg").textContent = "Your change to their code saves when you press Save.";
    }
  }
  /* Checklist lines only a teacher can judge, ticked in the viewer. Kept by
     task so several coding tasks in one lesson do not overwrite each other. */
  if (e.data.hubManual){
    const m = e.data.hubManual;
    if (m.id){ manualTicks[m.id] = m.flags || {}; }
  }
  /* Laid over the student's work in hand straight away, so the level, the
     marks and the Strength and Target all count them before anything is
     saved. */
  if (e.data.hubTicks){
    const m = e.data.hubTicks, st = roster[idx];
    const row = st ? rows.find(r => r.username === st.username) : null;
    if (m.id && row){
      /* Lines found by checking the code again only ever add up: one found
         when the work opened stays found when a teacher's run comes after. */
      const code = Object.assign({}, (markingTicks[m.id] && markingTicks[m.id].code) || {}, m.code || {});
      markingTicks[m.id] = { teacher: m.teacher || {}, manual: m.manual || {} };
      if (Object.keys(code).length) markingTicks[m.id].code = code;
      manualTicks[m.id] = m.manual || {};
      row.data = window.progressMath.withMarkingTicks(row.data, { ticks: { [m.id]: markingTicks[m.id] } });
      ticksChanged(row);
    }
  }
  /* An assessment marks itself and writes its own strength and target. They
     arrive here so a teacher opens the boxes already holding them, ready to
     be edited rather than written from nothing. Anything already typed, or
     already saved against this student, is left alone. */
  if (e.data.hubST){
    const st = e.data.hubST;
    if (st.strength && !$("fbStrength").value.trim()) $("fbStrength").value = st.strength;
    if (st.target && !$("fbTarget").value.trim()) $("fbTarget").value = st.target;
  }
});

if (window.initSettings) initSettings($("setBtn"));
boot();
