<!-- Shown while a lesson is being opened, not while a new one is started:
     a blank lesson has nothing to wait for, and a screen that comes and
     goes inside one frame reads as a flicker rather than as a page loading.
     Written out here rather than built by the script at the foot of the
     page, because that script is thousands of lines and the wait for it to
     be read is part of what this covers. -->
<div class="loadscreen gone" id="loadScreen" hidden>
  <div class="load-inner">
    <div class="load-dots"><span></span><span></span><span></span></div>
    <p id="loadMsg">Loading</p>
    <!-- Only if the wait goes on far too long. -->
    <div class="load-stuck" id="loadStuck" hidden>
      <p id="loadStuckMsg">This is taking longer than it should. The school network may be busy.</p>
      <div class="row">
        <button class="btn-primary" id="loadRetry" type="button">Try again</button>
        <a class="btn-ghost" href="admin.html">Back to the teacher console</a>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  if (!new URLSearchParams(location.search).get("edit")) return;
  var screen = document.getElementById("loadScreen");
  screen.hidden = false;
  screen.classList.remove("gone");
  document.getElementById("loadRetry").addEventListener("click", function(){ location.reload(); });
})();
</script>

<script>
const $ = (id) => document.getElementById(id);
/* Declared up here because the whole file leans on it: without a server the
   builder saves by downloading, reads its years and units out of the lessons
   folder, and drops the parts that need a class behind them. */
const OFFLINE = !!(window.HUB && window.HUB.OFFLINE);
/* wiring a button that isn't there should not stop the rest of the page */
function on(id, ev, fn){
  const e = document.getElementById(id);
  if (!e){ console.warn("Nothing on the page with id:", id); return; }
  e.addEventListener(ev, fn);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- the loading screen ----------------
   Opening a lesson is several waits one after another: the year groups and
   units, the lesson itself, then putting it back together into cards. Saying
   which one is going on is the difference between a page that is working and
   a page that has hung, and the builder took long enough over a big lesson
   that teachers were reloading it half way through.

   The steps are told by the code as it reaches them rather than guessed on a
   timer. The standard lines only come out when a step has taken longer than
   a step should, so they never pretend to be progress. */
const LOAD_WAITING = ["Still loading", "Almost there", "Nearly ready"];
let loadShownAt = 0, loadWaitTimer = null, loadWaitAt = 0, loadStuckTimer = null;
let loadStage = "Loading";                   // the last thing the code actually said

function showLoader(text){
  const screen = $("loadScreen");
  if (!screen) return;
  screen.hidden = false;
  screen.classList.remove("gone");
  const stuck = $("loadStuck"); if (stuck) stuck.hidden = true;
  loadShownAt = Date.now();
  clearTimeout(loadStuckTimer);
  /* Past the time limit on a single call, so only a real jam shows this. */
  loadStuckTimer = setTimeout(() => {
    if (screen.hidden || !stuck) return;
    /* Back to the stage it is really on. "Nearly ready" above a note saying
       this has taken too long contradicts itself, and which step it has
       stopped at is the useful thing at this point. */
    clearTimeout(loadWaitTimer);
    const msg = $("loadMsg"); if (msg) msg.textContent = loadStage;
    stuck.hidden = false;
  }, 22000);
  return loadStep(text || "Loading");
}

/* Say which stage the load has reached, and hand the browser back long
   enough to draw it. Everything after most of these calls is synchronous:
   without the pause the words are all set within one turn and the only line
   anybody ever sees is the last of them. */
function loadStep(text){
  const screen = $("loadScreen");
  if (!screen || screen.hidden) return Promise.resolve();
  const msg = $("loadMsg");
  loadStage = text;
  if (msg) msg.textContent = text;
  clearTimeout(loadWaitTimer);
  loadWaitAt = 0;
  const waiting = () => {
    if (screen.hidden || !msg) return;
    msg.textContent = LOAD_WAITING[Math.min(loadWaitAt, LOAD_WAITING.length - 1)];
    loadWaitAt++;
    loadWaitTimer = setTimeout(waiting, 4000);
  };
  loadWaitTimer = setTimeout(waiting, 3000);
  return new Promise(done => setTimeout(done, 30));
}

/* atOnce for the times the screen is in the way of something that has to be
   read now: a pop-up asking for the sign-in key, or a lesson that would not
   open. Everything else waits out the short minimum below. */
function hideLoader(atOnce){
  const screen = $("loadScreen");
  if (!screen || screen.hidden) return;
  const left = atOnce ? 0 : 450 - (Date.now() - loadShownAt);
  if (left > 0){ setTimeout(() => hideLoader(true), left); return; }
  clearTimeout(loadWaitTimer);
  clearTimeout(loadStuckTimer);
  screen.hidden = true;
  screen.classList.add("gone");
}

/* ---------------- the little question marks ---------------- */
/* Every note that used to sit under a box as a grey paragraph is now behind
   one of these. Half a dozen of them down one task read as a page of
   instructions with a few boxes buried in it, and each one is wanted once
   rather than every time the task is opened. One dot per thing: where several
   notes belong to the same row they are collated into one, as separate
   paragraphs in the same bubble.

   The bubble hangs off <body> and is placed against the window rather than
   inside the field, because the middle column scrolls and a card would clip
   anything sitting at its edge. */
let openHelp = null;

function closeHelp(){
  if (!openHelp) return;
  openHelp.dot.classList.remove("on");
  openHelp.dot.setAttribute("aria-expanded", "false");
  openHelp.bubble.remove();
  openHelp = null;
}

function placeHelp(){
  if (!openHelp) return;
  /* render() rebuilds the whole card, so the dot we are holding may have been
     thrown away since the bubble was opened */
  const r = openHelp.dot.getBoundingClientRect();
  if (!openHelp.dot.isConnected || (!r.width && !r.height)){ closeHelp(); return; }
  const bubble = openHelp.bubble, gap = 8;
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(gap, Math.min(left, window.innerWidth - w - gap));
  let top = r.bottom + gap;
  if (top + h > window.innerHeight - gap) top = Math.max(gap, r.top - h - gap);
  bubble.style.left = Math.round(left) + "px";
  bubble.style.top = Math.round(top) + "px";
}

/* text is one string, or several of them for the notes that were collated */
function helpDot(text){
  const dot = el("button","helpdot","?");
  dot.type = "button";
  dot.title = "What is this?";
  dot.setAttribute("aria-label", "What is this?");
  dot.setAttribute("aria-expanded", "false");
  dot.addEventListener("click", (e) => {
    /* the head of a card opens and shuts it wherever it is clicked, and the
       dots inside a pop-up sit on rows that have their own handlers */
    e.preventDefault(); e.stopPropagation();
    const mine = openHelp && openHelp.dot === dot;
    closeHelp();
    if (mine) return;                      // pressing it again puts it away
    const bubble = el("div","helpbub");
    (Array.isArray(text) ? text : [text]).forEach(t => bubble.appendChild(el("p","", t)));
    document.body.appendChild(bubble);
    openHelp = { dot: dot, bubble: bubble };
    dot.classList.add("on");
    dot.setAttribute("aria-expanded", "true");
    placeHelp();
  });
  return dot;
}

/* A box and its dot side by side, so the dot lands at the right-hand end of
   the thing it is about. Tall boxes get it level with their first line. */
function withHelp(node, help){
  if (!help) return node;
  const row = el("div","bctl");
  row.appendChild(node);
  row.appendChild(helpDot(help));
  return row;
}

document.addEventListener("click", (e) => {

/* Registered before the one that shuts a pop-up, so Escape puts the note away
   first and leaves the pop-up it was opened from where it was. */
document.addEventListener("keydown", (e) => {

/* ---------------- the lesson being built ---------------- */
/* versionOf holds the lesson this one is a version of, and is empty for an

let lesson = { title:"", intro:"", unit:"", subunit:"", year:"", point:"", assessment:false, practical:false, homework:false,

               topics:{}, responses:{}, extensions:[], blocks:[] };

const BLANK = {

  choice:   () => ({ type:"choice", title:"", task:"", prompt:"Choose one",

  link:     () => ({ type:"link", url:"", title:"Open this", heading:"Have a look at this site", task:"", confirm:false }),
  mc:       () => ({ type:"mc", prompt:"", options:["",""], answer:0, topic:"" }),

  binadd:   () => ({ type:"binadd", title:"", task:"", bits:8, count:3,

  short:    () => ({ type:"short", prompt:"", answers:[""], model:"", why:"", topic:"" }),
  /* A trace table, a conversion table, a table of outputs. Two columns and

  table:    () => ({ type:"table", title:"", task:"",
                     head:["", ""],
                     rows:[ [{t:"",fill:true},{t:"",fill:true}],
                            [{t:"",fill:true},{t:"",fill:true}] ] }),

  exam:     () => ({ type:"exam", prompt:"", command:"State", marks:1, answer:"lines",
                     lines:"", answers:[""], scheme:[{ text:"", marks:1 }], model:"",
                     point:"", code:"", strand:"" }),
  password: () => ({ type:"password", title:"Password strength challenge",
                     task:"Invent a made-up password that turns all five checks green." }),
  /* The teacher writes the real message and picks a shift; the coded text and
     the answer's hash are worked out when the lesson is compiled, so the
     answer never sits in the lesson file in readable form. */
  caesar:   () => ({ type:"caesar", title:"Caesar cipher puzzle",
                     task:"Slide the shift until the message becomes English, then type it in.",
                     message:"THE PASSWORD IS FIREWALL", shift:7,

};
/* A blank of whatever kind, filed where the lesson is filed. Only an exam
   question carries a point of the specification in a lesson, so only that
   one is filed here; putting a point on a paragraph would write three fields
   into every task in the file that nothing ever reads. */
function newBlock(kind){
  const made = BLANK[kind] ? BLANK[kind]() : null;
  if (made && made.type === "exam" && lesson.point) specFile(made, lesson.point);
  return made;
}
/* A coding task can be told to start from another one. The reference is this
   key rather than a position, so inserting a task in between, or dragging one
   somewhere else, does not quietly point it at the wrong task. */
let codeKeyCount = 0;
function newCodeKey(){
  codeKeyCount++;
  return "c" + Date.now().toString(36) + codeKeyCount.toString(36);
}

/* Every Python task before this one, in the order a student meets them, each
   with the page it is on so it can be named by where a teacher will look for
   it rather than by a number in a list.

   Python only. A web task keeps three files and a Python box holds one, so
   there is nothing sensible to carry across, and the lesson page only ever
   registered Python tasks as somewhere to carry from. They were offered here
   all the same, and picking one did nothing at all. */
function earlierCodeTasks(target){
  const out = [];
  let stop = false;
  let pageNo = 0, pageTitle = "";
  const walk = (list) => {
    (list || []).forEach(x => {
      if (stop) return;
      if (x === target){ stop = true; return; }
      if (x.type === "page"){ pageNo++; pageTitle = String(x.title || "").trim(); }
      if (x.type === "ide"){
        if (!x.key) x.key = newCodeKey();
        out.push({ task:x, pageNo:pageNo, pageTitle:pageTitle });
      }
      /* a task inside an extension or a choice is still on the page holding it */
      if (x.blocks) walk(x.blocks);
      if (x.options) x.options.forEach(o => walk(o.blocks));
    });
  };
  walk(lesson.blocks);
  return out;
}
/* "2 (Loops): Build the counter", falling back sensibly when a page has no
   title yet or the task has no heading of its own. */
function codeTaskLabel(entry){
  const heading = String(entry.task.title || "").trim() || (LABEL[entry.task.type] || "Coding task");
  const where = entry.pageNo
    ? (entry.pageNo + (entry.pageTitle ? " (" + entry.pageTitle + ")" : ""))
    : "";
  return where ? where + ": " + heading : heading;
}

const LABEL = { text:"Paragraph", picture:"Image", pastelink:"Paste a link", ide:"Python task", question:"Written answer", quiz:"Quiz", image:"Screenshot",
                embed:"Video", link:"Link to a site", mc:"Multiple choice", blanks:"Fill the gaps", order:"Put in order",
                short:"Short answer", page:"Page", extension:"Extension tasks", group:"Group", choice:"Choice", frame:"Embedded page", binary:"Binary conversion", binadd:"Binary addition", notes:"Notes", mindmap:"Mind map", board:"Whiteboard", label:"Label a picture", keywords:"Keyword definitions", code:"Coding task", web:"Web page",
                password:"Password checker", caesar:"Caesar cipher", exam:"Exam question",
                table:"Table" };

/* The lesson page hashes what a student types and compares it with this, so
   the answer is never sitting in the lesson file for anyone to read. Same
   two functions as lesson.html, and they must stay the same. */
function strHash(s){ let x = 5381; for (const c of s) x = ((x << 5) + x + c.charCodeAt(0)) >>> 0; return x; }
function normLetters(s){ return (s || "").toUpperCase().replace(/[^A-Z]/g, ""); }
/* Shifting forwards makes the coded text; the lesson page shifts back. */
function caesarEncode(text, k){
  return String(text || "").replace(/[A-Za-z]/g, (c) => {
    const base = c === c.toUpperCase() ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + (k % 26) + 26) % 26) + base);
  });
}

/* A YouTube address in any of its usual shapes -> the embeddable one. */
function toEmbed(raw){
  const t = String(raw || "").trim();
  if (!t) return "";
  const m = t.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/)
         || t.match(/^([A-Za-z0-9_-]{11})$/);
  if (m) return "https://www.youtube.com/embed/" + m[1];
  const src = t.match(/src\s*=\s*["']([^"']+)["']/i);      // a whole <iframe> pasted in
  if (src) return toEmbed(src[1]) || src[1];
  return t;                                                  // something else: leave it alone
}

/* "a, b and c", which reads better than a list with a stray comma on it */
function joinWords(list){
  if (list.length === 1) return list[0];
  return list.slice(0, -1).join(", ") + " and " + list[list.length - 1];
}

/* ---------------- the draft lives in this browser ---------------- */
/* Nothing is kept in the browser: opening the builder always starts clean,
   or with the lesson you asked to edit. Instead, the tab warns before it is
   closed with work that has not been saved to the site. */
let dirty = false;
/* Typing in an editor. On the lesson side it only has to mark the tab as
   holding unsaved work; on the task bank it starts that task's own save,
   since the bank is not part of the lesson and Save to the site would not
   write it. */
function saveDraft(){
  /* Only when there is a bank task open to save. Switching what kind of
     work a lesson is calls this too, and with the bank on screen and
     nothing being edited that put "Saving..." up over an empty pane. */
  if (bankOpen && bankTask && bankTask.block){ bankTouch(); return; }
  dirty = true;
}
function loadDraft(){ /* deliberately empty, see the note above */ }
try{
  window.addEventListener("beforeunload", (e) => {
    /* A task typed into the bank in the last couple of seconds has not
       reached its save yet, and it is not part of the lesson, so `dirty`
       says nothing about it. */
    if (!dirty && !bankDirtyAt) return;
    e.preventDefault();
    e.returnValue = "";        // browsers show their own wording
    return "";
  });
}catch(e){}
/* clear any draft left by an older version */
try{ localStorage.removeItem("hub_builder"); }catch(e){}
/* Older drafts kept tasks loose at the top level, and quizzes had a single
   answer. Bring both up to date so nothing is lost. */
function tidyIntoPages(){
  if (lesson.assessment) return;
  if (!lesson.blocks.some(b => b.type !== "page")) return;
  const out = [];
  let current = null;
  lesson.blocks.forEach(b => {
    if (b.type === "page"){ out.push(b); current = null; return; }
    if (!current){
      current = { type:"page", title:"Page " + (out.length + 1), task:"", startLocked: out.length > 0, blocks:[] };
      out.push(current);
    }
    current.blocks.push(b);
  });
  lesson.blocks = out;
}

/* Drafts written by the older builder had one question per quiz. */
function migrate(arr){
  (arr || []).forEach(b => {
      if (b.type === "quiz" && b.questions){
      b.questions.forEach(q => { if (!q.answers) q.answers = [q.answer === undefined ? 0 : q.answer]; });
    }
    if (b.type === "text" && b.body !== undefined && b.html === undefined){
      b.html = String(b.body || "").split(/\n{2,}/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
      delete b.body;
    }
    if (b.type === "quiz" && !b.questions){
      b.questions = [{ q: b.q || "", options: b.options || ["",""], answer: b.answer || 0, hint: b.hint || "" }];
      delete b.q; delete b.options; delete b.answer; delete b.hint;
    }
    if (b.type === "page" || b.type === "extension" || b.type === "group") migrate(b.blocks);
    if (b.type === "choice") (b.options || []).forEach(o => migrate(o.blocks || []));
  });
}

/* ---------------- cards -> a real lesson file ---------------- */
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function keepArrays(o){
  Object.keys(o).forEach(k => {
    const v = o[k];
    if (v === "" || v === undefined) delete o[k];
    if (Array.isArray(v) && !v.length && (k === "distractors" || k === "keywords" || k === "answers")) delete o[k];
  });
  return o;
}
function compile(){
  /* Started here rather than at the blocks loop: response tasks and the
     extension list are compiled first, and a bank task in one of those has
     to be counted alongside the rest. */
  idsUsed = new Set();
  const out = { title: lesson.title || "Untitled lesson", blocks: [] };
  if (lesson.intro) out.intro = lesson.intro;
  if (lesson.unit) out.unit = lesson.unit;
  if (lesson.year) out.year = lesson.year;
  /* Where it sits on the specification. Saved with the lesson so reopening
     it knows, and copied out to the catalogue when it is saved, which is
     what the GCSE and A Level hub files it by. */
  if (lesson.point) out.point = lesson.point;
  /* The sub-point's wording, alongside the unit. Both are written out in
     words because the catalogue is what a class's lessons and a student's
     home page group by, and neither of those has the specification. */
  if (lesson.subunit) out.subunit = lesson.subunit;
  if (lesson.homework) out.homework = true;
  /* On unless a teacher turned it off, so only the off ones are written
     down and every lesson saved before the default changed has it on. */
  if (lesson.linger === false) out.linger = false;
  /* Kept in the lesson itself as well as in the catalogue, so reopening it
     anywhere still knows what it is a version of. */
  if (lesson.versionOf){
    out.versionOf = lesson.versionOf;
    out.versionName = lesson.versionName || "";
    out.versionNote = lesson.versionNote || "";
    out.versionCode = lesson.versionCode || "";
  }
  if (lesson.perfectTarget) out.perfectTarget = lesson.perfectTarget;
  if (lesson.zeroStrength) out.zeroStrength = lesson.zeroStrength;
  if (lesson.practical){
    out.marking = lesson.marking || "rubric";
    if (out.marking === "score") out.outOf = lesson.outOf || 20;
    else out.rubric = (lesson.rubric || []).filter(g => g.name);
  }
  if (lesson.practical){
    out.practical = true;
    out.assessment = true;      // students and teachers treat it as an assessment
  }
  if (lesson.assessment || lesson.practical){
    out.assessment = true;
    const topics = {};
    Object.keys(lesson.topics || {}).forEach(k => {
      const t = lesson.topics[k];
      if (t && (t.label || t.strength || t.target)) topics[k] = { label:t.label||k, strength:t.strength||"", target:t.target||"" };
    });
    if (Object.keys(topics).length) out.topics = topics;
    const responses = {};
    Object.keys(lesson.responses || {}).forEach(topic => {
      const built = [];
      (lesson.responses[topic] || []).forEach((task, i) => compileOne(task, "resp_" + topic + "_" + (i + 1), built));
      if (built.length) responses[topic] = built;
    });
    if (Object.keys(responses).length) out.responses = responses;
    const extras = [];
    (lesson.extensions || []).forEach((task, i) => compileOne(task, "ext_" + (i + 1), extras));
    if (extras.length) out.extensions = extras;
  }
  firstPageOpen();
  lesson.blocks.forEach((b, i) => compileOne(b, b.type + (i + 1), out.blocks));
  idsUsed = null;
  return out;
}
/* Which ids have already been handed out in this compile, so the same bank
   task used twice in one lesson does not save both answers over each other. */
let idsUsed = null;
/* A task that came out of the bank is given an id made from the bank's id
   rather than from where it happens to sit.

   Positions are what every other task has always used, and it works until
   something is inserted above one: every id below shifts by one and the work
   saved against them is orphaned. It matters more here than anywhere. A
   question used in a lesson and in three versions of that lesson has to
   produce the same key in all four, or the specification coverage screen is
   comparing four different things.

   Only blocks carrying fromTask get this. Everything else keeps the id it
   has always had, so no lesson already out with a class changes. */
function blockId(b, positional){
  if (!b || !b.fromTask) return positional;
  let id = "t_" + String(b.fromTask).replace(/[^A-Za-z0-9_-]/g, "");
  if (idsUsed){
    let n = 1, want = id;
    while (idsUsed.has(want)) want = id + "__" + (++n);
    id = want;
    idsUsed.add(id);
  }
  return id;
}
/* How many lines a written answer's box shows. Four unless the teacher has
   set it, which is also what a lesson written before the setting existed
   gets: the box used to be five rows tall and was still shorter than it
   looked, because the stylesheet's minimum won. */
function answerLines(b){
  const n = Math.round(Number(b && b.lines));
  return n >= 1 ? Math.min(30, n) : 4;
}
function compileOne(b, id, target){
  id = blockId(b, id);
  /* "can be skipped" is remembered on whatever the task compiles to */
  const push = (x) => {
    if (x && b && b.required === false) x.required = false;
    /* Which bank task this copy came from. It has to survive compiling: the
       builder reopens a lesson from exactly this JSON, so a link dropped
       here is a link gone, and the next save would give the task a
       positional id again and lose every answer saved against the old one. */
    if (x && b && b.fromTask) x.fromTask = b.fromTask;
    /* What holds the rest of the page back. Left out here, and a teacher
       reopening the lesson would find every task back to None. */
    if (x && b && GATE_TYPES.includes(b.type) && ["attempted","partial","full"].includes(b.gate))
      x.gate = b.gate;
    target.push(x);
  };
  if (b.type === "page"){
    const kids = [];
    (b.blocks || []).forEach((child, k) => compileOne(child, id + "_" + (k + 1), kids));
    push({ type:"page", id, title: b.title || "Tasks", task: b.task || "",
           startLocked: b.startLocked !== false,
           extension: b.extension === true ? true : undefined,
           /* On unless it was turned off, so only the off ones are written
              down and every lesson made before this setting existed keeps it. */
           taskbar: b.taskbar === false ? false : undefined,
           passHash: b.passHash || undefined, blocks: kids });
    return;
  }
  if (b.type === "choice"){
    const opts = [];
    (b.options || []).forEach((opt, k) => {
      if (!(opt.label || "").trim()) return;         // an unnamed choice cannot be offered
      const kids = [];
      (opt.blocks || []).forEach((child, j) =>
        compileOne(child, id + "_" + (k + 1) + "_" + (j + 1), kids));
      opts.push({ label: opt.label, blocks: kids });
    });
    if (opts.length < 2) return;                     // nothing to choose between
    push({ type:"choice", id, title: b.title || "", task: b.task || "",
           prompt: b.prompt ? (window.cleanRichText ? window.cleanRichText(b.prompt) : b.prompt) : "",
           options: opts });
    return;
  }
  if (b.type === "extension"){
    const kids = [];
    (b.blocks || []).forEach((child, k) => compileOne(child, id + "_" + (k + 1), kids));
    if (!kids.length) return;                 // an empty one is not worth saving
    push({ type:"extension", id, title: b.title || "Extension tasks",
           task: b.task || "Have a go at these", blocks: kids });
    return;
  }
  if (b.type === "group"){
    const kids = [];
    (b.blocks || []).forEach((child, k) => compileOne(child, id + "_" + (k + 1), kids));
    if (!kids.length) return;                 // a group with nothing in it is nothing
    push({ type:"group", id, title: b.title || "", task: b.task || "", blocks: kids });
    return;
  }
  {
    if (b.type === "text"){
      // written with the formatting buttons, so it is already HTML
      let html = b.heading ? "<h2>" + esc(b.heading) + "</h2>" : "";
      if (b.html !== undefined){
        push({ type:"text", id,
               heading: b.heading || "",
               html: (window.cleanRichText ? window.cleanRichText(b.html) : b.html) });
        return;
      }
      /* Walk the lines, gathering runs of bullets and runs of prose. Teachers
         write a sentence and then bullets underneath with no blank line, so
         each run has to be emitted on its own. */
      let prose = [], bullets = [];
      const flushProse = () => { if (prose.length){ html += "<p>" + inline(prose.join(" ")) + "</p>"; prose = []; } };
      const flushBullets = () => {
        if (bullets.length){
          html += "<ul>" + bullets.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
          bullets = [];
        }
      };
      String(b.body || "").split("\n").forEach(line => {
        if (!line.trim()){ flushBullets(); flushProse(); return; }
        if (/^\s*[-*]\s+/.test(line)){ flushProse(); bullets.push(line.replace(/^\s*[-*]\s+/, "")); return; }
        flushBullets(); prose.push(line.trim());
      });
      flushBullets(); flushProse();
      push({ type:"text", id, html });
    }
    else if (b.type === "ide"){
      if (!b.key) b.key = newCodeKey();
      const blk = { type:"ide", id, starter: b.starter || "", key: b.key };
      if (b.startFrom) blk.startFrom = b.startFrom;
      if (Array.isArray(b.checks) && b.checks.length){
        blk.checks = b.checks.filter(c => (c.label || "").trim())
                             .map(c => Object.assign({}, c,
                               c.marks === undefined ? {} : { marks: Math.max(0, parseInt(c.marks, 10) || 0) }));
      }
      if (b.title) blk.title = b.title;              // headings stay optional
      if (b.task) blk.task = b.task;
      if (b.turtle) blk.turtle = true;
      if (b.expect) blk.expect = b.expect;
      /* Nothing waits on the Run button any more, so this is always off. Written
         out rather than left absent, because absent means "required" to the
         code that reads it. */
      blk.required = false;
      if (b.run === false) blk.run = false;        // console hidden
      if (b.edit === false) blk.edit = false;      // read-only code
      if (b.help === false) blk.help = false;      // no Help tab
      if (b.tooltips === false) blk.tooltips = false;
      if (b.autocomplete === false) blk.autocomplete = false;
      push(blk);
    }
    else if (b.type === "question")
      push(keepArrays({ type:"question", id,
             heading: b.heading || "",
             context: b.context ? (window.cleanRichText ? window.cleanRichText(b.context) : b.context) : "",
             prompt: b.prompt ? (window.cleanRichText ? window.cleanRichText(b.prompt) : b.prompt) : "",
             /* zero is a real setting, so it has to survive being saved:
                "|| 20" turned "no length wanted" back into twenty words */
             minWords: b.minWords === undefined ? 20 : Math.max(0, Number(b.minWords) || 0),
             /* how tall the answer boxes start; four unless a teacher changed it */
             lines: answerLines(b),
             /* the questions after the first, each with its own recommended
                length; ones with nothing written are dropped */
             extra: (b.extra || [])
               .filter(q => (window.cleanRichText ? window.cleanRichText(q.prompt || "") : (q.prompt || "")).trim())
               .map(q => ({
                 prompt: window.cleanRichText ? window.cleanRichText(q.prompt) : q.prompt,
                 minWords: q.minWords === undefined ? 20 : Math.max(0, Number(q.minWords) || 0)
               })) }));
    else if (b.type === "password")
      push({ type:"password", id, title: b.title || "", task: b.task || "" });
    else if (b.type === "caesar"){
      /* The message the teacher typed is shifted here and the answer is
         stored only as a hash, so neither the plain message nor the answer
         can be read out of the lesson file. */
      const shift = Math.max(1, Math.min(25, Number(b.shift) || 7));
      push({ type:"caesar", id,
             title: b.title || "", task: b.task || "", prompt: b.prompt || "",
             ciphertext: caesarEncode(b.message || "", shift),
             answerHash: strHash(normLetters(b.message || "")) });
    }
    else if (b.type === "web"){
      const blk = { type:"web", id, html: b.html || "", css: b.css || "", js: b.js || "",
                    files: (b.files && b.files.length) ? b.files : ["html","css","js"] };
      if (b.addFiles === true) blk.addFiles = true;
      if (Array.isArray(b.checks) && b.checks.length){
        blk.checks = b.checks.filter(c => (c.label || "").trim())
                             .map(c => Object.assign({}, c,
                               c.marks === undefined ? {} : { marks: Math.max(0, parseInt(c.marks, 10) || 0) }));
      }
      if (b.title) blk.title = b.title;
      if (b.task) blk.task = b.task;
      if (b.expect) blk.expect = b.expect;
      blk.required = false;                      // as above: Run never blocks
      if (b.run === false) blk.run = false;
      if (b.edit === false) blk.edit = false;
      if (b.help === false) blk.help = false;
      if (b.tooltips === false) blk.tooltips = false;
      if (b.autocomplete === false) blk.autocomplete = false;
      push(blk);
    }
    else if (b.type === "code"){ /* not chosen yet, nothing to build */ }
    else if (b.type === "keywords"){
      /* A word with nothing in it would be a blank row a student cannot
         answer, so those are left out. */
      const words = (b.words || [])
        .filter(x => (x.word || "").trim())
        .map(x => ({ word: x.word.trim(), hint: (x.hint || "").trim() || undefined }));
      if (!words.length) return;
      push({ type:"keywords", id, title: b.title || "",
             task: b.task ? (window.cleanRichText ? window.cleanRichText(b.task) : b.task) : "",
             words: words });
    }
    else if (b.type === "notes")
      push(keepArrays({ type:"notes", id, title: b.title || "", task: b.task || "",
        starter: b.starter || "" }));
    else if (b.type === "mindmap")
      push(keepArrays({ type:"mindmap", id, title: b.title || "", task: b.task || "",
        centre: b.centre || "", lockCentre: b.lockCentre === true,
        starter: Array.isArray(b.starter) ? b.starter : [] }));
    else if (b.type === "board")
      push(keepArrays({ type:"board", id, title: b.title || "", task: b.task || "",
        height: Number(b.height) || 420 }));
    else if (b.type === "label")
      push(keepArrays({ type:"label", id, title: b.title || "", task: b.task || "",
        image: b.image || "",
        /* the words to drag are simply the answers, shuffled so their order
           is not a clue */
        words: (b.spots || []).map(sp => sp.answer).filter(Boolean)
                 .sort(() => Math.random() - 0.5),
        spots: (b.spots || []).filter(sp => sp.answer) }));
    else if (b.type === "binary")
      push(keepArrays({ type:"binary", id, title: b.title || "", task: b.task || "",
        mode: b.mode || "toDenary", bits: Number(b.bits) || 8, count: Number(b.count) || 4,
        showPlace: b.showPlace !== false,
        numbers: String(b.numbers || "").split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n >= 0) }));
    else if (b.type === "binadd")
      push(keepArrays({ type:"binadd", id, title: b.title || "", task: b.task || "",
        bits: Number(b.bits) || 8, count: Number(b.count) || 3,
        showPlace: b.showPlace !== false, showCarry: b.showCarry !== false,
        pairs: String(b.pairs || "").split(/\n/).map(line => {
          const two = line.split(/[+,]/).map(x => parseInt(x.trim(), 10));
          return (two.length === 2 && !isNaN(two[0]) && !isNaN(two[1])) ? two : null;
        }).filter(Boolean) }));
    else if (b.type === "picture")
      /* Only the settings that are not the ordinary ones are written out, so a
         picture nobody has changed the shape of stays the three lines it was.
         keepArrays drops "" and undefined, which is what does the dropping. */
      push(keepArrays({ type:"picture", id, title: b.title || "", url: b.url || "",
             /* Which picture in the database this is, where it was
                uploaded rather than linked to. Dropped here and the
                lesson would reopen with an empty frame. */
             imgId: b.imgId || "",
             caption: b.caption || "", note: b.note || "", alt: b.alt || "",
             size: (b.size && b.size !== "full") ? b.size : "",
             width: (b.size === "custom") ? String(b.width || "") : "",
             align: (b.align === "centre" || b.align === "right") ? b.align : "",
             beside: (b.beside === "left" || b.beside === "right") ? b.beside : "",
             frame: b.frame === false ? false : undefined }));
    else if (b.type === "pastelink")
      push(keepArrays({ type:"pastelink", id, heading: b.heading || "Paste your link",
             task: b.task || "", note: b.note || "" }));
    else if (b.type === "quiz")
      push({ type:"quiz", id, title: b.title || "",
        questions: (b.questions || (b.q !== undefined
          ? [{ q:b.q, options:b.options, answers:[b.answer || 0], hint:b.hint }] : [])).map(q => {
            const opts = (q.options || []);
            const answers = (q.answers !== undefined ? q.answers : [q.answer || 0])
              .map(Number).filter(x => !isNaN(x) && x >= 0 && x < opts.length);
            return { q: q.q || "", options: opts.filter(x => x !== ""),
                     answers: answers.length ? answers : [0],
                     hint: q.hint || "", why: q.why || "" };
          }),
        pass: (b.pass && b.pass.mode && b.pass.mode !== "none")
          ? Object.assign({ mode: b.pass.mode, value: Math.max(1, parseInt(b.pass.value, 10) || 1) },
                          b.pass.hold === true ? { hold:true } : {})
          : undefined });
    else if (b.type === "image")
      push(keepArrays({ type:"image", id, title: b.title || "", task: b.task || "" }));
    else if (b.type === "embed")
      push(keepArrays({ type:"embed", id, url: toEmbed(b.url), title: b.title || "",
             note: b.note || "", confirm: b.confirm === true }));
    else if (b.type === "frame")
      push(keepArrays({ type:"frame", id, url: b.url || "", heading: b.heading || "", task: b.task || "",
             width: b.width || "100%", height: b.height || 520, confirm: b.confirm === true }));
    else if (b.type === "link")
      push(keepArrays({ type:"link", id, url: b.url || "", title: b.title || "Open this",   // the button needs words
             heading: b.heading || "", task: b.task || "", confirm: b.confirm === true }));
    else if (b.type === "mc")
      push(keepArrays({ type:"mc", id, prompt: b.prompt || "", options: (b.options || []).filter(x => x !== ""),
        answer: Number(b.answer) || 0, topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "blanks")
      push(keepArrays({ type:"blanks", id, prompt: b.prompt || "", text: b.text || "",
        distractors: (b.distractors || "").split(/\s*,\s*/).filter(Boolean),
        topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "order")
      push(keepArrays({ type:"order", id, prompt: b.prompt || "",
        items: (b.items || []).filter(x => x !== ""), topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "short")
      push(keepArrays({ type:"short", id, prompt: b.prompt || "",
        answers: (b.answers || []).map(x => String(x).trim()).filter(Boolean),
        model: b.model || "", topic: lesson.assessment ? b.topic : "" }));
    else if (b.type === "table"){
      /* Every row squared off to the width of the headings, and a cell
         with nothing in it and no box on it dropped to "". A ragged table
         renders with holes in it, and the holes are not in the same place
         in every browser. */
      const head = (b.head || []).map(h => String(h == null ? "" : h));
      const wide = Math.max(head.length, ...(b.rows || []).map(r => (r || []).length), 1);
      while (head.length < wide) head.push("");
      const rows = (b.rows || []).map(row => {
        const out = [];
        for (let c = 0; c < wide; c++){
          const cell = (row || [])[c];
          const o = (cell && typeof cell === "object") ? cell : { t: String(cell == null ? "" : cell) };
          const text = String(o.t == null ? "" : o.t);
          /* fill is written down only when it is on, and the answer only
             where there is one, so a big table stays a small lesson. */
          out.push(o.fill ? (text ? { t: text, fill: true } : { fill: true }) : { t: text });
        }
        return out;
      });
      push(keepArrays({ type:"table", id, title: b.title || "", task: b.task || "",
        head: head.some(h => h.trim()) ? head : undefined,
        rows: rows,
        point: b.point || "", code: b.code || "", strand: b.strand || "" }));
    }
    /* An exam question carries its specification point and the wording of
       that point with it. The lesson page has no way of reaching the
       specification table, and a lesson opened offline has no server at
       all, so what a student needs to see has to travel with the task. */
    else if (b.type === "exam"){
      const short = b.answer === "short";
      const out = { type:"exam", id,
        prompt: b.prompt ? (window.cleanRichText ? window.cleanRichText(b.prompt) : b.prompt) : "",
        command: b.command || "",
        marks: Math.max(0, parseInt(b.marks, 10) || 0),
        answer: short ? "short" : "lines",
        model: b.model || "",
        point: b.point || "", code: b.code || "", strand: b.strand || "" };
      if (short) out.answers = (b.answers || []).map(x => String(x).trim()).filter(Boolean);
      else {
        out.scheme = (b.scheme || [])
          .filter(p => p && String(p.text || "").trim())
          .map(p => ({ text: String(p.text).trim(), marks: Math.max(1, parseInt(p.marks, 10) || 1) }));
        const lines = parseInt(b.lines, 10) || 0;
        if (lines > 0) out.lines = lines;
      }
      push(keepArrays(out));
    }
  }
}

/* ---------------- drawing the cards ---------------- */
let dragFrom = null;
/* Which page is on screen. Held as the page itself rather than its position,
   because moving or deleting a page left the number pointing at whatever had
   slid into that slot: the wrong page was highlighted and new tasks joined it.
   Null only while a lesson has no pages at all. */
let openPageRef = null;
/* Every page at once with everything on it folded away. It is how you read the
   shape of a lesson, and the only place a task can be dragged from one page to
   another, now that the builder normally shows one page at a time. */
let viewAll = false;
let pageDrag = null;       // a page chip being dragged along the strip
let lastPageAt = 0;        // where the open page was, for when it is deleted
function pageList(){ return lesson.blocks.filter(x => x.type === "page"); }
function pageIndex(){ return openPageRef ? lesson.blocks.indexOf(openPageRef) : -1; }
/* The page a new task joins when nothing else says where it goes. */
function targetPage(){
  if (openPageRef && lesson.blocks.indexOf(openPageRef) >= 0) return openPageRef;
  openPageRef = pageList()[0] || null;
  return openPageRef;
}
/* Point the preview at a page and remember it as the one being worked on.
   The preview keeps its page in sessionStorage and reads it on load, so
   writing a page and asking for a refresh lands it on the same one. It goes
   into localStorage as well for a preview in its own tab: sessionStorage is
   per tab, and the pop-out was given a copy of it when it opened and never
   hears about anything written here afterwards. The stamp lets that preview
   tell a fresh request to move apart from one it has already acted on, so it
   only jumps when a page is actually picked. */
function tellPreview(page){
  openPageRef = page || null;
  const at = pageIndex();
  if (at >= 0){
    lastPageAt = at;
    try{
      sessionStorage.setItem("hub_preview_step", String(at));
      localStorage.setItem("hub_preview_go", JSON.stringify({ step:at, at:Date.now() }));
    }catch(e){}
  }
  schedulePreview();
}
/* Pages carry `collapsed`, tasks carry `folded`. Neither is ever compiled into
   the lesson file: they are only about getting around the builder.

   Which one you can fold depends on the view, and the two are opposites. One
   page at a time: the page is the workbench and is always open, its tasks
   fold. All pages: the tasks are always folded, because opening one there is
   how the column crept back to being forty screens of editors, and the pages
   themselves fold instead. */
function isShut(b){
  /* The task builder has one task on screen, so that one is always open.
     A page of tasks has tasks inside it, and those fold the way they do
     anywhere else; viewAll belongs to the lesson and says nothing here. */
  if (bankRoot) return b !== bankRoot && b.folded === true;
  if (b.type === "page") return viewAll && b.collapsed === true;
  return viewAll || b.folded === true;
}
/* One task open at a time on a page. The preview beside it already shows the
   whole page, so there is nothing to compare against by keeping two open. */
function toggleShut(b, arr){
  if (b.type === "page"){ b.collapsed = !b.collapsed; return; }
  const opening = b.folded === true;
  (arr || []).forEach(x => { if (x !== b && x.type !== "page") x.folded = true; });
  b.folded = !opening;
}
/* Whatever was just added is the thing being written, so it opens and the rest
   of the page shuts behind it. */
function openOnly(arr, b){
  (arr || []).forEach(x => { if (x !== b && x.type !== "page") x.folded = true; });
  if (b) b.folded = false;
}
/* A lesson that has just been opened starts on its first page with everything
   folded, rather than dropping a teacher into the middle of a wall of boxes. */
function startFolded(){
  const fold = (arr) => (arr || []).forEach(b => {
    if (b.type === "page"){ fold(b.blocks); return; }
    b.folded = true;
    if (b.type === "extension" || b.type === "group") fold(b.blocks);
    if (b.type === "choice") (b.options || []).forEach(o => fold(o.blocks));
  });
  fold(lesson.blocks);
  viewAll = false;
  openPageRef = pageList()[0] || null;
}
/* The first words a task actually says, for the line it folds down to. Each
   kind keeps its wording somewhere different, so the fields are tried in the
   order a person would read them. */
const SUMMARY_FIELDS = ["prompt","heading","title","html","text","message","centre","url","task","context"];
function taskSummary(b){
  if (b.type === "quiz"){
    const first = (b.questions || [])[0];
    const q = first ? plainWords(first.q) : "";
    if (q) return q;
  }
  if (b.type === "keywords"){
    const words = (b.words || []).map(w => String(w.word || "").trim()).filter(Boolean);
    if (words.length) return plainWords(words.join(", "));
  }
  if (b.type === "order"){
    const items = (b.items || []).map(x => String(x).trim()).filter(Boolean);
    if (items.length) return plainWords(items.join(" → "));
  }
  if (b.type === "choice"){
    const labels = (b.options || []).map(o => String(o.label || "").trim()).filter(Boolean);
    if (labels.length) return plainWords(labels.join(" / "));
  }
  if (b.type === "extension" || b.type === "group"){
    const n = (b.blocks || []).length;
    return (b.type === "group" && b.title ? b.title + ", " : "")
           + n + " task" + (n === 1 ? "" : "s");
  }
  if (b.type === "code") return "Python or a web page, not picked yet";
  for (let i = 0; i < SUMMARY_FIELDS.length; i++){
    const t = plainWords(b[SUMMARY_FIELDS[i]]);
    if (t) return t;
  }
  return "";
}
/* Rich text fields hold HTML, so it is read the way a person would see it.
   Stripped with a pattern rather than by putting it in an element: an image in
   a paragraph would be fetched by the browser the moment it was parsed, and
   this runs for every folded task on the page. */
function plainWords(v){
  if (v === undefined || v === null) return "";
  const t = String(v).replace(/<[^>]*>/g, " ")
                     .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
                     .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
                     .replace(/\s+/g, " ").trim();
  return t.length > 60 ? t.slice(0, 58).replace(/\s+$/, "") + "…" : t;
}
let lastAddedAt = -1;      // where the newest task landed, so we can scroll to it
let listWired = false;
function wireList(){
  if (listWired) return;
  listWired = true;
  wireDropList($("list"), () => lesson.blocks);
}
/* ---------- a box that takes tasks ----------
   The box works out where a drop would land and draws the line there, and
   the drop uses the answer the line was drawn from. One piece of code
   decides, so what a teacher is shown and what actually happens cannot
   disagree, which they did: every card took its own drop and landed the
   thing above itself, with nothing on screen saying so, and the gap between
   two cards belonged to neither of them.

   `arr` comes in as a function because the list is redrawn far more often
   than it is wired, and a box holding on to the array it had at the time
   would go on filing tasks into a page that has since been thrown away. */
function wireDropList(box, arr){
  /* Only the cards this box drew itself. A group on a page has cards of its
     own inside it, and they belong to that group's list, not this one. */
  const cards = () => Array.from(box.children).filter(c => c.classList && c.classList.contains("bcard"));
  /* Where in the array a drop here would go, worked out from the block each
     card is drawing rather than from how many cards there are: the strip of
     pages, the empty-state line and the row of add buttons all sit in these
     boxes too, and counting them in put tasks in the wrong place. */
  const slotIn = (list, hit) => {
    const under = hit.slot < cards().length ? cards()[hit.slot] : null;
    if (!under || !under.__block) return -1;              // -1 means at the end
    const at = list.indexOf(under.__block);
    return at < 0 ? -1 : at;
  };
  box.addEventListener("dragover", (e) => {
    if (!dragFrom && !newTask && !newBank) return;
    const list = arr();
    if (!canDropOn(list)) return;
    e.preventDefault(); e.stopPropagation();
    box.classList.add("over");
    window.dragLine.mark(box, cards(), e, {});
  });
  box.addEventListener("dragleave", (e) => {
    if (!window.dragLine.left(box, e)) return;
    box.classList.remove("over");
    window.dragLine.hide();
  });
  box.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation();
    box.classList.remove("over");
    const list = arr();
    const hit = window.dragLine.mark(box, cards(), e, {});
    window.dragLine.hide();
    dropInto(list, slotIn(list, hit));
  });
}
function firstPageOpen(){
  const first = lesson.blocks.find(x => x.type === "page");
  if (first) first.startLocked = false;
}
/* Rebuilding the list empties it, and an emptied list has scrolled back to
   the top. Every toggle on a card calls render(), which is why pressing
   something like "Turtle canvas" threw the page up to the top and lost
   a teacher's place. The position is measured before and put back after.

   When something has just been added there is somewhere better to be, so the
   new card is scrolled to instead. */
let scrollToBlock = null;
function render(){
  /* Every editor calls render() when a button on it is pressed. On the task
     bank that has to redraw the bank: rebuilding the lesson list instead
     would throw away the card being typed into and leave the pane blank. */
  if (bankOpen){ renderBank(); return; }
  const list = $("list");
  const keepList = list ? list.scrollTop : 0;
  const keepPage = window.scrollY;
  renderNow();
  const want = scrollToBlock; scrollToBlock = null;
  if (!list) return;
  if (want){
    /* after the browser has laid the new card out, or it has no position yet */
    requestAnimationFrame(() => {
      const card = Array.from(list.querySelectorAll(".bcard")).find(c => c.__block === want);
      if (!card) return;
      /* Not smooth. A long lesson puts the new card thousands of pixels away
         and a smooth scroll crawls over that distance: measured at one pixel
         in the best part of a second. Going straight there is what a teacher
         wants anyway, and the flash below says what moved. */
      card.scrollIntoView({ block:"center" });
      card.classList.add("justopened");
      setTimeout(() => card.classList.remove("justopened"), 1600);
    });
    return;
  }
  list.scrollTop = keepList;
  /* the compact builder scrolls the page itself rather than the list */
  if (window.scrollY !== keepPage) window.scrollTo(0, keepPage);
}

function renderNow(){
  /* the dot a note was hanging off is about to be thrown away */
  closeHelp();
  wireList();
  firstPageOpen();
  /* the palette is hidden only while writing feedback sentences */
  const writingTargets = (lesson.assessment || lesson.practical) && assessTab === "targets" && !respEditing;
  if (!writingTargets){
    /* Practice for a weak topic can be any kind of task, so writing response
       tasks offers the full lesson palette rather than the short list of
       question types an assessment is marked from. */
    const anyTask = !!respEditing;
    $("palLesson").hidden = !!lesson.assessment && !anyTask;
    $("palAssess").hidden = !lesson.assessment || anyTask;
  }
  const list = $("list"); list.innerHTML = "";
  /* an assessment is three pages: its questions, its feedback, its follow-up */
  if ((lesson.assessment || lesson.practical) && assessTab === "targets" && !respEditing){
    $("palLesson").hidden = true; $("palAssess").hidden = true;
    paintTargets(list); saveDraft(); return;
  }
  if ((lesson.assessment || lesson.practical) && assessTab === "responses" && !respEditing){
    paintResponseTopics(list); saveDraft(); return;
  }
  if (respEditing){
    const head = el("div","classhead");
    const niceName = (lesson.topics[respEditing] && lesson.topics[respEditing].label) || respEditing;
    head.appendChild(el("h2","", respEditing === "__ext" ? "Extension tasks"
                                                        : "Response tasks \u2022 " + niceName));
    const back = el("button","btn-ghost bmini2","Back to the list");
    back.addEventListener("click", () => { respEditing = null; render(); schedulePreview(); });
    head.appendChild(back);
    list.appendChild(head);
    const arr = respEditing === "__ext" ? (lesson.extensions || [])
                                        : (lesson.responses[respEditing] || []);
    if (!arr.length){
      const empty = el("p","hint dropzone","No tasks here yet, drag one from the left, or click it.");
      list.appendChild(empty);
    }
    arr.forEach((b, i) => list.appendChild(card(b, i, arr)));
    if (isCompact()) list.appendChild(addTaskRow(arr));
    /* dropping anywhere in the empty space adds to the end */
    list.addEventListener("dragover", (e) => {
      if (!canDropOn(arr)) return;
      e.preventDefault(); list.classList.add("over");
    });
    list.addEventListener("dragleave", () => list.classList.remove("over"));
    list.addEventListener("drop", (e) => {
      e.preventDefault(); list.classList.remove("over");
      dropInto(arr, -1);
    });
    saveDraft();
    return;
  }
  /* An assessment is a flat list of questions with no pages in it, so it is
     drawn the way it always was. */
  if (lesson.assessment && !lesson.practical){
    if (!lesson.blocks.length)
      list.appendChild(el("p","hint","No questions yet, add one from the left."));
    lesson.blocks.forEach((b, i) => list.appendChild(card(b, i, lesson.blocks)));
    /* On a narrow screen the palette is gone, so the list needs its own way to
       add to it. A lesson adds pages from the strip and tasks from inside the
       page; an assessment has neither, so the containers go straight
       underneath its questions. */
    if (isCompact()) list.appendChild(addTaskRow(lesson.blocks));
    saveDraft();
    return;
  }
  /* Everything else is made of pages, and one of them is shown at a time. A
     whole lesson laid out at once ran to forty-odd screens of scrolling and
     held every editor in it live, which is what made the column unreadable and
     every button on it slow. */
  list.appendChild(pageStrip());
  const pages = pageList();
  if (!pages.length){
    openPageRef = null;                  // whatever it pointed at has gone
    /* An empty lesson has no page to drop a task onto, and a lesson is
       built by dragging tasks over from the left. So the empty space takes
       the drop and makes the first page for it, which is what clicking a
       task has always done. */
    const empty = el("p","hint dropzone",
      "No pages yet. Drag a task here, or click one on the left, and a page is made for it.");
    empty.addEventListener("dragover", (e) => {
      if (!newTask && !newBank) return;
      e.preventDefault(); empty.classList.add("over");
    });
    empty.addEventListener("dragleave", () => empty.classList.remove("over"));
    empty.addEventListener("drop", (e) => {
      e.preventDefault(); empty.classList.remove("over");
      const group = (newBank && newBank.kind === "group") ? newBank : null;
      const bank = newBank, kind = newTask;
      newTask = null; newBank = null;
      /* No page yet, so there is nowhere to put these but a new one, and
         bankGroupAdd makes it the same way clicking any other task does. */
      if (group){ bankGroupAdd(group, null, -1); return; }
      addBlock(bank ? bankCopy(bank) : (kind ? newBlock(kind) : null));
    });
    list.appendChild(empty);
    saveDraft();
    return;
  }
  if (!openPageRef || lesson.blocks.indexOf(openPageRef) < 0){
    /* The page being edited has just been deleted, or dragged somewhere this
       list cannot see. Land on whatever has taken its place, or the one before
       it, rather than throwing a teacher back to page one from the middle of a
       lesson. */
    let at = Math.min(lastPageAt, lesson.blocks.length - 1);
    while (at >= 0 && (!lesson.blocks[at] || lesson.blocks[at].type !== "page")) at--;
    openPageRef = at >= 0 ? lesson.blocks[at] : pages[0];
    lastPageAt = Math.max(0, lesson.blocks.indexOf(openPageRef));
  }
  const shown = viewAll ? lesson.blocks : [openPageRef];
  shown.forEach(b => list.appendChild(card(b, lesson.blocks.indexOf(b), lesson.blocks)));
  saveDraft();
}

/* The page chips, without the two buttons on the end of the strip: those are
   things to press, not places in the lesson, and a line drawn beside "+ Page"
   would be pointing at a gap that is not one. */
function pageChips(bar){
  return Array.from(bar.children).filter(c => c.__page);
}
/* The pages side by side above the one being edited. It is how you get about a
   lesson now that only one is on screen: numbered, with the task count on each
   so a thin page shows up without opening it, and dragging a chip reorders the
   pages. The old way was dragging a card two thousand pixels past four others,
   which nobody managed twice. */
function pageStrip(){
  const wrap = el("div","pagestrip"); wrap.id = "pageStrip";
  const bar = el("div","pagestrip-bar");
  wrap.appendChild(bar);
  pageList().forEach((p, n) => {
    const name = String(p.title || "").trim() || "Untitled";
    const count = (p.blocks || []).length;
    const chip = el("button","pagechip");
    chip.type = "button";
    chip.__page = p;
    chip.appendChild(el("span","n", String(n + 1)));
    chip.appendChild(el("span","t", name));
    chip.appendChild(el("span","c", String(count)));
    chip.title = name + " • " + count + " task" + (count === 1 ? "" : "s");
    /* Filled in when this is the page being edited; only outlined when every
       page is on screen, where it is saying which one the preview follows
       rather than which one you are in. */
    if (p === openPageRef) chip.classList.add(viewAll ? "here" : "on");
    chip.addEventListener("click", () => { viewAll = false; tellPreview(p); render(); });
    chip.draggable = true;
    chip.addEventListener("dragstart", (e) => {
      pageDrag = p; newTask = null; newBank = null; dragFrom = null;
      chip.classList.add("dragging");
      if (e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain","page"); }
    });
    chip.addEventListener("dragend", () => { chip.classList.remove("dragging"); pageDrag = null; });
    bar.appendChild(chip);
  });
  /* The strip takes the drop, not the chip. A chip that took its own put the
     page one place to the left of wherever it was dropped and never said so,
     and the gap between two chips belonged to neither of them. The line runs
     down the gap the page is going into. */
  bar.addEventListener("dragover", (e) => {
    if (!pageDrag) return;
    e.preventDefault(); e.stopPropagation();
    window.dragLine.mark(bar, pageChips(bar), e, { across: true });
  });
  bar.addEventListener("dragleave", (e) => { if (window.dragLine.left(bar, e)) window.dragLine.hide(); });
  bar.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation();
    const moved = pageDrag; pageDrag = null;
    const all = pageChips(bar);
    const hit = window.dragLine.mark(bar, all, e, { across: true });
    window.dragLine.hide();
    if (!moved) return;
    const from = lesson.blocks.indexOf(moved);
    if (from < 0) return;
    /* Which page it goes in front of, worked out before anything moves: the
       chip under the line, or the end of the lesson when there is none. */
    const before = all[hit.slot] ? all[hit.slot].__page : null;
    if (before === moved) return;
    lesson.blocks.splice(from, 1);
    const at = before ? lesson.blocks.indexOf(before) : -1;
    if (at < 0) lesson.blocks.push(moved); else lesson.blocks.splice(at, 0, moved);
    firstPageOpen();
    render(); schedulePreview();
  });
  const add = el("button","pagechip add","+ Page");
  add.type = "button";
  add.title = "Add a page to the end";
  add.addEventListener("click", addPage);
  bar.appendChild(add);

  /* Nothing to compare against with one page, so the way of seeing them all
     only appears once there are two. */
  if (pageList().length < 2) return wrap;
  const all = el("button","pagechip all", viewAll ? "One page at a time" : "All pages");
  all.type = "button";
  all.title = viewAll ? "Back to editing one page"
                      : "Every page at once, tasks folded away, for reading the shape of the lesson and for moving a task between pages";
  if (viewAll) all.classList.add("on");
  all.addEventListener("click", () => { viewAll = !viewAll; render(); });
  wrap.appendChild(all);
  return wrap;
}

function addPage(){
  const made = BLANK.page();
  lesson.blocks.push(made);
  viewAll = false;
  tellPreview(made);
  scrollToBlock = made;
  render();
}

/* Only the chip highlight changes when a page is picked from a card, so the
   strip is not rebuilt: doing that from a mousedown threw away the element
   being pressed before its mouseup could land on it. */
function paintStrip(){
  const strip = document.getElementById("pageStrip");
  if (!strip) return;
  strip.querySelectorAll(".pagechip").forEach(chip => {
    if (!chip.__page) return;
    chip.classList.toggle("on", chip.__page === openPageRef && !viewAll);
    chip.classList.toggle("here", chip.__page === openPageRef && viewAll);
  });
}

/* Only one page is on screen, so a task can no longer be dragged onto another
   one. This is the way across. */
function movePagePicker(b, arr){
  openModal(box => {
    box.appendChild(el("h2","","Move this to another page"));
    box.appendChild(el("p","modal-text","It joins the end of the page you pick."));
    const holder = el("div","modepick");
    pageList().forEach((p, n) => {
      const here = p.blocks === arr;
      const name = String(p.title || "").trim() || "Untitled";
      const row = el("button","modepick-item",
                     (n + 1) + ". " + name + (here ? "   it is on this one now" : ""));
      if (here) row.disabled = true;
      row.addEventListener("click", () => {
        const at = arr.indexOf(b);
        closeModal();
        if (at < 0) return;
        arr.splice(at, 1);
        p.blocks.push(b);
        openOnly(p.blocks, b);
        viewAll = false;
        tellPreview(p);
        scrollToBlock = b;
        render();
      });
      holder.appendChild(row);
    });
    box.appendChild(holder);
  });
}
let newTask = null;          // a task being dragged in from the palette
let newBank = null;          // a task being dragged in from the task bank

/* pages only live at the top; everything else only lives on a page */
/* the list of tasks currently on screen */
function openArray(){
  if (!respEditing) return null;
  return respEditing === "__ext" ? lesson.extensions : (lesson.responses[respEditing] || []);
}
/* Everything inside a block, however deep. A group can hold groups, so a
   group can be dragged onto its own insides, and dropping it there would
   make it its own child: render() would then draw it until the tab gave
   up. Whatever is being dragged is therefore not allowed to land anywhere
   under itself. */
function holdsList(b, arr){
  if (!b) return false;
  const lists = (b.type === "choice")
    ? (b.options || []).map(o => o.blocks || [])
    : [b.blocks || []];
  for (const list of lists){
    if (list === arr) return true;
    for (const child of list) if (holdsList(child, arr)) return true;
  }
  return false;
}
function canDropOn(arr){
  /* Three things can be dropped: a kind off the palette, a task out of the
     bank, and a task already in the lesson being moved. What a bank task
     may land on depends on what it is, the same as anything else. */
  const kind = newTask || (newBank && newBank.block && newBank.block.type)
                       || (dragFrom && dragFrom.type);
  if (!kind) return false;
  if (dragFrom && holdsList(dragFrom.arr[dragFrom.i], arr)) return false;
  /* a page only makes sense at the top of a lesson */
  if (kind === "page") return arr === lesson.blocks && !respEditing;
  /* and extension tasks only inside one of those pages: not loose at the top,
     and not inside another extension container */
  if (kind === "extension"){
    return !respEditing && lesson.blocks.some(x => x.type === "page" && x.blocks === arr);
  }
  /* While a response set is open it is the only place a task can go —
     otherwise the page behind it takes the drop instead. */
  if (respEditing) return arr === openArray();
  return lesson.assessment ? true : arr !== lesson.blocks;
}
/* put whatever is being dragged at position `at` in `arr` */
function dropInto(arr, at){
  /* Refusing must leave the drag alone: another list may still be about to
     accept it, and clearing here would take the task away from it. */
  if (!canDropOn(arr)) return;
  if (newTask || newBank){
    /* A group is not one block to splice in here. It is several tasks, and
       a group of groups may be several pages' worth, so it takes itself
       where it is going rather than handing back something to insert. */
    if (newBank && newBank.kind === "group"){
      const group = newBank;
      newTask = null; newBank = null;
      bankGroupAdd(group, arr, at);
      return;
    }
    const made = newBank ? bankCopy(newBank) : newBlock(newTask);
    newTask = null; newBank = null;
    if (!made) return;
    arr.splice(at < 0 ? arr.length : at, 0, made);
    if (made.type === "page"){ viewAll = false; tellPreview(made); }
    else { openOnly(arr, made); viewAll = false; }
    scrollToBlock = made;
    render(); schedulePreview();
    return;
  }
  if (!dragFrom) return;
  const from = dragFrom; dragFrom = null;
  const moved = from.arr[from.i];
  if (!moved) { render(); return; }
  if (from.arr === arr){
    let to = at < 0 ? arr.length - 1 : at;
    if (from.i === to){ render(); return; }
    from.arr.splice(from.i, 1);
    arr.splice(to, 0, moved);                 // it takes the place it was dropped on
  } else {
    from.arr.splice(from.i, 1);
    arr.splice(at < 0 ? arr.length : at, 0, moved);
  }
  render(); schedulePreview();
}

function move(arr, i, d){
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const moved = arr.splice(i, 1)[0];
  arr.splice(j, 0, moved);
  render(); schedulePreview();
}
/* Pages are numbered among the pages, so a card says which page it is rather
   than where it happens to sit in the list. */
function pageNumber(b){
  return lesson.blocks.filter(x => x.type === "page").indexOf(b) + 1;
}
function headLabel(b, i){
  if (b.type !== "page") return (i + 1) + ". " + LABEL[b.type];
  const t = String(b.title || "").trim();
  /* "1. Page: Introduction", or just "1. Page" while it has no title, rather
     than leaving a colon hanging with nothing after it. */
  return pageNumber(b) + ". Page" + (t ? ": " + t : "");
}

/* What is wrong with the answers a teacher has typed, said under the box
   rather than at save time: a half-written question is normal while it is
   being written, and a pop-up on every save would be in the way.

   Two answers that only differ by capitals, spacing or punctuation are one
   answer once the comparison has finished with them, and a teacher adding
   both has not made the question any easier. shortmatch.js decides that, so
   the warning cannot drift away from the marking. */
function shortAnswerNotes(body, b){
  const said = [];
  const list = (b.answers || []).map(x => String(x).trim()).filter(Boolean);
  if (b.wasKeywords)
    said.push("This question used to be checked for keywords. Each keyword is " +
              "now an answer on its own line. Students have to type one of them " +
              "exactly, so delete any that are not a whole answer.");
  if (!list.length)
    said.push("No answers yet, so nobody can get this right. It saves and students " +
              "can still write in it, but it will mark as wrong until you add one.");
  const seen = new Map();
  list.forEach(a => {
    const key = window.shortAnswer.normalise(a, list);
    if (seen.has(key) && seen.get(key) !== a) said.push("“" + seen.get(key) + "” and “" + a +
      "” already count as the same answer, so one of them can go.");
    else seen.set(key, a);
  });
  said.forEach(text => body.appendChild(el("p","bhelp warn", text)));
}

/* ---------- holding back the rest of a page ----------
   Set per task, from the eye on its card. What each level means to a student
   is decided in lesson.html (taskGate), which marks it with the same rules
   as the Progress tab; this only offers the levels that mean something for
   the kind of task it is. The tasks that can be marked are the ones the
   Progress tab counts. */
const GATE_TYPES = ["quiz","mc","order","blanks","short","ide","web"];
const EYE_SHUT = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>' +
  '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>' +
  '<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

/* A quiz's third level is its own pass mark, which is kept where it always
   was, on b.pass, with hold switched on. Every other level is b.gate. */
function gateLevel(b){
  if (b.type === "quiz" && b.pass && b.pass.hold === true && b.pass.mode && b.pass.mode !== "none")
    return "pass";
  return ["attempted","partial","full"].includes(b.gate) ? b.gate : "none";
}
function gateName(b){
  const level = gateLevel(b);
  if (level === "pass")
    return "Pass mark (" + b.pass.value + (b.pass.mode === "percent" ? "%" : " right") + ")";
  return { none:"None", attempted:"Attempted", partial:"Partial", full:"Full" }[level];
}
/* Partial is only offered where there is more than one thing to get right:
   a multiple choice question is right or it is not, so Partial and Full
   would be the same thing under two names. A coding task has nothing to get
   right without a checklist, so it only offers Attempted until it has one. */
function gateChoices(b){
  const none = ["none","None","Everything on the page is there from the start."];
  if (b.type === "quiz") return [none,
    ["attempted","Attempted","They have answered at least one question, right or wrong."],
    ["pass","Pass mark","They finish the quiz and get enough right. You choose how many below."]];
  const code = b.type === "ide" || b.type === "web";
  const out = [none, ["attempted","Attempted", code
    ? "They have changed the code or run it, whether or not it works yet."
    : "They have had a go, right or wrong."]];
  if (code && !(Array.isArray(b.checks) && b.checks.some(c => String(c.label || "").trim()))) return out;
  if (code || b.type === "blanks")
    out.push(["partial","Partial", code ? "At least one line on the checklist is ticked."
                                        : "At least one gap is right."]);
  out.push(["full","Full", code ? "Every line on the checklist is ticked. Lines you tick by hand only count once you have ticked them."
                              : b.type === "blanks" ? "Every gap is right." : "They get it right."]);
  return out;
}
function setGate(b, level){
  if (level === "pass"){
    delete b.gate;
    const keep = (b.pass && b.pass.value) || 70;
    if (!b.pass || !b.pass.mode || b.pass.mode === "none") b.pass = { mode:"percent", value:keep };
    b.pass.hold = true;
    return;
  }
  if (level === "none") delete b.gate; else b.gate = level;
  /* The pass mark only ever decides what opens the page, so it goes with
     the level. The number is remembered, for going back to Pass mark. */
  if (b.type === "quiz") b.pass = { mode:"none", value:(b.pass && b.pass.value) || 70 };
}
function askGate(b){
  openModal(box => {
    box.appendChild(el("h2","","Hide the rest of the page"));
    box.appendChild(el("p","modal-text",
      "Everything below this task on the same page stays out of sight until a student " +
      "has done this much of it. Continue still works, so nobody is ever stuck."));
    const now = gateLevel(b);
    const list = el("div","modepick");
    gateChoices(b).forEach(choice => {
      const row = el("button","modepick-item gatepick" + (choice[0] === now ? " on" : ""));
      row.type = "button";
      row.setAttribute("aria-pressed", choice[0] === now ? "true" : "false");
      row.appendChild(el("b","", choice[1]));
      row.appendChild(el("span","", choice[2]));
      row.addEventListener("click", () => {
        setGate(b, choice[0]);
        saveDraft(); render(); schedulePreview();
        askGate(b);                // drawn again to show the choice, and the pass mark under it
      });
      list.appendChild(row);
    });
    box.appendChild(list);
    if (now === "pass") box.appendChild(passMarkEditor(b));
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}
/* The pass mark, as a percentage or a number of questions. This used to sit
   under every quiz, set to 70% whether anyone wanted one or not. */
function passMarkEditor(b){
  const pw = el("div","bfield gatepass");
  pw.appendChild(el("label","","How many they have to get right"));
  const modes = el("div","brow");
  [["percent","A percentage"],["count","A number of questions"]].forEach(pair => {
    const btn = el("button","btn-ghost bmini2" + (b.pass.mode === pair[0] ? " right" : ""), pair[1]);
    btn.type = "button";
    btn.addEventListener("click", () => {
      b.pass.mode = pair[0];
      const most = pair[0] === "percent" ? 100 : Math.max(1, (b.questions || []).length);
      b.pass.value = Math.max(1, Math.min(most, parseInt(b.pass.value, 10) || 1));
      saveDraft(); render(); schedulePreview(); askGate(b);
    });
    modes.appendChild(btn);
  });
  pw.appendChild(modes);
  const row = el("div","stepper");
  const less = el("button","btn-ghost iconbtn","\u2212");
  const num = el("input"); num.type = "number"; num.className = "stepnum";
  const most = b.pass.mode === "percent" ? 100 : Math.max(1, (b.questions || []).length);
  num.min = "1"; num.max = String(most);
  num.value = String(Math.min(b.pass.value || 1, most));
  const more = el("button","btn-ghost iconbtn","+");
  const setPass = (v) => {
    b.pass.value = Math.max(1, Math.min(most, Math.round(Number(v) || 1)));
    num.value = String(b.pass.value);
    saveDraft(); render(); schedulePreview();
  };
  const step = b.pass.mode === "percent" ? 10 : 1;
  less.addEventListener("click", () => setPass((parseInt(num.value, 10) || 1) - step));
  more.addEventListener("click", () => setPass((parseInt(num.value, 10) || 1) + step));
  num.addEventListener("change", () => setPass(num.value));
  row.appendChild(less); row.appendChild(num); row.appendChild(more);
  row.appendChild(el("span","gateunit", b.pass.mode === "percent" ? "%" : "of " + (b.questions || []).length));
  pw.appendChild(row);
  return pw;
}

function card(b, i, arr){
  const c = el("div","bcard");
  c.draggable = false;
  c.__block = b;              // so render() can scroll back to a new one


  const head = el("div","bhead");
  const shut = isShut(b);
  /* Only the All pages view has more than one page on screen, so only there
     does picking one out mean anything. */
  if (b.type === "page" && viewAll){
    if (b === openPageRef) c.classList.add("open");
    c.addEventListener("mousedown", () => {
      if (b === openPageRef) return;
      tellPreview(b);
      /* Only the highlight changes, so the cards themselves are left alone.
         Rendering again from here threw away the very element being pressed
         before its mouseup could land on it, so clicking a button or a box on
         another page took two goes: one to move the highlight, one to do the
         thing. */
      const holder = c.closest(".build-list") || document;
      holder.querySelectorAll(".bcard.open").forEach(x => x.classList.remove("open"));
      c.classList.add("open");
      paintStrip();
    });
  }
  if (b !== bankRoot){
    const grip = el("span","bgrip","\u2630"); grip.title = "Drag to move";
    grip.addEventListener("mousedown", () => { c.draggable = true; });
    grip.addEventListener("mouseup", () => { c.draggable = false; });
    head.appendChild(grip);
  }
  /* Folding leaves this line and the buttons on it, which is all that is
     needed to find, move or reorder something. It is a way of getting about a
     long lesson, so it is kept out of the saved lesson: it says nothing about
     what a student sees.

     Which things fold depends on the view, and it is never both at once.
     Editing one page, the page is the workbench and its tasks fold; looking at
     all of them, the tasks are already shut and the pages fold instead. */
  const canFold = (b === bankRoot) ? false : (b.type === "page" ? viewAll : !viewAll);
  if (canFold){
    const fold = el("button","btn-ghost bmini foldbtn", shut ? "▸" : "▾");
    fold.title = b.type === "page"
      ? (shut ? "Open this page" : "Fold this page away")
      : (shut ? "Open this task" : "Fold this task away");
    fold.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleShut(b, arr);
      saveDraft(); render();
    });
    head.appendChild(fold);
  }
  /* Numbered by where it sits in a lesson. A bank task sits nowhere, so it
     says what it is and nothing else. */
  const btype = el("b","btype", (b === bankRoot) ? (LABEL[b.type] || b.type) : headLabel(b, i));
  head.appendChild(btype);
  /* Shut, the line has to say enough to pick the task out by, so it carries
     the first thing the task itself says and not only what kind it is. */
  if (shut && b.type !== "page"){
    const said = taskSummary(b);
    if (said){
      head.classList.add("hassum");
      head.appendChild(el("span","bsum", said));
    }
  }
  /* Anywhere along the line opens it, which is a far bigger target than the
     little arrow, and nothing else on a shut card wants the click. */
  if (canFold && b.type !== "page"){
    head.classList.add("tapfold");
    head.addEventListener("click", (e) => {
      if (e.target.closest("button") || e.target.closest(".bgrip")) return;
      toggleShut(b, arr);
      saveDraft(); render();
    });
  }
  const paintHead = () => { btype.textContent = headLabel(b, i); };
  const tools = el("span","btools");
  /* A page in the task builder is a shape to fill in, not a page of a
     lesson: there is nothing for it to be locked against and no class to
     release it to. Those buttons appear when it is put into a lesson. */
  if (b.type === "page" && b !== bankRoot){
    const isFirst = lesson.blocks.indexOf(b) === 0;
    if (isFirst) b.startLocked = false;     // students must be able to begin
    const locked = b.startLocked !== false;
    const lk = el("button","btn-ghost bmini lockbtn" + (locked ? "" : " open"), locked ? "\u{1F512}" : "\u{1F513}");
    lk.title = isFirst ? "The first page always starts unlocked"
             : locked ? (OFFLINE ? "Locked until the passcode is typed, click to leave it open"
                                 : "Starts locked when a class gets this lesson, click to start it unlocked")
                      : "Starts unlocked, click to start it locked";
    lk.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isFirst){
        say("The first page stays unlocked",
