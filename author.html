async function catPost(payload){
  const API = (window.HUB && window.HUB.API) || "";
  if (!signedIn()){ askForKey(() => catPost(payload), "Sign in to change the year groups and units."); return; }
  const r = await fetch(API + "/api/catalog", { method:"POST",
    headers: window.teacherAuth.json(),
    body: JSON.stringify(payload) });
  if (authFailed(r.status, () => catPost(payload))) return;
  if (!r.ok) throw new Error((await r.json()).error || "Could not save.");
}

let cat = { units: [], years: [], points: [] };

/* ---------------- the specification ----------------
   cat.points is the whole tree for every qualification, as it came from the
   catalogue: strands have no parent, points name the strand they are under.
   Empty until the database has the table, which is what keeps the task bank
   and exam questions out of the way until then. */
/* What the year group now chosen is working towards, or "" for KS3 and for
   a lesson with no year group picked yet. */
function specLevel(){
  const y = (cat.years || []).find(x => x.name === lesson.year);
  const level = y ? String(y.level || "KS3") : "";
  return (level === "GCSE" || level === "A Level") ? level : "";
}
function specPointOf(id){
  if (!id) return null;
  return (cat.points || []).find(p => p.id === id) || null;
}
function specComponents(level){
  const seen = [];
  (cat.points || []).forEach(p => {
    if (p.level !== level) return;
    const n = parseInt(p.component, 10) || 0;
    if (n && seen.indexOf(n) < 0) seen.push(n);
  });
  return seen.sort((a, b) => a - b);
}
/* A component of 0 means one has not been picked, and then every strand of
   the level is offered rather than none: a teacher who knows the number of
   the point but not which paper it is on can still find it. */
function specStrands(level, component){
  return (cat.points || []).filter(p =>
    p.level === level && !p.parent && (!component || Number(p.component) === Number(component)));
}
function specPoints(strandId){
  return (cat.points || []).filter(p => p.parent === strandId);
}
/* "1.1.1 Architecture of the CPU", for a list. */
function specLabel(id){
  const p = specPointOf(id);
  if (!p) return "";
  return p.code + " " + p.title;
}
/* Which strand of the specification this lesson sits under. The point it is
   filed against says so, and where nothing is filed yet the unit already
   written is the only clue: a GCSE lesson saved before this picker existed
   carries the strand's wording and nothing else. */
function specStrandOfLesson(){
  const p = specPointOf(lesson.point || "");
  if (p) return p.parent ? (specPointOf(p.parent) || null) : p;
  const named = (lesson.unit || "").trim();
  if (!named) return null;
  return specStrands(specLevel(), 0).find(s => (s.code + " " + s.title) === named) || null;
}
/* Writing the filing down. The id decides everything; the two names are
   written out beside it because that is what goes into the catalogue, and
   the screens that read them, a class's lessons and a student's home page,
   are never sent the specification to look an id up in. */
function fileLessonUnder(strand, pointId){
  const p = specPointOf(pointId || "");
  const sub = (p && p.parent) ? p : null;
  lesson.unit = strand ? (strand.code + " " + strand.title) : "";
  lesson.subunit = sub ? (sub.code + " " + sub.title) : "";
  lesson.point = sub ? sub.id : (strand ? strand.id : "");
}
/* The two pickers a GCSE or A Level lesson is filed with, in place of the one
   unit picker a KS3 lesson has. The point down the first, its sub-points down
   the second, and a lesson that covers the whole of 2.2 rather than one part
   of it leaves the second on "The whole of 2.2". */
function paintSpecPickers(us, sub){
  const level = specLevel();
  const strand = specStrandOfLesson();
  us.disabled = false;
  us.title = "Which point of the specification this lesson is for";
  us.innerHTML = "";
  const none = document.createElement("option");
  none.value = ""; none.textContent = "Specification point…";
  us.appendChild(none);
  /* Grouped by paper, because 1.1 and 2.1 are different things and a flat
     list of thirteen numbers gives no sign of which is which. */
  specComponents(level).forEach(n => {
    const group = document.createElement("optgroup");
    group.label = "Component " + n;
    specStrands(level, n).forEach(s => {
      const o = document.createElement("option");
      o.value = s.id; o.textContent = s.code + " " + s.title;
      group.appendChild(o);
    });
    if (group.childNodes.length) us.appendChild(group);
  });
  us.value = strand ? strand.id : "";

  const kids = strand ? specPoints(strand.id) : [];
  sub.innerHTML = "";
  const whole = document.createElement("option");
  whole.value = "";
  whole.textContent = strand ? ("The whole of " + strand.code)
                             : "Choose a specification point first";
  sub.appendChild(whole);
  kids.forEach(p => {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = p.code + " " + p.title;
    sub.appendChild(o);
  });
  sub.disabled = !kids.length;
  sub.title = kids.length ? "Which part of it" : "Pick a specification point before the sub-point";
  const mine = specPointOf(lesson.point || "");
  sub.value = (mine && mine.parent) ? mine.id : "";
  /* The words follow the ids, so a lesson opened from a point of the
     specification is filed under both without anybody having to touch
     either picker. */
  fileLessonUnder(strand, sub.value);
}
function paintPickers(){
  const ys = $("lYear"), us = $("lUnit"), sub = $("lSub");
  const years = (cat.years || []).map(y => y.name);
  (cat.units || []).forEach(u => { if (u.year && years.indexOf(u.year) < 0) years.push(u.year); });
  ys.innerHTML = "";
  const y0 = document.createElement("option");
  y0.value = ""; y0.textContent = "Year group…"; ys.appendChild(y0);
  years.forEach(y => {
    const o = document.createElement("option"); o.value = y; o.textContent = y;
    if (y === lesson.year) o.selected = true;
    ys.appendChild(o);
  });
  const yNew = document.createElement("option");
  yNew.value = "__new"; yNew.textContent = "+ New year group"; ys.appendChild(yNew);

  /* A GCSE or A Level year group is not divided into units: it is divided by
     the specification, so the same two pickers stand for the point and the
     sub-point instead. Nothing is duplicated, so there is only ever one of
     each on the page and the Save pop-up can borrow them the way it always
     has. */
  if (specLevel()){
    sub.hidden = false;
    paintSpecPickers(us, sub);
    paintSpecUI();
    return;
  }
  sub.hidden = true;
  /* A year group changed from GCSE back to KS3 leaves its filing behind:
     "2.2.1 Programming fundamentals" means nothing in a hub divided into
     units, and a point still written down would send the lesson back to a
     screen its year group no longer has.

     Only where the year group is one we have, and it is KS3. A catalogue
     that has not arrived, or did not arrive at all, looks exactly like a
     KS3 year group from here, and throwing the filing away over a failed
     fetch would lose it the moment the lesson was saved again. */
  const chosen = (cat.years || []).find(y => y.name === lesson.year);
  if (chosen){ lesson.subunit = ""; lesson.point = ""; }

  /* Units belong to a year, so until one is chosen there is nothing sensible
     to offer. Listing them all let the browser pick the first by itself. */
  us.innerHTML = "";
  const u0 = document.createElement("option");
  u0.value = "";
  u0.textContent = lesson.year ? "Unit\u2026" : "Choose a year group first";
  us.appendChild(u0);
  us.disabled = !lesson.year;
  us.title = lesson.year ? "" : "Pick a year group before the unit";
  if (lesson.year){
    (cat.units || []).filter(u => (u.year || "") === lesson.year).forEach(u => {
      const o = document.createElement("option"); o.value = u.name; o.textContent = u.name;
      if (u.name === lesson.unit) o.selected = true;
      us.appendChild(o);
    });
    const uNew = document.createElement("option");
    uNew.value = "__new"; uNew.textContent = "+ New unit"; us.appendChild(uNew);
  }
  if (!lesson.year && lesson.unit) lesson.unit = "";
  us.value = lesson.unit && lesson.year ? lesson.unit : "";
  paintSpecUI();
}

/* The task bank and the exam questions appear and disappear with the year
   group, which is chosen here and can be changed at any point. A new lesson
   has no year group at all until one is picked, so this runs on every change
   rather than once at start-up. */
function paintSpecUI(){
  const on = !!specLevel();
  const tab = $("tabBank");
  if (tab) tab.hidden = !on;
  ["palSpec", "palSpecAssess", "palGroupBtn"].forEach(id => { const e = $(id); if (e) e.hidden = !on; });
  /* Moving to a KS3 year group with the task builder open would leave a
     teacher on a screen with no way back to their lesson. */
  if (!on && bankOpen) showBank(false);
  paintPointPalette();
  if (typeof paintBuildBar === "function") paintBuildBar();
}

/* ---------------- the left column, for a lesson on one point ----------
   A lesson started from a point of the specification is built out of the
   tasks written for it, so those come first and nothing else is in the
   way. Behind them, in order of how often they are wanted:

     All tasks          the rest of the bank, with a funnel to narrow it
     Add a custom task  the standard task types, for the odd thing the
                        bank has no task for

   The whole task comes down with each list, not just its name: one
   dragged onto a page has to be ready when it lands, and fetching it at
   that moment is a round trip in the middle of a drag. */
let pointTasks = [];
let pointTasksFor = null;          // which point the list in hand belongs to
let showEverything = false;        // "Add a custom task" has been pressed
let palAll = false;                // "All tasks" has been pressed
let palAllTasks = [];
let palAllFor = null;              // the filter the list in hand was fetched for
let palAllCapped = false;
let palFind = { component:0, strand:"", point:"" };

/* The filter menu, on both screens.

   menus.js decides whether a menu has room below or above and turns it into
   a pop-up when nothing fits, but it measures height: a menu hanging off a
   button in a 190px column has room below it and still runs off the left of
   the screen, because .menu is anchored by its right edge. So it is opened,
   measured where it actually landed, and anchored the other way round if it
   went off. Measured rather than assumed: which way it needs to go depends
   on the column, the pane width and which of the two screens it is on. */
function openFilterMenu(btn, menu){
  menu.classList.remove("anchor-left");
  if (window.placeMenu) window.placeMenu(btn, menu);
  menu.hidden = false;
  const box = menu.getBoundingClientRect();
  if (box.left < 8) menu.classList.add("anchor-left");
}

/* One task in the column: draggable onto a page, or click to add it. Both
   lists draw with this, so there is one of them to keep working. */
function bankTaskButton(t){
  const btn = el("button","pal pal-bank" + (t.kind === "group" ? " pal-group" : ""));
  btn.appendChild(el("b","", t.title || (t.kind === "group" ? "Untitled group" : "Untitled task")));
  /* A group says how many tasks come with it, because that is the thing a
     teacher is deciding about when they drag one onto a page. */
  const inside = t.kind === "group" ? bankGroupSize(t, bankKnown()) : 0;
  const meta = [t.kind === "group" ? "Group" : (LABEL[t.kind] || t.kind),
                t.kind === "group" ? inside + " task" + (inside === 1 ? "" : "s") : "",
                specLabel(t.point),
                t.marks ? t.marks + (t.marks === 1 ? " mark" : " marks") : ""].filter(Boolean);
  btn.appendChild(el("span","", meta.join("  ·  ")));
  btn.draggable = true;
  btn.addEventListener("dragstart", (e) => {
    newBank = t; newTask = null; dragFrom = null;
    btn.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", t.id); }
  });
  btn.addEventListener("dragend", () => { btn.classList.remove("dragging"); newBank = null; });
  btn.addEventListener("click", () => {
    if (t.kind === "group"){ bankGroupAdd(t, null, -1); return; }
    const made = bankCopy(t);
    if (made) addBlock(made);
  });
  return btn;
}

/* How many tasks a group holds, counting the ones in the groups inside it. */
function bankGroupSize(t, all, seen){
  seen = seen || new Set();
  if (seen.has(t.id)) return 0;
  seen.add(t.id);
  let n = 0;
  all.filter(x => (x.group_id || "") === t.id).forEach(x => {
    n += (x.kind === "group") ? bankGroupSize(x, all, seen) : 1;
  });
  return n;
}
/* What the palette lists: the groups, and then the tasks that are not in one
   of them. A task inside a group comes with the group, so listing it again on
   its own would offer the same question twice. A task whose group is not in
   this list, because the list is one point's worth and the group is filed
   under another, is still offered on its own rather than lost. */
function bankTopLevel(rows){
  const have = new Set((rows || []).map(t => t.id));
  return (rows || []).filter(t => !(t.group_id && have.has(t.group_id)));
}
function paintPointPalette(){
  const list = $("palPointList");
  if (!list) return;
  const point = lesson.point || "";
  const wanted = !!point && !!specLevel() && !lesson.assessment;
  $("palPoint").hidden = !wanted;
  $("palMoreBtn").hidden = !wanted;
  /* New page stands on its own above everything, so the palette's own copy
     inside the standard list is taken out to leave one of it. */
  $("palNewPage").hidden = !wanted;
  const inList = $("palStandard").querySelector('.pal[data-add="page"]');
  if (inList) inList.hidden = wanted;
  const more = $("palMoreBtn");
  more.classList.toggle("on", showEverything);
  more.setAttribute("aria-pressed", showEverything ? "true" : "false");
  /* Without a point there is nothing to narrow the column down to, so it is
     the full palette exactly as it has always been. */
  $("palStandard").hidden = wanted && !showEverything;
  if (!wanted) return;
  const p = specPointOf(point);
  $("palPointName").textContent = p ? p.code + " " + p.title : "This lesson";
  list.innerHTML = "";
  if (pointTasksFor !== point){
    $("palPointNote").textContent = "Loading…";
    loadPointTasks(point);
    return;
  }
  $("palPointNote").textContent = pointTasks.length
    ? "Drag one onto the page, or click it."
    : "No tasks written for this part yet.";
  if (!pointTasks.length){
    const make = el("button","btn-ghost bmini2","Write one in the Task builder");
    make.addEventListener("click", () => showBank(true));
    list.appendChild(make);
  }
  bankTopLevel(pointTasks).forEach(t => list.appendChild(bankTaskButton(t)));
  paintAllPalette();
}

/* Everything else in the bank. Off by default: the point's own tasks are
   what this lesson is being built from, and a column of every question the
   department has ever written is not a shortlist. */
function paintAllPalette(){
  const btn = $("palAllBtn");
  if (!btn) return;
  btn.classList.toggle("on", palAll);
  btn.setAttribute("aria-pressed", palAll ? "true" : "false");
  $("palFilterWrap").hidden = !palAll;
  if (!palAll) $("palFilterMenu").hidden = true;
  const box = $("palAllList");
  box.hidden = !palAll;
  if (!palAll) return;
  paintPalFilter();
  const key = palFind.component + "|" + palFind.strand + "|" + palFind.point;
  box.innerHTML = "";
  if (palAllFor !== key){
    box.appendChild(el("p","bhelp","Loading…"));
    loadAllTasks(key);
    return;
  }
  /* The ones already offered above are not offered again, and neither is
     anything sitting inside a group that is offered here: it comes with the
     group. */
  const shown = bankTopLevel(palAllTasks).filter(t => !pointTasks.some(p => p.id === t.id));
  if (!shown.length){
    box.appendChild(el("p","bhelp", palAllTasks.length
      ? "Nothing here beyond the tasks above."
      : "No tasks match that."));
    return;
  }
  if (palAllCapped)
    box.appendChild(el("p","bhelp warn","The first 150. Narrow it down with the funnel."));
  shown.forEach(t => box.appendChild(bankTaskButton(t)));
}
function paintPalFilter(){
  const level = specLevel();
  const fill = (sel, first, options, value) => {
    sel.innerHTML = "";
    const none = document.createElement("option");
    none.value = ""; none.textContent = first;
    sel.appendChild(none);
    options.forEach(o => {
      const opt = document.createElement("option");
      opt.value = String(o[0]); opt.textContent = o[1];
      if (String(value) === String(o[0])) opt.selected = true;
      sel.appendChild(opt);
    });
  };
  fill($("palComponent"), "Every component",
       specComponents(level).map(n => [n, "Component " + n]), palFind.component || "");
  fill($("palStrand"), "Every part",
       specStrands(level, palFind.component).map(s => [s.id, s.code + " " + s.title]), palFind.strand);
  const ps = $("palPointSel");
  fill(ps, palFind.strand ? "Every point in it" : "Pick a part first",
       specPoints(palFind.strand).map(p => [p.id, p.code + " " + p.title]), palFind.point);
  ps.disabled = !palFind.strand;
}
async function loadAllTasks(key){
  if (OFFLINE){ palAllTasks = []; palAllFor = key; paintAllPalette(); return; }
  const API = (window.HUB && window.HUB.API) || "";
  const qs = new URLSearchParams({ full:"1", level: specLevel() });
  if (palFind.component) qs.set("component", String(palFind.component));
  if (palFind.point) qs.set("point", palFind.point);
  else if (palFind.strand) qs.set("strand", palFind.strand);
  try{
    const r = await fetch(API + "/api/teacher/tasks?" + qs.toString(),
                          { headers: window.teacherAuth.headers(), cache:"no-store" });
    if (authFailed(r.status, () => loadAllTasks(key))) return;
    const d = await r.json();
    palAllTasks = readBankTasks(d.tasks);
    palAllCapped = (d.tasks || []).length >= 150;
  }catch(e){ palAllTasks = []; palAllCapped = false; }
  palAllFor = key;
  paintAllPalette();
}
on("palAllBtn", "click", () => {
  palAll = !palAll;
  /* Opened for the first time, it starts where the lesson is rather than
     at the whole specification: the part this lesson belongs to is the
     likeliest place the next task is coming from. */
  if (palAll && palAllFor === null){
    const p = specPointOf(lesson.point || "");
    palFind.component = p ? (Number(p.component) || 0) : 0;
    palFind.strand = p ? (p.parent || p.id) : "";
    palFind.point = "";
  }
  paintAllPalette();
});
on("palFilterBtn", "click", (e) => {
  e.stopPropagation();
  const m = $("palFilterMenu"), btn = $("palFilterBtn");
  if (!m.hidden){ m.hidden = true; return; }
  openFilterMenu(btn, m);
});
document.addEventListener("pointerdown", (e) => {
  const m = $("palFilterMenu"), b = $("palFilterBtn");
  if (!m || m.hidden) return;
  if (e.target === b || (b.contains && b.contains(e.target))) return;
  if (m.contains && m.contains(e.target)) return;
  m.hidden = true;
});
on("palComponent", "change", () => {
  palFind.component = parseInt($("palComponent").value, 10) || 0;
  palFind.strand = ""; palFind.point = "";
  paintAllPalette();
});
on("palStrand", "change", () => {
  palFind.strand = $("palStrand").value;
  palFind.point = "";
  paintAllPalette();
});
on("palPointSel", "change", () => { palFind.point = $("palPointSel").value; paintAllPalette(); });

/* What comes back from the tasks route, with each task's contents read out
   of the JSON it travels as. Anything that will not parse is dropped: a
   button that adds nothing is worse than no button. */
function readBankTasks(rows){
  return (rows || []).map(t => {
    let block = null;
    try{ block = JSON.parse(t.data || "null"); }catch(e){ block = null; }
    return { id:t.id, title:t.title, kind:t.kind, marks:t.marks, point:t.point,
             group_id: t.group_id || "", block: block };
  }).filter(t => t.block && t.block.type);
}
async function loadPointTasks(point){
  if (OFFLINE || !point){ pointTasks = []; pointTasksFor = point; paintPointPalette(); return; }
  const API = (window.HUB && window.HUB.API) || "";
  const p = specPointOf(point);
  const qs = new URLSearchParams({ full:"1", level: specLevel() });
  /* A lesson on 1.1.1 wants what was written for 1.1.1 and what was written
     for the whole of 1.1, because the hub files both under the same part
     and both are about the thing being taught. */
  if (p && p.parent) qs.set("strand", p.parent);
  else qs.set("strand", point);
  try{
    const r = await fetch(API + "/api/teacher/tasks?" + qs.toString(),
                          { headers: window.teacherAuth.headers(), cache:"no-store" });
    if (authFailed(r.status, () => loadPointTasks(point))) return;
    pointTasks = readBankTasks((await r.json()).tasks);
  }catch(e){ pointTasks = []; }
  pointTasksFor = point;
  paintPointPalette();
}
/* Every task the two palette lists are holding, so a group can find what is
   inside it without another trip to the server. Both lists come down with
   each task's contents attached, for exactly this reason. */
function bankKnown(){
  const seen = new Map();
  (pointTasks || []).concat(palAllTasks || []).forEach(t => { if (!seen.has(t.id)) seen.set(t.id, t); });
  return Array.from(seen.values());
}
/* A group, as the one block a lesson holds: the tasks in it, in order, with
   the groups inside it built the same way.

   A lesson still knows nothing about the bank, so what goes in is a copy,
   and every part of it keeps the task it was copied from: that is what gives
   each one the same id in this lesson and in every version of it, which is
   what the coverage screen adds up. */
function bankGroupBlock(t, all, seen){
  seen = seen || new Set();
  if (seen.has(t.id)) return null;            // a group inside itself, somehow
  seen.add(t.id);
  const own = t.block || {};
  const made = { type:"group", title: own.title || t.title || "", task: own.task || "", blocks: [] };
  (all || []).filter(x => (x.group_id || "") === t.id).forEach(x => {
    const kid = (x.kind === "group") ? bankGroupBlock(x, all, seen)
                                     : (x.block ? JSON.parse(JSON.stringify(x.block)) : null);
    if (!kid) return;
    delete kid.folded;
    kid.fromTask = x.id;
    made.blocks.push(kid);
  });
  return made;
}
/* A copy to put in the lesson, remembering which bank task it came from.

   One task, one block. A group is not one block any more: its tasks go
   into the lesson on their own, which bankGroupAdd does, so every caller
   asks what kind it is before it gets here. */
function bankCopy(t){
  if (!t || t.kind === "group" || !t.block) return null;
  const made = JSON.parse(JSON.stringify(t.block));
  delete made.folded;
  made.fromTask = t.id;
  return made;
}

/* ---------- a group of tasks landing in a lesson ----------

   A group keeps several tasks together, so what it means on a page is
   those tasks: dropping one adds them to the page exactly as though they
   had been dragged over one at a time, rather than putting one more box
   around them. A group of groups is more than that, because each group
   inside it is a piece of work in its own right and may well be a page's
   worth, so where those go is asked rather than guessed.

   The group block itself is not kept. Every task inside it still carries
   the fromTask it was copied with, which is what gives it the same id in
   this lesson as in every other version of it, so nothing the coverage
   screen adds up changes. A group built by hand in the lesson builder is
   untouched, and so is every lesson already holding one. */

/* A group taken apart into the runs of tasks it means. A group with no
   groups in it is one run under its own heading. A group of groups is one
   run for each group inside it, however deep they go, and loose tasks
   sitting beside those groups are a run of their own under the outer
   group's name. */
function groupRuns(b, inherited){
  const kids = (b && b.blocks) || [];
  const name = String((b && b.title) || "").trim() || inherited || "";
  const said = String((b && b.task) || "").trim();
  if (!kids.some(k => k && k.type === "group"))
    return kids.length ? [{ title:name, task:said, blocks: kids.slice() }] : [];
  const runs = [];
  let loose = null, named = false;
  kids.forEach(k => {
    if (!k) return;
    if (k.type === "group"){
      loose = null;                     // what follows a group is not part of what came before it
      groupRuns(k, name).forEach(r => runs.push(r));
      return;
    }
    if (!loose){
      /* Only the first of these wears the outer group's name. Tasks either
         side of a group are two runs, and heading both with the same words
         would read as the same thing said twice. */
      loose = { title: named ? "" : name, task: named ? "" : said, blocks: [] };
      named = true;
      runs.push(loose);
    }
    loose.blocks.push(k);
  });
  return runs.filter(r => r.blocks.length);
}
/* The heading that stands at the start of a run when the whole group goes
   on one page. An ordinary paragraph, so the lesson page, the builder and
   the hand-in all already know what to do with it and a teacher can edit
   or delete it like anything else. A group with neither a heading nor a
   subtitle gets nothing: its tasks simply follow one another, which is
   what they did inside the group. */
function runHeading(run){
  if (!run.title && !run.task) return null;
  return { type:"text", heading: run.title || "", html: run.task || "" };
}
/* Where the tasks go when they all land together: the list they were
   dropped on, or, when the group was clicked rather than dragged, wherever
   a task clicked in the palette would have gone. A lesson with no pages
   yet gets one, the same as clicking any other task does. */
function runList(arr){
  if (arr) return arr;
  if (respEditing) return respEditing === "__ext" ? lesson.extensions : lesson.responses[respEditing];
  if (lesson.assessment) return lesson.blocks;
  let page = targetPage();
  if (!page){
    page = BLANK.page();
    page.title = "New page";
    lesson.blocks.push(page);
    openPageRef = page;
  }
  return page.blocks;
}
/* All of it where it was dropped, each run behind its own heading. */
function putRunsHere(runs, arr, at){
  const into = runList(arr);
  if (!into) return;
  const made = [];
  runs.forEach(run => {
    const head = runHeading(run);
    if (head) made.push(head);
    run.blocks.forEach(x => made.push(x));
  });
  if (!made.length) return;
  const where = (at === undefined || at === null || at < 0) ? into.length : at;
  into.splice.apply(into, [where, 0].concat(made));
  /* The first of them opens and the rest fold, the same as adding any one
     task. Eight editors springing open at once is the wall of boxes the
     builder shows one page at a time to avoid. */
  openOnly(into, made[0]);
  viewAll = false;
  lastAddedAt = -1;
  scrollToBlock = made[0];
  render(); schedulePreview();
}
/* One page for each run, after the page being worked on. */
function putRunsOnPages(runs){
  const pages = runs.map(run => {
    const p = BLANK.page();
    p.title = run.title || "Tasks";
    p.task = run.task || "";
    p.blocks = run.blocks;
    p.blocks.forEach(x => { x.folded = true; });
    return p;
  });
  const at = pageIndex();
  lesson.blocks.splice.apply(lesson.blocks,
    [(at < 0 ? lesson.blocks.length : at + 1), 0].concat(pages));
  viewAll = false;
  tellPreview(pages[0]);            // the first of the new ones is the one to look at
  scrollToBlock = pages[0];
  render(); schedulePreview();
}
/* Where several groups' worth of tasks should go. Only a teacher can say:
   one page per group reads as the lesson it was written as, and all of it
   on one page is the right answer when the groups are short. */
function askGroupShape(runs, arr, at){
  const tasks = runs.reduce((n, r) => n + r.blocks.length, 0);
  openModal(box => {
    box.appendChild(el("h2","","Do you want to add these tasks..."));
    box.appendChild(el("p","modal-text",
      "There are " + runs.length + " groups of tasks in here, " + tasks +
      " task" + (tasks === 1 ? "" : "s") + " altogether."));
    const split = el("button","btn-primary modal-cta","On separate pages, one page per group");
    split.addEventListener("click", () => { closeModal(); putRunsOnPages(runs); });
    box.appendChild(split);
    const here = el("button","btn-ghost modal-cta","All on this page");
    here.addEventListener("click", () => { closeModal(); putRunsHere(runs, arr, at); });
    box.appendChild(here);
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(no);
  });
}
/* A group block on its way into the lesson, from wherever it came. */
function addGroupBlock(block, arr, at){
  const runs = groupRuns(block);
  if (!runs.length) return;
  /* Pages only exist in a lesson, and only the top of a page can be
     followed by another page. Inside an extension, a choice, a response
     set or an assessment there is nowhere for a page to go, so there is
     nothing to ask and it all lands where it was dropped. */
  const onPage = !arr || lesson.blocks.some(x => x.type === "page" && x.blocks === arr);
  if (runs.length < 2 || !onPage || respEditing || lesson.assessment){
    putRunsHere(runs, arr, at);
    return;
  }
  askGroupShape(runs, arr, at);
}
/* The same, starting from a row in one of the palette lists. Both lists
   come down with each task's contents attached, so what is in the group is
   already in hand and a drag does not stop for a round trip. */
function bankGroupAdd(t, arr, at){
  const block = bankGroupBlock(t, bankKnown());
  if (!block || !block.blocks.length){
    say("There is nothing in that group yet",
        "Open it on the Task bank tab and put some tasks in it first.");
    return;
  }
  addGroupBlock(block, arr, at);
}
on("palMoreBtn", "click", () => {
  showEverything = !showEverything;
  paintPointPalette();
});


/* ====================================================================
   THE TASK BANK

   A task built once and used in as many lessons as you like. It is a tab
   on this page rather than a page of its own so that the editors are the
   same ones: a task in the bank is drawn by card(), exactly as a task in
   a lesson is, and there is one set of boxes to keep working rather than
   two that drift apart.

   Adding a bank task to a lesson COPIES it. The lesson still saves as one
   blob of JSON that the lesson page reads without knowing the bank
   exists, which is what keeps students, offline mode and the eight
   serverless functions all as they were. What the copy keeps is fromTask,
   the id it came from, and that is what gives it a stable id in the
   compiled lesson.
   ==================================================================== */
/* What can be built here. The whiteboard, the screenshot and the label are
   left out on purpose: they are KS3 tasks and none of them belongs in a
   bank of GCSE and A Level work. */
/* A page of tasks is not offered here. A bank task is one task, and a page
   is the lesson builder's job: it is where the tasks on a page are ordered
   against the page they sit on. card() can still draw one, so a task saved
   as a page before this still opens and still works. */
const BANK_TYPES = [
  ["exam","Exam question","Worth marks, with a mark scheme"],
  ["table","Table","They fill in the blank cells"],
  ["question","Written answer","They type a response"],
  ["short","Short answer","Matched to the answers you set"],
  ["mc","Multiple choice","One right answer"],
  ["quiz","Quiz","Questions with hints"],
  ["blanks","Fill the gaps","Dropdown answers"],
  ["order","Put in order","Drag to sort"],
  ["keywords","Keyword definitions","They write what each word means"],
  ["code","Coding task","Python, or HTML + CSS + JS"],
  ["binary","Binary conversion","Binary to denary and back"],
  ["binadd","Binary addition","Column addition with carries"],
  ["text","Paragraph","Words, with formatting"],
  ["picture","Image","Show a picture from a link"],
  ["embed","Video","Embed a clip"],
  ["notes","Notes","Their own notes, with formatting"]
];

let bankOpen = false;        // the Task bank tab is the one on screen
let bankRoot = null;         // the one task card() is drawing for the task builder
let bankList = [];           // the filtered list, without the tasks themselves
let bankTask = null;         // { id, title, point, component, block } being edited
let bankDirtyAt = 0;         // when it was last typed in, for the autosave
let bankSaveTimer = null;
let bankBusy = false;
let bankFind = { component:0, strand:"", point:"", search:"" };
/* Whether the list has been widened to the whole bank. Off means the
   lesson's own point, which is what a teacher who came in through 1.1.1
   wants to see; on shows everything and brings out the search box and the
   filter button to narrow it again. */
let bankAll = false;

function bankId(){
  return "k" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}
/* The line beside the buttons. `state` is nothing for an ordinary word,
   true for something that went wrong, and "warn" for work that has not
   been saved, which is neither of those: nothing is broken, but a teacher
   about to close the tab needs to see it. */
function bankSay(words, state){
  const e = $("bankSaid");
  if (!e) return;
  e.textContent = words || "";
  e.dataset.bad = state === true ? "yes" : "";
  e.dataset.warn = state === "warn" ? "yes" : "";
}
function showBank(on){
  bankOpen = !!on;
  /* Everything the lesson side owns goes away together, so there is never
     half of one view showing behind the other. */
  const hide = (sel, yes) => document.querySelectorAll(sel).forEach(e => { e.hidden = yes; });
  hide(".build", bankOpen);
  hide(".build-top", bankOpen);
  hide(".modeswitch", bankOpen);
  $("bankView").hidden = !bankOpen;
  if (bankOpen) $("assessTabs").hidden = true;
  else setMode(!!lesson.assessment, !!lesson.practical);
  $("tabBuild").classList.toggle("on", !bankOpen);
  $("tabBank").classList.toggle("on", bankOpen);
  document.documentElement.dataset.bank = bankOpen ? "yes" : "";
  if (bankOpen){
    /* Opened from a lesson that belongs to a point of the specification,
       the builder starts on that point. Coming in from the hub through
       1.1.1 and then having to find 1.1.1 again in three dropdowns is the
       thing this is meant to save. */
    const p = specPointOf(lesson.point || "");
    if (p && bankFind.point !== p.id && !bankTask){
      bankFind.component = Number(p.component) || 0;
      bankFind.strand = p.parent || p.id;
      bankFind.point = p.id;
    }
    /* With no point to start from the list is already the whole bank, so
       there is nothing behind the button and the dropdowns are the only way
       to find anything. */
    if (!p) bankAll = true;
    bankLoad();
  } else {
    /* Coming back to the lesson, the column on the left is out of date: a
       task written and saved while the task builder was open is exactly
       the task somebody now wants to drag onto the page, and it was not
       in the list that was fetched before they went. Thrown away and
       fetched again rather than added to, because tasks can also have
       been renamed, refiled or deleted over there. */
    pointTasksFor = null;
    palAllFor = null;
    paintPointPalette();
    /* Both previews are the same lesson page reading the same key, and only
       one of them is ever on screen. Leaving the task builder therefore has
       to put the lesson back, or the preview beside the lesson is still
       showing the last task that was written. */
    schedulePreview();
  }
  if (typeof paintBuildBar === "function") paintBuildBar();
}
on("tabBuild", "click", () => { if (bankOpen) bankLeave(() => showBank(false)); });
on("tabBank", "click", () => { if (!bankOpen) showBank(true); });

/* Is there something written here that Save has not had? */
function bankUnsaved(){ return !!(bankTask && bankTask.block && bankDirtyAt); }
/* About to leave the task, or the whole screen, with work that has not
   been saved. Nothing writes itself now, so this is the one place that
   stands between a written question and losing it. */
function bankLeave(then){
  if (!bankUnsaved()){ then(); return; }
  openModal(box => {
    box.appendChild(el("h2","","Save this task first?"));
    box.appendChild(el("p","modal-text",
      "“" + (bankTask.title || "This task") + "” has changes that have not been saved. "
      + "Tasks are only saved when you press Save task."));
    const save = el("button","btn-primary modal-cta","Save it");
    save.addEventListener("click", async () => {
      closeModal();
      await bankSaveNow(true);
      then();
    });
    const drop = el("button","btn-ghost modal-cta","Leave it unsaved");
    drop.addEventListener("click", () => {
      closeModal();
      bankDirtyAt = 0;
      then();
    });
    const no = el("button","btn-ghost modal-stay","Stay here");
    no.addEventListener("click", closeModal);
    box.appendChild(save); box.appendChild(drop); box.appendChild(no);
  });
}

/* ---------- the list ---------- */
async function bankLoad(){
  const level = specLevel();
  if (!level){ bankList = []; renderBank(); return; }
  if (OFFLINE){
    /* There is no bank without a server: the tasks live in the database.
       Saying so is better than an empty list that looks like a bank with
       nothing in it. */
    bankList = null;
    renderBank();
    return;
  }
  const API = (window.HUB && window.HUB.API) || "";
  const qs = new URLSearchParams({ level: level });
  if (bankFind.component) qs.set("component", String(bankFind.component));
  if (bankFind.point) qs.set("point", bankFind.point);
  try{
    const r = await fetch(API + "/api/teacher/tasks?" + qs.toString(),
                          { headers: window.teacherAuth.headers(), cache:"no-store" });
    if (authFailed(r.status, bankLoad)) return;
    const d = await r.json();
    bankList = Array.isArray(d.tasks) ? d.tasks : [];
  }catch(e){ bankList = []; }
  renderBank();
}

function bankMatches(t){
  const words = bankFind.search.trim().toLowerCase();
  if (!words) return true;
  return (String(t.title || "") + " " + specLabel(t.point)).toLowerCase().indexOf(words) >= 0;
}
/* Everything under a strand, so picking "1.1 Systems architecture" shows the
   questions filed against the strand itself and against its points. */
function bankUnderStrand(t){
  if (!bankFind.strand) return true;
  if (t.point === bankFind.strand) return true;
  const p = specPointOf(t.point);
  return !!(p && p.parent === bankFind.strand);
}

/* ---------- groups, in the list ----------
   A group is a row in the tasks table like any other, with kind "group",
   and the tasks in it name it in group_id. One group inside another is the
   same column pointing at that one, so the depth costs nothing and there is
   no second table to keep in step.

   None of it opens the task editor. A group is filing, and filing is done in
   the list: made here, named here, filled from here. Whatever the pane
   beside it is showing is left exactly as it was. */
const isGroupRow = (t) => !!t && t.kind === "group";
/* Which groups are folded away. Kept while the tab is open, so shutting one
   and going back to a task does not open it again. */
let bankShut = new Set();

/* The list as the tree it really is.

   Everything matching the filter is in it, and so is every group above
   something that matches: a task must never be hidden because the folder
   holding it did not match the words typed. A task whose group is not in
   the list at all, because the filter asked for one point and the group is
   filed under another, is shown at the top rather than lost. */
function bankTree(){
  const all = bankList || [];
  const byId = new Map(all.map(t => [t.id, t]));
  const keep = new Set();
  const everythingUnder = (id) => all.forEach(x => {
    if (x.group_id !== id || keep.has(x.id)) return;
    keep.add(x.id);
    everythingUnder(x.id);
  });
  all.forEach(t => {
    if (!bankMatches(t) || !bankUnderStrand(t)) return;
    keep.add(t.id);
    /* A group whose name was searched for brings what is in it with it. */
    if (isGroupRow(t)) everythingUnder(t.id);
    let up = byId.get(t.group_id);
    while (up && !keep.has(up.id)){ keep.add(up.id); up = byId.get(up.group_id); }
  });
  const kids = {};
  all.forEach(t => {
    if (!keep.has(t.id)) return;
    const up = keep.has(t.group_id) ? t.group_id : "";
    (kids[up] = kids[up] || []).push(t);
  });
  /* The order a teacher has dragged them into. Everything starts at nought,
     and while two rows are still level the older arrangement decides: groups
     above loose tasks, so the shape of the bank reads before the contents of
     it do, and the server's newest-first within that. A bank nobody has
     dragged anything in therefore looks exactly as it always did. */
  Object.keys(kids).forEach(k => {
    kids[k].sort((a, b) => (Number(a.position) || 0) - (Number(b.position) || 0)
                        || (isGroupRow(b) ? 1 : 0) - (isGroupRow(a) ? 1 : 0));
  });
  return { kids, count: keep.size };
}
/* How many tasks are in a group, counting the ones in the groups inside it.
   That is the number a teacher wants: "4 tasks", not "2 tasks and a group". */
function bankCountIn(id){
  let n = 0;
  (bankList || []).forEach(t => {
    if (t.group_id !== id) return;
    if (isGroupRow(t)) n += bankCountIn(t.id); else n++;
  });
  return n;
}

function renderBank(){
  if (!bankOpen) return;
  const level = specLevel();
  paintBankFilter(level);
  const list = $("bankList");
  wireBankList(list);
  list.innerHTML = "";
  if (bankList === null){
    list.appendChild(el("p","hint","The task bank needs the server. It is not there in offline mode."));
  } else {
    const tree = bankTree();
    if (!tree.count){
      list.appendChild(el("p","hint",
        bankList.length ? "Nothing matches that." : "No tasks yet. Press “+ New task”."));
    }
    bankRows(list, tree, "", 0);
    /* The foot of the list is where something dragged out of a group lands,
       which is the only way back to the top of it. */
    dropOutOfGroups(list);
  }
  paintBankEditor();
}
function bankRows(into, tree, parent, depth){
  (tree.kids[parent] || []).forEach(t => {
    into.appendChild(isGroupRow(t) ? bankGroupRow(t, depth) : bankTaskRow(t, depth));
    if (isGroupRow(t) && !bankShut.has(t.id)) bankRows(into, tree, t.id, depth + 1);
  });
}
function bankTaskRow(t, depth){
  const row = el("div","bank-row" + (bankTask && bankTask.id === t.id ? " on" : ""));
  if (depth) row.style.marginLeft = (depth * 16) + "px";
  const main = el("button","bank-open");
  const code = specPointOf(t.point);
  main.appendChild(el("b","", t.title || "Untitled task"));
  const where = el("span","bank-meta");
  where.appendChild(el("span","bank-kind", LABEL[t.kind] || t.kind || "Task"));
  if (code) where.appendChild(el("span","bank-code", code.code + " " + code.title));
  if (t.marks) where.appendChild(el("span","bank-marks", t.marks + (t.marks === 1 ? " mark" : " marks")));
  main.appendChild(where);
  main.addEventListener("click", () => bankEdit(t.id));
  row.appendChild(main);
  /* Dragging is the quick way and the picker is the sure one. A touch screen
     has no drag, and nor has a teacher working down a list of past paper
     questions with one hand on a trackpad. */
  const mv = el("button","btn-ghost bmini","⇄");
  mv.title = "Put this in a group";
  mv.addEventListener("click", () => bankMovePicker(t));
  row.appendChild(mv);
  const del = el("button","btn-ghost bmini","✕");
  del.title = "Delete this task";
  del.addEventListener("click", () => askDelete("task", () => bankDelete(t.id)));
  row.appendChild(del);
  bankDraggable(row, t);
  return row;
}
function bankGroupRow(g, depth){
  const row = el("div","bank-row bank-group");
  if (depth) row.style.marginLeft = (depth * 16) + "px";
  /* Two lines, not one. There is more to do with a folder than with a task,
     and five small buttons beside the name in a 300px column left the name
     eighty pixels to wrap in: "Binary conversion practice" came out one word
     to a line. The name gets the first line to itself. */
  const top = el("div","bg-top");
  const acts = el("div","bg-acts");
  row.appendChild(top); row.appendChild(acts);
  const shut = bankShut.has(g.id);
  const fold = el("button","btn-ghost bmini foldbtn", shut ? "▸" : "▾");
  fold.title = shut ? "Open this group" : "Fold this group away";
  top.appendChild(fold);
  const main = el("button","bank-open");
  main.appendChild(el("b","", g.title || "Untitled group"));
  const where = el("span","bank-meta");
  const n = bankCountIn(g.id);
  where.appendChild(el("span","bank-kind","Group"));

     already, and the wording of a point runs to several words: on a row this
     narrow it took two more lines for something the rows underneath repeat. */
  main.appendChild(where);
  /* Pressing a group opens and shuts it and does nothing else. It is a
     folder, not a task, so the editor beside it is not disturbed. */
  const toggle = () => {
    if (bankShut.has(g.id)) bankShut.delete(g.id); else bankShut.add(g.id);
    renderBank();
  };

  fold.addEventListener("click", (e) => { e.stopPropagation(); toggle(); });
  top.appendChild(main);
  const add = el("button","btn-ghost bmini2","+ Task");

  pen.title = "Rename this group";

  del.title = "Delete this group";
  del.addEventListener("click", () => askDeleteGroup(g));
  acts.appendChild(del);
  bankDraggable(row, g);
  return row;
}
/* Whatever is being dragged about the list, so the row under the pointer
   knows whether it may take it. */
let bankDragging = null;
function bankDraggable(row, t){
  row.draggable = true;
  /* The list works out where a drop lands from the rows themselves, so each
     one has to be able to say which task it is drawing. */
  row.__task = t;
  row.addEventListener("dragstart", (e) => {
    bankDragging = t;
    row.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id); }
  });
  row.addEventListener("dragend", () => {
    row.classList.remove("dragging"); bankDragging = null;
    document.querySelectorAll("#bankList .over").forEach(x => x.classList.remove("over"));
  });
}
/* ---------- one drop target for the whole list ----------
   Every row used to take its own drop, and a group row took the only one
   that did anything. Measured in a browser, that left a dead band seven or
   eight pixels deep between every pair of rows, where the pointer is over
   the list and nothing else: letting go there threw the drop away without a
   word, and it is most of the width of the gap a teacher is aiming at when
   they mean "between these two". Every task row was dead the same way.

   So the list takes the drop and works out from the pointer which row was
   meant. There are no gaps in it to fall down. */
let bankListWired = false;
function wireBankList(list){
  if (bankListWired) return;
  bankListWired = true;
  const rows = () => Array.from(list.querySelectorAll(".bank-row"));
  const lit = (row) => {
    list.querySelectorAll(".bank-row.over").forEach(x => { if (x !== row) x.classList.remove("over"); });
    if (row) row.classList.add("over");
  };
  /* A group can take something inside it, unless it is the thing being
     dragged or somewhere under it: a group made its own parent draws itself
     until the tab gives up. */
  const holds = (row) => {
    const t = row.__task;
    return !!t && isGroupRow(t) && bankDragging
        && t.id !== bankDragging.id && !bankHoldsRow(t.id, bankDragging.id);
  };
  list.addEventListener("dragover", (e) => {
    if (!bankDragging) return;
    const all = rows();
    if (!all.length) return;
    e.preventDefault();
    const hit = window.dragLine.mark(list, all, e, { into: holds });
    lit(hit.into);
  });
  list.addEventListener("dragleave", (e) => {
    if (!window.dragLine.left(list, e)) return;
    window.dragLine.hide(); lit(null);
  });
  list.addEventListener("drop", (e) => {
    e.preventDefault();
    window.dragLine.hide(); lit(null);
    const moved = bankDragging;
    if (!moved) return;
    const all = rows();
    const hit = window.dragLine.mark(list, all, e, { into: holds });
    window.dragLine.hide();
    if (hit.into){ bankFile(moved, hit.into.__task.id); return; }
    /* The line is drawn above a row, so that row is the one it joins: same
       group, same place in it. Past the end of the list there is no row
       above to follow, so the last one stands in, and the strip underneath
       is there for anybody who meant the top of the list instead. */
    const below = all[hit.slot] || all[all.length - 1];
    const beside = below && below.__task;
    if (!beside || beside.id === moved.id) return;
    bankPlace(moved, beside.group_id || "", all[hit.slot] ? beside.id : null);
  });
}
/* Is `id` somewhere inside the group `top`? Dropping a group onto its own
   insides would make it its own parent, and the list would then draw itself
   until the tab gave up. */
function bankHoldsRow(id, top){
  const all = bankList || [];
  let up = all.find(t => t.id === id);
  const seen = new Set();
  while (up && !seen.has(up.id)){
    if (up.id === top) return true;
    seen.add(up.id);
    up = all.find(t => t.id === up.group_id);
  }
  return false;
}
function dropOutOfGroups(list){
  const out = el("div","bank-outzone","Drag a task here to take it out of its group");
  out.addEventListener("dragover", (e) => {
    if (!bankDragging || !bankDragging.group_id) return;
    /* The list behind this takes every drop that reaches it and draws a line
       in the nearest gap. Over this strip there is no gap being aimed at, so
       the list is not told about it. */
    e.preventDefault(); e.stopPropagation();
    window.dragLine.hide();
    out.classList.add("over");
  });
  out.addEventListener("dragleave", (e) => {
    if (window.dragLine.left(out, e)) out.classList.remove("over");
  });
  out.addEventListener("drop", (e) => {
    e.preventDefault(); e.stopPropagation();
    out.classList.remove("over");
    window.dragLine.hide();
    if (bankDragging) bankFile(bankDragging, "");
  });
  list.appendChild(out);
}

/* Filing one row under another, for the button and for the drag.

   The row is fetched whole first and its contents are written back exactly as
   they came. The list carries a title and a kind and nothing else, so saving
   from what the list is holding would write an empty task over a real one:
   the first go at this did, and it quietly emptied the line a group shows
   under its heading in a lesson. */
function bankFile(row, into){
  return bankPlace(row, into, null);
}
/* The order rows are in at one level of the bank, which is the order the
   list draws them in. */
function bankKin(all, into){
  return all.filter(t => (t.group_id || "") === (into || ""))
            .sort((a, b) => (Number(a.position) || 0) - (Number(b.position) || 0)
                          || (isGroupRow(b) ? 1 : 0) - (isGroupRow(a) ? 1 : 0));
}
/* Put `row` in group `into`, above `beforeId` or at the end of it.

   It sends the whole of that group's contents in the order they should be
   in, rather than one row's new place. Written a row at a time, two of them
   end up claiming the same slot the moment a save is lost; written as a
   list, the worst that can happen is that the list stays as it was. The
   hub's tiles are reordered the same way for the same reason.

   It also used to take two round trips. Filing a row meant fetching the
   whole task back first, because saving from what the list holds would have
   written an empty task over a real one. Nothing about the task itself is
   touched here, so neither of those is needed and the wait is halved. */
async function bankPlace(row, into, beforeId){
  if (!row) return;
  into = into || "";
  if (into === row.id || (into && bankHoldsRow(into, row.id))) return;   // never inside itself
  const all = bankList || [];
  const now = bankKin(all, into).map(t => t.id);
  const kin = bankKin(all, into).filter(t => t.id !== row.id);
  let at = beforeId ? kin.findIndex(t => t.id === beforeId) : -1;
  if (at < 0) at = kin.length;
  kin.splice(at, 0, row);
  const ids = kin.map(t => t.id);
  /* It is already there, in that place. Saying so to the server would be a
     wait and a redraw for nothing. */
  if ((row.group_id || "") === into && now.join("|") === ids.join("|")) return;

  const wasGroup = row.group_id || "";
  const wasAt = new Map(kin.map(t => [t, t.position]));
  row.group_id = into;
  kin.forEach((t, i) => { t.position = i; });
  renderBank();                                        // instantly, before anything is sent

  const API = (window.HUB && window.HUB.API) || "";
  try{
    const r = await fetch(API + "/api/teacher/tasks", { method:"POST",
      headers: window.teacherAuth.json(),
      body: JSON.stringify({ op:"reorder", groupId: into, ids: ids }) });
    if (authFailed(r.status, () => bankPlace(row, into, beforeId))) return;
    if (!r.ok) throw new Error((await r.json()).error || "Could not move that.");
    pointTasksFor = null; palAllFor = null;
  }catch(e){
    row.group_id = wasGroup;                           // put it back where it was
    kin.forEach(t => { t.position = wasAt.get(t); });
    bankSay(e.message || "Could not move that.", true);
    renderBank();
  }
}
/* Which group to put something in, for a screen with no drag. */
function bankMovePicker(row){
  openModal(box => {
    box.appendChild(el("h2","","Where does this go?"));
    box.appendChild(el("p","modal-text",
      "\u201c" + (row.title || "This") + "\u201d is in "
      + (bankNameOf(row.group_id) || "no group") + "."));
    const list = el("div","bankpick");
    const offer = (id, words, depth) => {
      const b = el("button","bankpick-row");
      b.appendChild(el("b","", words));
      if (depth) b.style.paddingLeft = (14 + depth * 16) + "px";
      b.disabled = (row.group_id || "") === (id || "");
      b.addEventListener("click", () => { closeModal(); bankFile(row, id); });
      list.appendChild(b);
    };
    offer("", "The top of the list", 0);
    const walk = (parent, depth) => {
      (bankList || []).filter(t => isGroupRow(t) && (t.group_id || "") === parent).forEach(g => {
        /* A group cannot go inside itself or inside anything it holds. */
        if (g.id !== row.id && !bankHoldsRow(g.id, row.id)) offer(g.id, g.title || "Untitled group", depth + 1);
        walk(g.id, depth + 1);
      });
    };
    walk("", 0);
    box.appendChild(list);
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(no);
  });
}
function bankNameOf(id){
  const g = (bankList || []).find(t => t.id === id);
  return g ? "\u201c" + (g.title || "a group") + "\u201d" : "";
}
async function bankEdit(id){
  if (bankTask && bankTask.id === id) return;
  if (bankUnsaved()){ bankLeave(() => bankEdit(id)); return; }
  const API = (window.HUB && window.HUB.API) || "";
  bankSay("Opening…");
  try{
    const r = await fetch(API + "/api/teacher/tasks?id=" + encodeURIComponent(id),
                          { headers: window.teacherAuth.headers(), cache:"no-store" });
    if (authFailed(r.status, () => bankEdit(id))) return;
    const d = await r.json();
    let block = null;
    try{ block = JSON.parse(d.task.data); }catch(e){ block = null; }
    if (!block || !block.type) throw new Error("That task could not be read.");
    /* Folding belongs to getting about a long lesson. There is one task on
       screen here, so it is always open. */
    delete block.folded;
    bankTask = { id: d.task.id, title: d.task.title || "", point: d.task.point || "",
                 component: Number(d.task.component) || 0,
                 groupId: d.task.group_id || "", block: block };
    bankSay("");
  }catch(e){
    bankSay(e.message || "Could not open that task.", true);
    return;
  }
  renderBank();
}
async function bankDelete(id){
  const API = (window.HUB && window.HUB.API) || "";
  try{
    const r = await fetch(API + "/api/teacher/tasks", { method:"POST",
      headers: window.teacherAuth.json(), body: JSON.stringify({ op:"delete", id }) });
    if (authFailed(r.status, () => bankDelete(id))) return;
    if (!r.ok) throw new Error((await r.json()).error || "Could not delete that.");
    if (bankTask && bankTask.id === id) bankTask = null;
    pointTasksFor = null; palAllFor = null;   // the lesson's column has them too
    /* Lessons already holding a copy keep it, which is worth saying once
       rather than leaving a teacher to wonder. */
    bankSay("Deleted. Lessons using it keep their copy.");
    bankLoad();
  }catch(e){ bankSay(e.message, true); }
}

  const head = el("div","bank-headrow");
  const nameWrap = el("div","bfield grow");
  nameWrap.appendChild(el("label","","What this task is called"));
  const name = el("input");
  name.placeholder = "Fetch-execute cycle, 4 marks";
  name.value = bankTask.title || "";
  name.addEventListener("input", () => { bankTask.title = name.value; bankTouch(); });
  nameWrap.appendChild(name);
  head.appendChild(nameWrap);
  const save = el("button","btn-primary","Save task");
  save.addEventListener("click", () => bankSaveNow(false));
  head.appendChild(save);
  pane.appendChild(head);

  /* Where it is filed. An exam question carries this on the block itself,
     because a student is shown the number beside the question, and its own
     editor already has the picker. Everything else is filed here. */
  if (bankTask.block.type !== "exam"){
    specPicker(pane, bankTask, () => {
      bankTask.point = bankTask.point || "";
      bankTouch();
    });
  }

  /* viewAll is the lesson's "show me every page at once", which folds every
     task away. A page of tasks in the builder is the only thing on screen,
     so it is drawn open whatever the lesson behind it is set to. */
  const wasAll = viewAll;
  bankRoot = bankTask.block;
  viewAll = false;
  try{
    pane.appendChild(card(bankTask.block, 0, [bankTask.block]));
  } finally {
    bankRoot = null;
    viewAll = wasAll;
  }
  /* Debounced, not immediate: this runs again on every button pressed
     anywhere in the editor, and reloading the frame each time would leave a
     teacher watching it flicker. */
  scheduleBankPreview();
}

/* Typed in. Saved two and a half seconds after they stop, the way the
   lesson saves itself, so a teacher moving down a list of past paper
   questions never has to think about it. */
/* Typed in. A task is NOT saved on a timer: a lesson is a thing you leave
   half written and come back to, and saving it as you go is right, but a
   bank task is written, looked at in the preview and then either kept or
   thrown away. Saving every few seconds filled the bank with half-written
   questions and with the ones somebody changed their mind about. Save task
   is the only thing that writes one. */
function bankTouch(){
  bankDirtyAt = Date.now();
  bankSay("Not saved yet", "warn");
  scheduleBankPreview();
}

/* ---------- the preview ----------
   A task on its own is not something the lesson page can open, so it is
   wrapped in the smallest lesson that will hold it: one page, one task.
   Everything else is the lesson builder's preview exactly, including the
   localStorage key, because only one of the two is ever on screen. */
let bankPrevTimer = null;
function scheduleBankPreview(){
  clearTimeout(bankPrevTimer);
  $("bankPrevMsg").textContent = "updating…";
  bankPrevTimer = setTimeout(refreshBankPreview, 700);
}
function bankPreviewLesson(){
  const blocks = [];
  idsUsed = new Set();
  try{ compileOne(bankTask.block, "preview1", blocks); }
  finally{ idsUsed = null; }
  /* A page compiles to a page, and anything else wants one putting round
     it, because a lesson is made of pages and the page is what draws the
     task bar and the Continue button a student would see. */
  const page = (blocks[0] && blocks[0].type === "page")
    ? blocks[0]
    : { type:"page", id:"preview1", title: bankTask.title || "", task:"",
        startLocked:false, blocks: blocks };
  page.startLocked = false;
  return { title: bankTask.title || "Task preview", blocks: [page] };
}
function refreshBankPreview(){
  const frame = $("bankPrev");
  if (!frame) return;
  if (!bankTask || !bankTask.block){
    frame.removeAttribute("src");
    $("bankPrevMsg").textContent = "";
    return;

    try{ sessionStorage.removeItem("hub_preview_step"); }catch(e){}

    $("bankPrevMsg").textContent = "up to date";
  }catch(e){ $("bankPrevMsg").textContent = e.message; }
}

async function bankSaveNow(quiet){
  clearTimeout(bankSaveTimer);
  if (!bankTask || !bankTask.block) return;
  if (!bankDirtyAt && !bankTask.fresh) { if (!quiet) bankSay("Nothing to save."); return; }
  /* Still exactly the blank it was made from, and with no name on it, is
     not a task yet. Picking a kind and then changing your mind used to
     leave an empty "Exam question" in the list for somebody else to tidy
     away. */
  if (bankTask.fresh && !String(bankTask.title || "").trim()
      && bankTask.blank === JSON.stringify(bankTask.block)){
    if (!quiet) bankSay("Give it a name, or write the question first.");
    return;
  }
  if (bankBusy) return;
  const level = specLevel();
  if (!level){ bankSay("Pick a GCSE or A Level year group first.", true); return; }
  bankBusy = true;
  const block = bankTask.block;
  const src = block.type === "exam" ? block : bankTask;
  const payload = {
    op: "save",
    id: bankTask.id,
    title: bankTask.title || LABEL[block.type] || "Untitled task",
    level: level,
    component: Number(src.component) || 0,
    point: src.point || "",
    kind: block.type,
    marks: block.type === "exam" ? (parseInt(block.marks, 10) || 0) : 0,
    /* Which group of the bank it is filed in. Written on every save, not only
       when it changes, so a task moved and then edited does not go back to
       the top of the list the next time it is saved. */
    groupId: bankTask.groupId || "",
    data: JSON.stringify(block)
  };
  const API = (window.HUB && window.HUB.API) || "";
  try{
    const r = await fetch(API + "/api/teacher/tasks", { method:"POST",
      headers: window.teacherAuth.json(), body: JSON.stringify(payload) });
    if (authFailed(r.status, () => bankSaveNow(quiet))){ bankBusy = false; return; }
    if (!r.ok) throw new Error((await r.json()).error || "Could not save that task.");
    bankDirtyAt = 0;
    bankTask.fresh = false;
    bankSay("Saved ✓");
    bankBusy = false;
    /* The lesson's left column holds its own copy of the tasks for its
       point. A task just written is one of those, so it is thrown away
       here and fetched again rather than turning up only after a reload. */
    pointTasksFor = null; palAllFor = null;
    await bankLoad();
  }catch(e){
    bankBusy = false;
    bankSay(e.message || "Could not save that task.", true);
  }
}

/* ---------- taking one into a lesson ----------

    }

    const draw = () => {

      list.innerHTML = "";

          const inside = t.kind === "group" ? bankGroupSize(t, tasks) : 0;
          const meta = [t.kind === "group" ? "Group" : (LABEL[t.kind] || t.kind),
                        t.kind === "group" ? inside + " task" + (inside === 1 ? "" : "s") : "",
                        specLabel(t.point),

          b.appendChild(el("span","", meta.join("  ·  ")));

async function bankInsert(id){
  const API = (window.HUB && window.HUB.API) || "";
  try{
    const r = await fetch(API + "/api/teacher/tasks?id=" + encodeURIComponent(id),
                          { headers: window.teacherAuth.headers(), cache:"no-store" });
    if (authFailed(r.status, () => bankInsert(id))) return;
    const d = await r.json();
    let block;
    if (d.task && d.task.kind === "group"){
      /* A group is a row that names its contents rather than holding them,
         so what goes in the lesson is built from the tasks filed under it.
         Fetched with their contents, which the plain list leaves out. */
      const all = await fetch(API + "/api/teacher/tasks?full=1&level="
                              + encodeURIComponent(specLevel()),
                              { headers: window.teacherAuth.headers(), cache:"no-store" })
                        .then(x => x.json()).catch(() => ({}));
      const rows = readBankTasks(all.tasks);
      const me = rows.find(x => x.id === id)
              || { id: id, title: d.task.title, kind:"group", group_id: d.task.group_id || "",
                   block: JSON.parse(d.task.data || "{}") };
      block = bankGroupBlock(me, rows);
      if (!block || !block.blocks.length)
        throw new Error("There is nothing in that group yet.");
    } else {
      block = JSON.parse(d.task.data);
    }
    if (!block || !block.type) throw new Error("That task could not be read.");
    delete block.folded;
    /* The one kind that cannot go in a test. Its mark scheme is something a
       student ticks off themselves, which in an assessment would be the
       answers on screen while they sat it. A group holding one is turned
       away for the same reason: the rule is about what reaches the screen,
       not about what the block at the top is called. */
    if (lesson.assessment && holdsExam(block)){
      say("Not in an assessment",
          "An exam question is marked by the student against its scheme, so it would show them "
          + "the answers during the test. Put it in a lesson instead, or use a short answer or a "
          + "multiple choice question here.");
      return;
    }
    /* A group is not one block to add: it is the tasks in it, and each of
       those already remembers the bank task it was copied from. An
       assessment can take them too, now that they go in as questions of
       their own. What it could not take was the group itself, which would
       have put questions inside one of its numbered ones with nowhere for
       the marks to go. */
    if (block.type === "group"){ addGroupBlock(block, null, -1); return; }
    /* The copy remembers where it came from. That is what gives it a stable
       id when the lesson is compiled, so the same question in a lesson and
       in three versions of it lines up in the coverage screen. */
    block.fromTask = d.task.id;
    addBlock(block);
  }catch(e){
    say("Could not add that task", e.message || "Try again in a moment.");
  }
}
/* An exam question, at any depth. A group can hold groups, so this has to
   look all the way down rather than at the block it is given. */
function holdsExam(b){
  if (!b) return false;
  if (b.type === "exam") return true;
  const lists = (b.type === "choice") ? (b.options || []).map(o => o.blocks || [])
                                      : [b.blocks || []];
  return lists.some(list => list.some(holdsExam));
}

function refreshPreview(){
  try{
    if (previewReset){ try{ sessionStorage.removeItem("hub_preview_step"); }catch(e){} previewReset = false; }
    localStorage.setItem("hub_preview", JSON.stringify(compile()));
    const frame = $("prev");
    /* Where the preview had been scrolled to. It is reloaded from scratch on
       every change, so without this a teacher editing the foot of a long page
       was thrown back to the top of it after each keystroke. */
    const keep = previewScroll(frame);
    frame.src = "lesson.html?id=__preview&builder=1&t=" + Date.now();
    frame.addEventListener("load", function once(){
      frame.removeEventListener("load", once);
      /* The lesson draws itself after load, so the place to scroll to does not
         exist yet on the first go. Trying again shortly after catches it. */
      putPreviewScroll(frame, keep);
      setTimeout(() => putPreviewScroll(frame, keep), 120);
      setTimeout(() => putPreviewScroll(frame, keep), 400);
    });
    $("prevMsg").textContent = "up to date";
  }catch(e){ $("prevMsg").textContent = e.message; }
}

/* The lesson scrolls inside .stage on a wide screen and scrolls the page
   itself on a narrow one, so both are worth remembering. */
function previewScroll(frame){
  try{
    const d = frame.contentDocument;
    if (!d) return null;
    const stage = d.querySelector(".stage");
    return { stage: stage ? stage.scrollTop : 0,
             page: frame.contentWindow ? frame.contentWindow.scrollY : 0 };
  }catch(e){ return null; }         // a preview from another origin cannot be read
}
function putPreviewScroll(frame, keep){
  if (!keep || (!keep.stage && !keep.page)) return;
  try{
    const d = frame.contentDocument;
    if (!d) return;
    const stage = d.querySelector(".stage");
    if (stage && keep.stage) stage.scrollTop = keep.stage;
    if (keep.page && frame.contentWindow) frame.contentWindow.scrollTo(0, keep.page);
  }catch(e){}
}

/* Puts everything except the cross and the final buttons into a part that
   scrolls on its own. */
function scrollBody(box){
  if (box.querySelector(".modal-scroll")) return;

  const middle = kids.filter(n =>
    !n.classList.contains("modal-x") &&
    !n.classList.contains("modal-cta") &&
    !n.classList.contains("modal-stay"));
  if (middle.length < 2) return;
  const scroller = el("div","modal-scroll");
  const first = middle[0];
  box.insertBefore(scroller, first);
  middle.forEach(n => scroller.appendChild(n));
}

/* ====================================================================
   PICTURES

   A picture a lesson shows goes into the database and is handed out by
   the API. site/ is a public repository served by GitHub Pages, so a
   picture put in there is published to the open web, and most of what a
   KS4 lesson shows comes off a past paper or a textbook: a school may
   copy that for its own pupils, not publish it.

   Shrunk here rather than on the server, because the browser has a
   canvas and a serverless function has not. 1400px is enough for a
   screenshot of an exam question to stay readable on a laptop, and a
   diagram the department drew can still go in site/images and be given
   as an address, where it costs nothing to serve.
   ==================================================================== */
const PIC_MAX_SIDE = 1400;
const PIC_TARGET = 700000;          // base64 length the server will take

/* A File or a data URL in, a small JPEG data URL out. PNG is kept for
   anything with transparency in it, because a logo laid over white
   stops being a logo. */
function shrinkPicture(source, cb){
  const probe = new Image();
  probe.onload = () => {
    let w = probe.naturalWidth, h = probe.naturalHeight;
    if (!w || !h){ cb(null, "That picture could not be read."); return; }
    const scale = Math.min(1, PIC_MAX_SIDE / Math.max(w, h));
    w = Math.round(w * scale); h = Math.round(h * scale);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.drawImage(probe, 0, 0, w, h);
    let out = "", mime = "image/jpeg";
    /* Quality comes down in steps rather than being guessed at once: a
       photograph and a screenshot of text compress nothing like each
       other, and the only honest way to hit a size is to look. */
    const steps = [0.85, 0.72, 0.6, 0.45, 0.3];
    for (let i = 0; i < steps.length; i++){
      out = c.toDataURL("image/jpeg", steps[i]);
      if (out.length <= PIC_TARGET) break;
    }
    if (out.length > PIC_TARGET){ cb(null, "That picture is too big even squeezed. Crop it and try again."); return; }
    cb({ data: out, mime: mime, width: w, height: h }, null);
  };
  probe.onerror = () => cb(null, "That file is not a picture this can read.");
  if (typeof source === "string") probe.src = source;
  else {
    const reader = new FileReader();
    reader.onerror = () => cb(null, "That file could not be read.");
    reader.onload = () => { probe.src = String(reader.result); };
    reader.readAsDataURL(source);
  }
}

/* Shrink it, send it, and come back with the id to point at. */
function uploadPicture(source, alt, cb){
  if (OFFLINE){ cb(null, "Pictures are uploaded to the database, and there is no server in offline mode. Use an address instead."); return; }
  shrinkPicture(source, async (made, why) => {
    if (!made){ cb(null, why); return; }
    const API = (window.HUB && window.HUB.API) || "";
    try{
      const r = await fetch(API + "/api/teacher/upload-image", { method:"POST",
        headers: window.teacherAuth.json(),
        body: JSON.stringify({ data: made.data, mime: made.mime,
                               width: made.width, height: made.height, alt: alt || "" }) });
      if (authFailed(r.status, () => uploadPicture(source, alt, cb))) return;
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "That picture could not be saved.");
      cb({ id: d.id, width: made.width, height: made.height }, null);
    }catch(e){ cb(null, e.message || "That picture could not be saved."); }
  });
}
/* What a formatting box calls when a picture is pasted into it. Hands
   back the id to keep and an address to show it at right now. */
function pasteUpload(file, cb){
  uploadPicture(file, "", (made, why) => {
    if (!made){ cb(null, why); return; }
    cb({ id: made.id, width: made.width, height: made.height,
         src: pictureSrc({ imgId: made.id }) }, null);
  });
}
/* Where the builder shows one, which is the same address the lesson page
   will use. */
function pictureSrc(b){
  if (b && b.imgId) return ((window.HUB && window.HUB.API) || "") + "/api/catalog?image=" + encodeURIComponent(b.imgId);
  return (b && b.url) || "";
}

/* ====================================================================
   IMPORTING FROM A FILE

   A lesson, a page, or tasks for the bank, out of a JSON file. The shape
   is the one the JSON button writes, because the obvious way to get one
   of these files is to export it from somewhere else.

   Read forgivingly. These files are written by hand as often as they are
   exported, so a bare block, a list of blocks and a wrapper object all
   mean the same thing here. Anything the builder does not recognise is
   dropped and counted rather than let through: a task type nothing can
   draw is a lesson that breaks in front of a class.

   Nothing imported saves itself, with one exception. A lesson and a page
   land in the builder for the teacher to look at and then Save; tasks have
   nowhere to land but the bank, so those are written, and the count says
   how many.
   ==================================================================== */
const KNOWN_TYPES = Object.keys(LABEL);

function readJsonFile(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("That file could not be read."));
    r.onload = () => {
      try{ resolve(JSON.parse(String(r.result))); }
      catch(e){ reject(new Error("That file is not valid JSON. It may have been cut off, or be missing a bracket.")); }
    };
    r.readAsText(file);
  });
}

/* A pop-up with a file picker and a box to paste into, because a school
   laptop's file picker is not always the easy way and half of these will
   arrive as text in a message. */
function importPopup(opts){
  openModal(box => {
    const x = el("button","btn-ghost iconbtn modal-x","✕");
    x.addEventListener("click", closeModal); box.appendChild(x);
    box.appendChild(el("h2","", opts.title));
    box.appendChild(el("p","modal-text", opts.help));
    const msg = el("p","hint","");

    const pick = el("button","btn-ghost modal-cta","Choose a file");
    const file = el("input","sb-picker");
    file.type = "file";
    file.accept = "application/json,.json";
    pick.addEventListener("click", () => file.click());
    file.addEventListener("change", async () => {

      msg.textContent = "Reading…";
      try{
