        await opts.take(data, msg);
      }catch(e){ msg.textContent = e.message; }
      file.value = "";
    });
    box.appendChild(pick);
    box.appendChild(file);

    const w = el("div","bfield");
    w.appendChild(el("label","","Or paste it here"));
    const area = el("textarea");
    area.rows = 7; area.className = "mono";
    area.placeholder = opts.example || "{ }";
    w.appendChild(area);
    box.appendChild(w);
    const go = el("button","btn-primary modal-cta","Import");
    go.addEventListener("click", async () => {
      const text = area.value.trim();
      if (!text){ msg.textContent = "Paste the file's contents in, or choose a file."; return; }
      let data;
      try{ data = JSON.parse(text); }
      catch(e){ msg.textContent = "That is not valid JSON. It may have been cut off, or be missing a bracket."; return; }
      msg.textContent = "Reading…";
      try{ await opts.take(data, msg); }
      catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go);
    box.appendChild(msg);
    scrollBody(box);
  });
}

/* Whatever shape it arrived in, as a list of blocks the builder can edit.
   fromCompiled does the converting, so an imported lesson is read exactly
   the way a saved one is and there is one set of rules for both. */
function blocksFromImport(data){
  let raw = null;
  if (Array.isArray(data)) raw = data;
  /* type comes first. A page has a type AND a blocks list, so asking about
     blocks first threw the page itself away and imported its contents as
     loose tasks. A lesson has a blocks list and no type of its own, which
     is what keeps these two apart. */
  else if (data && data.type) raw = [data];
  else if (data && data.page) raw = [data.page];
  else if (data && Array.isArray(data.blocks)) raw = data.blocks;
  if (!raw) throw new Error("There is nothing in there that looks like a task or a page.");
  const dropped = [];
  /* All the way down, not just the top. A page holds tasks and a choice
     holds a set of them for each option, and one unknown type anywhere in
     there is a task the lesson page cannot draw in front of a class. */
  const clean = (list) => (list || []).filter(b => {
    const ok = b && typeof b === "object" && KNOWN_TYPES.indexOf(b.type) >= 0;
    if (!ok){ dropped.push(b && b.type ? b.type : "something with no type"); return false; }
    if (Array.isArray(b.blocks)) b.blocks = clean(b.blocks);
    if (Array.isArray(b.options)) b.options.forEach(o => { if (o) o.blocks = clean(o.blocks); });
    return true;
  });
  const keep = clean(raw.slice());
  if (!keep.length) throw new Error("None of those are tasks this builder knows how to make.");
  return { blocks: fromCompiled({ blocks: keep }, {}).blocks, dropped: dropped };
}
function saidDropped(dropped){
  if (!dropped.length) return "";
  const names = dropped.filter((d, i) => dropped.indexOf(d) === i).join(", ");
  return " " + dropped.length + (dropped.length === 1 ? " thing was" : " things were")
       + " left out, because nothing here can make " + names + ".";
}

/* ---------- a whole lesson ---------- */
function importLessonFile(){
  const start = () => importPopup({
    title: "Import a lesson",
    help: "A lesson file, the kind the JSON button writes. It opens here for you to "
        + "look at and then save, so nothing on the site changes until you press Save.",
    example: '{ "title": "The CPU", "year": "Year 10", "unit": "1.1 Systems architecture",\n  "blocks": [ { "type": "page", "title": "Starter", "blocks": [] } ] }',
    take: async (data) => {
      if (!data || typeof data !== "object" || Array.isArray(data))
        throw new Error("A lesson file is one object with a title and a list of blocks in it.");
      if (!Array.isArray(data.blocks))
        throw new Error("That file has no blocks in it, so it is not a lesson.");
      const check = blocksFromImport(data);          // throws if there is nothing usable
      const made = fromCompiled(data, {});
      made.blocks = check.blocks;
      lesson = made;
      /* lesson.savedAs is what Save writes over. Cleared, so an imported
         lesson is saved as a new one rather than on top of whatever was
         open when it came in. */
      lesson.savedAs = null;
      lesson.code = "";
      openPageRef = null; viewAll = false;
      pointTasksFor = null; palAllFor = null;
      tidyIntoPages();
      startFolded();
      showTitle(); paintPickers();
      setMode(!!lesson.assessment, !!lesson.practical);
      render(); schedulePreview();
      dirty = true;
      closeModal();
      say("Lesson imported", "“" + (lesson.title || "Untitled lesson") + "” is open here."
          + saidDropped(check.dropped)
          + " Nothing is on the site until you press Save.");
    }
  });
  if (!lesson.blocks.length && !lesson.title.trim()){ start(); return; }
  /* Whatever is on screen is about to be replaced. */
  openModal(box => {
    box.appendChild(el("h2","","Replace what is open?"));
    box.appendChild(el("p","modal-text",
      "Importing a lesson puts it in place of “" + (lesson.title || "the lesson") + "”. "
      + "Anything here that has not been saved goes with it."));
    const yes = el("button","btn-primary modal-cta","Import anyway");
    yes.addEventListener("click", () => { closeModal(); start(); });
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
}

/* ---------- one page ---------- */
function importPageFile(){
  importPopup({
    title: "Import a page",
    help: "A page, or just a list of tasks, which is added to the end of this lesson. "
        + "A list of tasks with no page round it gets one.",
    example: '{ "type": "page", "title": "Memory", "blocks": [\n  { "type": "text", "html": "<p>RAM is volatile.</p>" }\n] }',
    take: async (data) => {
      const got = blocksFromImport(data);
      /* One page arrives as a page. Anything else is tasks, and tasks go on
         a page, because that is what a lesson is made of. */
      const onlyPage = got.blocks.length === 1 && got.blocks[0].type === "page";
      const page = onlyPage ? got.blocks[0]
                            : Object.assign(BLANK.page(), { title:"Imported page", blocks: got.blocks });
      if (lesson.assessment && !lesson.practical){
        /* An assessment has no pages, so what comes in is its questions. */
        (onlyPage ? page.blocks : got.blocks).forEach(b => lesson.blocks.push(b));
      } else {
        lesson.blocks.push(page);
        openPageRef = page; viewAll = false;
        tellPreview(page);
      }
      dirty = true;
      render(); schedulePreview();
      closeModal();
      say("Page imported",
          (onlyPage ? "“" + (page.title || "Untitled page") + "”" : got.blocks.length + " tasks")
          + " added to the end of this lesson." + saidDropped(got.dropped)
          + " Press Save when you are happy with it.");
    }
  });
}

/* ---------- tasks, into the bank ----------
   These have nowhere to sit but the bank, so they are written to it. Each
   one needs a level, and that comes from the year group, so the lesson has
   to be a GCSE or A Level one before this means anything. */
function importTasksFile(){
  const level = specLevel();
  if (!level){
    say("Pick a year group first", "The task bank belongs to a GCSE or A Level year group.");
    return;
  }
  if (OFFLINE){
    say("The bank needs the server", "Tasks are kept in the database, so there is no bank in offline mode.");
    return;
  }
  importPopup({
    title: "Import tasks",
    help: "One task, a list of tasks, or a file with a tasks list in it. Anything that "
        + "does not say where it goes is filed where the list is pointing now. They are "
        + "saved to the bank straight away.",
    example: '{ "tasks": [\n  { "title": "Fetch-execute", "point": "j277-1.1.1",\n    "task": { "type": "exam", "prompt": "Describe the cycle.", "marks": 4 } }\n] }',
    take: async (data, msg) => {
      const wanted = tasksFromImport(data);
      if (!wanted.length) throw new Error("There are no tasks in there.");
      msg.textContent = "Saving " + wanted.length + "…";
      let saved = 0, failed = 0;
      for (const t of wanted){
        try{ await saveImportedTask(t, level); saved++; }
        catch(e){ failed++; }
      }
      pointTasksFor = null; palAllFor = null;
      await bankLoad();
      closeModal();
      say(saved + (saved === 1 ? " task imported" : " tasks imported"),
          failed ? failed + " could not be saved. The rest are in the bank."
                 : "They are in the bank and ready to use.");
    }
  });
}
/* The several shapes a task file comes in, as one list. A task can be a
   bare block, or a block wrapped in something saying what it is called and
   where it is filed. */
function tasksFromImport(data){
  let raw = null;
  if (Array.isArray(data)) raw = data;
  else if (data && Array.isArray(data.tasks)) raw = data.tasks;
  else if (data && data.type) raw = [data];
  if (!raw) throw new Error("There is nothing in there that looks like a task.");
  const out = [];
  raw.forEach(row => {
    if (!row || typeof row !== "object") return;
    /* The block itself, wherever it is hiding in this row. */
    let block = row.type ? row : (row.task || row.data || row.block || null);
    if (typeof block === "string"){ try{ block = JSON.parse(block); }catch(e){ block = null; } }
    if (!block || KNOWN_TYPES.indexOf(block.type) < 0) return;
    const ready = fromCompiled({ blocks: [block] }, {}).blocks[0];
    if (!ready) return;
    out.push({
      title: String(row.title || block.title || plainWords(block.prompt) || LABEL[block.type] || "Untitled task").slice(0, 200),
      point: String(row.point || block.point || bankFind.point || bankFind.strand || "").trim(),
      component: parseInt(row.component || block.component, 10) || 0,
      marks: Math.max(0, parseInt(row.marks !== undefined ? row.marks : block.marks, 10) || 0),
      block: ready
    });
  });
  return out;
}
async function saveImportedTask(t, level){
  const API = (window.HUB && window.HUB.API) || "";
  const p = specPointOf(t.point);
  const block = t.block;
  /* An exam question is shown its number and the part it belongs to, and
     the lesson page cannot look those up, so they travel on the task. */
  if (block.type === "exam" && p){
    block.point = p.id; block.code = p.code;
    block.strand = p.parent ? ((specPointOf(p.parent) || {}).title || "") : p.title;
    if (!block.component) block.component = Number(p.component) || 0;
  }
  const r = await fetch(API + "/api/teacher/tasks", { method:"POST",
    headers: window.teacherAuth.json(),
    body: JSON.stringify({ op:"save", id: bankId(), title: t.title, level: level,
                           component: t.component || (p ? Number(p.component) || 0 : 0),
                           point: p ? p.id : "", kind: block.type,
                           marks: block.type === "exam" ? (parseInt(block.marks, 10) || 0) : t.marks,
                           data: JSON.stringify(block) }) });
  if (!r.ok) throw new Error((await r.json()).error || "Could not save that task.");
}
on("importLesson", "click", () => { $("moreMenu").hidden = true; importLessonFile(); });
on("importPage", "click", () => { $("moreMenu").hidden = true; importPageFile(); });
on("bankImport", "click", importTasksFile);

/* ---------- publishing straight to the site ----------
   The lesson goes into the school database through the teacher API, so there
   are no files to upload. It arrives as a draft; publishing to classes still
   happens in the teacher console. */
/* The sign-in itself is in teacher.js, shared with the work viewer. It used
   to be a box here that wrote whatever was typed straight into localStorage:
   a wrong key was then remembered for good, the pop-up never came back, and
   every save after it failed with nothing a teacher could do about it. */
function signedIn(){ return window.teacherAuth.have(); }
function askForKey(then, why){
  openModal(box => window.teacherAuth.form(box, { close: closeModal, then: then, why: why }));
}
/* What a refused teacher request means: throw the session away and ask again,
   so a second go is a second go rather than the same failure for ever. */
function authFailed(status, retry){
  if (!window.teacherAuth.rejected(status)) return false;
  window.teacherAuth.forget();
  askForKey(retry, "That sign-in was not accepted. Try again.");
  return true;
}
function lessonId(){
  /* A lesson keeps the name it was saved under. Renaming it changes the
     title, not which lesson it is, otherwise editing would quietly leave a
     copy of the old one behind, still sitting in whichever classes had it. */
  if (lesson.savedAs) return lesson.savedAs;
  if (lesson.versionOf) return newVersionId();
  return (lesson.title || "lesson").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
}
/* A version is saved as a lesson of its own, so it needs an id the original
   is not already using. Built from both names rather than from the title,
   because a version usually keeps the title it was made from and an id off
   the title alone would overwrite the very lesson it came from. */
function newVersionId(){
  const base = ((lesson.versionOf || "lesson") + "-" + (lesson.versionName || "version"))
                 .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
  const taken = new Set(((cat && cat.lessons) || []).map(l => l.lesson_id || l.id));
  if (!taken.has(base)) return base;
  for (let n = 2; n < 60; n++) if (!taken.has(base + "-" + n)) return base + "-" + n;
  return (base + "-" + Date.now().toString(36).slice(-4)).slice(0, 60);
}
/* The title of the lesson this one is a version of, for the pop-ups that
   name it. Falls back to its id, which is at least something to recognise. */
function parentTitle(){
  const id = lesson.versionOf;
  if (!id) return "";
  const hit = ((cat && cat.lessons) || []).find(l => (l.lesson_id || l.id) === id);
  return (hit && hit.title) || id;
}
/* Save the lesson as a file for the lessons folder, with what to do next.
   Two things go into GitHub: the lesson file itself, and a line in
   lessons/index.json that files it under a year and unit and gives it the
   four digit code students type when a link has not reached them. */
async function downloadForFolder(){
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){
    say("Which year group?", "The hub files lessons by year, so every lesson needs one.");
    return;
  }
  if (!lesson.unit || !lesson.unit.trim()){
    if (specLevel())
      say("Which point of the specification?",
          "Choose one at the top. The sub-point beside it is optional: leave it on “The whole of” "
          + "for a lesson that covers all of it.");
    else
      say("Which unit?", "Choose a unit at the top, or make a new one. Units sit inside a year group.");
    return;
  }
  /* A locked page with no passcode can never be opened by anybody, so the
     lesson would be unteachable past that point. */
  const missing = pagesMissingPasscode();
  if (missing.length){
    say(missing.length === 1 ? "Page " + missing[0] + " has no passcode"
                             : "Some pages have no passcode",
        (missing.length === 1
          ? "Page " + missing[0] + " is locked"
          : "Pages " + missing.join(", ") + " are locked") +
        ", and a locked page can only be opened by typing its passcode. " +
        "Press the red pill beside the padlock to set one.");
    return;
  }
  const id = lessonId();
  /* An existing lesson keeps the code it was given: it is on a worksheet,
     in somebody's planner, and written on the board. Only a new one gets
     a fresh one, chosen so nothing else in the folder is using it. */
  let code = lesson.code || "";
  let known = { lessons: [] };
  try{ known = await window.lessonFile.load(true); }catch(e){}
  if (!code) code = window.lessonFile.codeFor(known, id) || window.lessonFile.newCode(known);
  lesson.code = code;

  const built = compile();
  const blob = new Blob([JSON.stringify(built, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = id + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  dirty = false;

  const listed = (known.lessons || []).some(l => l.id === id);
  const unitExists = (known.units || []).some(u => u.name === lesson.unit && (u.year || "") === lesson.year);
  /* The lesson's line on its own is no use if there is no unit for it to sit
     in, so a brand new unit comes out whole, ready to drop in beside the
     others. */
  const entry = Object.assign(
    { id: id, title: lesson.title, description: lesson.intro || "" },
    (lesson.assessment || lesson.practical) ? { assessment: true } : {},
    lesson.homework ? { homework: true } : {},
    lesson.versionOf ? { versionOf: lesson.versionOf, versionName: lesson.versionName || "",
                         versionNote: lesson.versionNote || "", versionCode: lesson.versionCode || "" } : {},
    { code: code });
  const paste = unitExists ? entry
    : { name: lesson.unit, year: lesson.year, lessons: [entry] };

  openModal(box => {
    box.appendChild(el("h2","","Saved as " + id + ".json"));
    box.appendChild(el("p","modal-text", listed
      ? "It is already listed in lessons/index.json, so there is one thing left to do:"
      : "To put it on the site:"));
    const list = el("ol","modal-steps");
    const steps = ["Put " + id + ".json into the lessons folder in GitHub, replacing the old one if it is there."];
    if (!listed){
      steps.push(unitExists
        ? "Open lessons/index.json and add this to the lessons of “" + lesson.unit + "”:"
        : "Open lessons/index.json. There is no “" + lesson.unit + "” yet, so add this whole unit to the list:");
    }
    steps.push("Commit. The lesson is on the site within a minute or so.");
    steps.forEach(t => list.appendChild(el("li","", t)));
    box.appendChild(list);

    if (!listed){
      const snippet = el("pre","codeblock");
      snippet.textContent = JSON.stringify(paste, null, 2);
      box.appendChild(snippet);
      const copy = el("button","btn-ghost","Copy that");
      copy.addEventListener("click", async () => {
        try{ await navigator.clipboard.writeText(snippet.textContent); copy.textContent = "Copied ✓"; }
        catch(e){ copy.textContent = "Select it and press Ctrl+C"; }
      });
      box.appendChild(copy);
    }

    box.appendChild(el("p","set-label","How the class gets in"));
    box.appendChild(el("p","modal-text","Give them this link:"));
    box.appendChild(el("pre","codeblock", window.lessonFile.linkFor(id)));
    box.appendChild(el("p","modal-text","Or, from the front page, this code:"));
    box.appendChild(el("p","sharecode", code));

    /* Only the hashes go into the file, so this is the last chance to write
       the passcodes down. */
    const gates = [];
    lesson.blocks.forEach((blk, i) => {
      if (blk.type === "page" && i > 0 && blk.startLocked !== false && blk.passCode)
        gates.push("Page " + (i + 1) + ": " + blk.passCode);
    });
    if (gates.length){
      box.appendChild(el("p","set-label","Passcodes for the locked pages"));
      box.appendChild(el("p","modal-text","Write these down, they are not stored in the lesson file."));
      box.appendChild(el("pre","codeblock", gates.join("\n")));
    }

    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", closeModal);
    box.appendChild(done);
  });
}

async function saveToSite(){
  const API = (window.HUB && window.HUB.API) || "";
  /* Offline there is nowhere to save to, so the lesson is downloaded instead
     and dropped into the lessons folder on GitHub. */
  if (OFFLINE){ await downloadForFolder(); return; }
  if (!API){ say("Not connected", "This copy of the site has no server address in config.js, so it can't save lessons."); return; }
  if (!lesson.title.trim()){ say("Give it a title first", "The title becomes the lesson's name on the site."); return; }
  if (!lesson.year || !lesson.year.trim()){ say("Which year group?", "Choose a year group at the top, or make a new one."); return; }
  if (!lesson.unit || !lesson.unit.trim()){
    if (specLevel())
      say("Which point of the specification?",
          "Choose one at the top. The sub-point beside it is optional: leave it on “The whole of” "
          + "for a lesson that covers all of it.");
    else
      say("Which unit?", "Choose a unit at the top, or make a new one.");
    return;
  }
  if (!signedIn()){ askForKey(saveToSite, "Sign in to save this lesson to the site."); return; }
  const btn = $("saveSite");
  btn.disabled = true; btn.textContent = "Saving\u2026";
  try{
    const r = await fetch(API + "/api/teacher/save-lesson", {
      method:"POST",
      headers: window.teacherAuth.json(),
      body: JSON.stringify({ id: lessonId(), title: lesson.title, unit: lesson.unit,
                             year: lesson.year || "", data: compile() })
    });
    const d = await r.json().catch(() => ({}));
    if (authFailed(r.status, saveToSite)){ btn.disabled = false; btn.textContent = "Save to the site"; return; }
    if (!r.ok) throw new Error(d.error || "Could not save it.");
    lesson.savedAs = d.id;
    dirty = false;                       // saved, and nothing changed since
    if (lesson.versionOf){
      say("Saved as a version", "It is under \u201C" + parentTitle() + "\u201D in the lesson hub, behind the "
          + "Versions button. Give it to a class from your teacher console.");
    } else {
      say(d.published ? "Saved, it's live" : "Saved to the site",
          d.published
            ? "Students in classes that already have this lesson will see the new version straight away."
            : "It's in your teacher console under " + lesson.unit + ". Press Publish there when a class should see it.");
    }
  }catch(e){ say("Could not save", e.message); }
  finally{ btn.disabled = false; btn.textContent = "Save to the site"; }
}
on("saveSite", "click", () => {
  /* On a narrow screen Save is a button in the corner rather than a wide
     one that says where it is sending the lesson, so it confirms first. */
  if (isCompact()) savePopup(); else saveToSite();
});

/* deleting from here asks twice too, it is the same job as in the console */

on("delLesson", "click", () => {
  $("moreMenu").hidden = true;
  const API = (window.HUB && window.HUB.API) || "";
  const id = lesson.savedAs;
  if (!id) return;
  openModal(box => {
    box.appendChild(el("h2","","Delete \u201c" + (lesson.title || id) + "\u201d?"));
    box.appendChild(el("p","modal-text","It goes from the hub and from every class, together with all the work students have done on it."));
    const yes = el("button","btn-primary modal-cta","Continue");
    yes.style.background = "var(--red)";
    yes.addEventListener("click", () => {
      closeModal();
      openModal(popup => {
        popup.appendChild(el("h2","","Really delete it?"));
        popup.appendChild(el("p","modal-text","This cannot be undone. Type DELETE to confirm."));
        const w = el("div","bfield");
        const inp = el("input"); w.appendChild(inp); popup.appendChild(w);
        const msg = el("p","hint","");
        const go = el("button","btn-primary modal-cta","Delete for ever");
        go.style.background = "var(--red)";
        go.addEventListener("click", async () => {
          if (inp.value.trim().toUpperCase() !== "DELETE"){ msg.textContent = "Type DELETE to confirm."; return; }
          msg.textContent = "Deleting\u2026";
          try{
            const r = await fetch(API + "/api/teacher/delete-lesson", { method:"POST",
              headers: window.teacherAuth.json(),
              body: JSON.stringify({ id }) });
            if (!r.ok) throw new Error((await r.json()).error || "Could not delete it.");
            closeModal();
            lesson = { title:"", intro:"", unit:"", assessment:false, topics:{}, blocks:[] };
            dirty = false;
            showTitle(); paintPickers();
            $("delLesson").hidden = true;
            render(); refreshPreview();
            say("Deleted", "The lesson has been removed from the site.");
          }catch(e){ msg.textContent = e.message; }
        });
        const no = el("button","btn-ghost modal-stay","Keep it");
        no.addEventListener("click", closeModal);
        popup.appendChild(go); popup.appendChild(no); popup.appendChild(msg);
      });
    });
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(yes); box.appendChild(no);
  });
});

/* offer the units that already exist, and load a lesson if asked to edit one */
async function loadUnitsAndYears(){
  const API = (window.HUB && window.HUB.API) || "";
  /* Without a server the years and units on offer are simply the ones
     already written into lessons/index.json. */
  if (OFFLINE){
    try{
      const file = await window.lessonFile.load(true);
      const years = [];
      file.units.forEach(u => { if (u.year && years.indexOf(u.year) < 0) years.push(u.year); });
      file.lessons.forEach(l => { if (l.year && years.indexOf(l.year) < 0) years.push(l.year); });
      cat = { years: years.map(name => ({ name })), units: file.units.filter(u => u.name),
              lessons: file.lessons.map(l => ({ lesson_id: l.id, title: l.title, unit: l.unit,
                                                version_of: l.versionOf || "" })) };
    }catch(e){ cat = { years: [], units: [], lessons: [] }; }
    paintPickers();
    return;
  }
  if (!API) return;
  try{
    const r = await fetch(API + "/api/catalog", { headers: window.teacherAuth.headers(), cache:"no-store" });
    cat = await r.json();
  }catch(e){}
  paintPickers();
}

/* Editing without a server means reading the lesson's own file back out of
   the lessons folder. It carries its title, year and unit, so the only
   thing that has to come from the index is the code, which lives there. */
async function loadLessonFromFolder(editId){
  try{
    await loadStep("Fetching the lesson");
    const r = await fetch("lessons/" + encodeURIComponent(editId) + ".json", { cache:"no-store" });
    if (!r.ok) throw new Error("There is no lessons/" + editId + ".json.");
    const data = await r.json();
    await loadStep("Checking where it is filed");
    let known = {};
    try{
      const file = await window.lessonFile.load();
      known = file.lessons.find(l => l.id === editId) || {};
    }catch(e){}
    lesson = fromCompiled(data, { title: known.title, unit: known.unit });
    if (!lesson.year && known.year) lesson.year = known.year;
    lesson.savedAs = editId;
    lesson.code = known.code || "";
    await loadStep("Populating the lesson content");
    migrate(lesson.blocks); tidyIntoPages(); startFolded();
    dirty = false;
    showTitle();
    paintPickers();
    setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
    await loadStep("Laying out the pages");
    render();
    await loadStep("Almost there");
    refreshPreview();
  }catch(e){ hideLoader(true); say("Could not open that lesson", e.message); }
}

async function loadUnitsAndMaybeLesson(){
  const API = (window.HUB && window.HUB.API) || "";
  const editId = new URLSearchParams(location.search).get("edit");
  /* Coming back from the sign-in box calls this again from the top, so the
     screen has to come back with it. On a new lesson there is nothing to
     wait for and showLoader is never called at all. */
  if (editId) await showLoader("Opening the lesson");
  if (!API && !OFFLINE){ hideLoader(true); return; }
  await loadStep("Checking the year groups and units");
  await loadUnitsAndYears();
  const qs2 = new URLSearchParams(location.search);
  const wantYear = qs2.get("year"), wantUnit = qs2.get("unit"), wantPoint = qs2.get("point");
  if (wantYear && !lesson.year) lesson.year = wantYear;
  if (wantUnit && !lesson.unit) lesson.unit = wantUnit;
  /* Started from a point of the specification in the hub. It decides what
     the left column offers and where the task builder opens, so it is the
     whole reason for coming in that way. */
  if (wantPoint && !lesson.point) lesson.point = wantPoint;
  if (wantYear || wantUnit || wantPoint) paintPickers();
  if (!editId){ hideLoader(true); return; }
  /* The console offers "a new version" beside Edit, and sends the builder here
     with the lesson to start from and this on the address. Asked for once the
     lesson is on the screen, not before, so what is about to be copied is
     there to look at while the name and what has changed are being written. */
  const askVersion = qs2.get("version") === "new";
  const given = { name: (qs2.get("vname") || "").trim(),
                  note: (qs2.get("vnote") || "").trim(),
                  code: (qs2.get("vcode") || "").trim() };
  if (OFFLINE){
    await loadLessonFromFolder(editId);
    hideLoader();
    if (askVersion && lesson.savedAs) startVersion(given);
    return;
  }
  if (!signedIn()){
    hideLoader(true);         // the pop-up asking for the key is underneath it
    askForKey(loadUnitsAndMaybeLesson, "Sign in to open this lesson.");
    return;
  }
  try{
    await loadStep("Fetching the lesson");
    const r = await fetch(API + "/api/teacher/get-lesson?id=" + encodeURIComponent(editId),
                          { headers: window.teacherAuth.headers(), cache:"no-store" });
    const d = await r.json().catch(() => ({}));
    if (authFailed(r.status, loadUnitsAndMaybeLesson)){ hideLoader(true); return; }
    if (!r.ok) throw new Error(d.error || "Could not open that lesson.");
    await loadStep("Reading the lesson");
    const data = JSON.parse(d.lesson.data);
    lesson = fromCompiled(data, d.lesson);
    lesson.savedAs = editId;
    await loadStep("Populating the lesson content");
    migrate(lesson.blocks); tidyIntoPages(); startFolded();
    dirty = false;
    $("delLesson").hidden = false;
    
    showTitle(); 
    paintPickers();
    setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
    await loadStep("Laying out the pages");
    render();
    await loadStep("Almost there");
    refreshPreview();
    hideLoader();
    if (askVersion) startVersion(given);
  }catch(e){ hideLoader(true); say("Could not open that lesson", e.message); }
}

/* turn a saved lesson file back into editable cards */
function fromCompiled(data, meta){
  const out = { title: data.title || (meta && meta.title) || "", intro: data.intro || "",
                unit: data.unit || (meta && meta.unit) || "", year: data.year || "",
                /* The sub-point it was filed under, so reopening a lesson
                   finds both pickers where they were left. */
                subunit: data.subunit || "",
                /* Where it sits on the specification. Left out here, reopening
                   a GCSE lesson lost its point: the left column went back to
                   the plain palette and the task builder stopped knowing what
                   the lesson was about. */
                point: data.point || "",
                assessment: !!data.assessment && !data.practical, practical: !!data.practical,
                homework: !!data.homework,
                linger: data.linger !== false,
                versionOf: data.versionOf || "", versionName: data.versionName || "",
                versionNote: data.versionNote || "", versionCode: data.versionCode || "",
                marking: data.marking || "score", outOf: data.outOf || 20, rubric: data.rubric || [],
                topics: data.topics || {}, responses: {}, extensions: [], blocks: [] };
  /* Two things belong to every task whatever kind it is, and every branch
     below that builds a fresh object was dropping both.

     fromTask says which bank task a copy came from, and it is what gives
     that task a stable id when the lesson is compiled. Lost on reopening, a
     short answer or a quiz out of the bank went back to an id made from its
     position, and every answer already saved against the old id was
     orphaned the next time the lesson was saved.

     required is the teacher's "this one can be skipped".

     gate is how much of the task opens the rest of its page, and it had
     to be added here for the same reason: a branch below that builds a
     fresh object would drop it without a word. */
  const back = (b) => {
    const made = backOne(b);
    if (made && b && b.fromTask) made.fromTask = b.fromTask;
    if (made && b && b.required === false) made.required = false;
    if (made && b && ["attempted","partial","full"].includes(b.gate)) made.gate = b.gate;
    return made;
  };
  const backOne = (b) => {
    /* startLocked and passHash used to be dropped here, so reopening a lesson
       quietly unlocked every page in it. */
    if (b.type === "page") return { type:"page", title:b.title || "", task:b.task || "",
                                    startLocked: b.startLocked !== false,
                                    extension: b.extension === true,
                                    taskbar: b.taskbar !== false,
                                    passHash: b.passHash || undefined,
                                    blocks:(b.blocks || []).map(back) };
    if (b.type === "extension") return { type:"extension", title:b.title || "",
                                         task:b.task || "",
                                         blocks:(b.blocks || []).map(back) };
    if (b.type === "group") return { type:"group", title:b.title || "",
                                     task:b.task || "",
                                     blocks:(b.blocks || []).map(back) };
    if (b.type === "choice") return { type:"choice", title:b.title || "", task:b.task || "",
                                      prompt:b.prompt || "",
                                      options:(b.options || []).map(o => ({
                                        label:o.label || "",
                                        blocks:(o.blocks || []).map(back) })) };
    if (b.type === "text"){
      const h = /<h2[^>]*>([\s\S]*?)<\/h2>/i.exec(b.html || "");
      /* The HTML is kept exactly as it was saved.

         This used to flatten it to plain text for the textarea the paragraph
         editor once used: list items became a literal "- ", every closing
         paragraph became a blank line, and every other tag was thrown away.
         The editor has been a formatting box for a while now, so reopening a
         lesson was quietly destroying its bold, colours, sizes, keys and code,
         turning bullets into dashes and leaving a gap between every line where
         those blank lines had been. */
      return { type:"text",
               heading: b.heading !== undefined ? b.heading
                      : (h ? h[1].replace(/<[^>]+>/g,"") : ""),
               html: String(b.html || "").replace(/<h2[\s\S]*?<\/h2>/i, "") };
    }
    if (b.type === "quiz") return { type:"quiz",
      title: b.title || "",
      pass: b.pass ? { mode: b.pass.mode || "percent", value: b.pass.value || 70,
                       hold: b.pass.hold === true }
                   : { mode:"none", value:70 },
      questions:(b.questions || []).map(q => ({
        q:q.q || "", options:q.options || ["",""],
        answers: q.answers !== undefined ? q.answers.slice() : [q.answer || 0],
        answer:q.answer || 0, hint:q.hint || "", why:q.why || "" })) };
    /* A question written before short answers were matched rather than
       scanned for keywords. Every keyword becomes an answer in its own right,
       which is a starting point and not the same rule, so the editor says so
       and the teacher can put it right before saving. */
    if (b.type === "short"){
      const converted = window.shortAnswer.legacy(b);
      const answers = converted
        ? b.keywords.reduce((all, g) => all.concat(g), []).map(x => String(x).trim()).filter(Boolean)
        : window.shortAnswer.accepted(b);
      return { type:"short", prompt:b.prompt || "", answers: answers.length ? answers : [""],
               wasKeywords: converted, model:b.model || "", topic:b.topic || "" };
    }
    if (b.type === "blanks") return { type:"blanks", prompt:b.prompt || "", text:b.text || "",
      distractors:(b.distractors || []).join(", "), topic:b.topic || "" };
    /* A saved cipher holds only the coded text and a hash, never the message.
       Trying all 25 shifts and hashing each one finds the shift the teacher
       used, and with it the message, so it can be edited like anything else.
       If nothing matches (a hand-written lesson file), the fields are left
       empty rather than filled with a wrong guess. */
    if (b.type === "caesar"){
      let message = "", shift = 7;
      for (let k = 1; k <= 25; k++){
        const tryText = caesarEncode(b.ciphertext || "", -k);
        if (strHash(normLetters(tryText)) === b.answerHash){ message = tryText; shift = k; break; }
      }
      return { type:"caesar", title:b.title || "", task:b.task || "",
               prompt:b.prompt || "", message: message, shift: shift };
    }
    const copy = JSON.parse(JSON.stringify(b));
    delete copy.id;
    return copy;
  };
  out.blocks = (data.blocks || []).map(back);
  Object.keys(data.responses || {}).forEach(topic => {
    out.responses[topic] = (data.responses[topic] || []).map(back);
  });
  out.extensions = (data.extensions || []).map(back);
  return out;
}


/* =====================================================================
   THE BUILDER ON A TABLET OR A PHONE

   The three columns of the desktop builder do not survive being squeezed:
   a palette, a list of cards and a live preview side by side leave nothing
   wide enough to write in. Below a laptop width the same pieces are put
   back together as one column instead.

     - the kind of work moves into the top bar as a chip with a pencil
     - the title, description, year and unit move into the Save pop-up
     - Save and the three dot menu move up beside the settings cog
     - the palette goes entirely: tasks are added from the containers
       under each page, which is where a teacher is already looking
     - one row underneath holds New page, the assessment tabs, and the
       preview switch

   Nothing here is duplicated. The same elements are moved about, so there
   is only ever one Save button and one year picker to keep in step.
   ===================================================================== */
/* A browser without matchMedia gets the wide builder and nothing breaks;
   the checking scripts run the page without one too. */
function mq(query){
  if (typeof window.matchMedia === "function") return window.matchMedia(query);
  return { matches:false, addEventListener(){}, addListener(){} };
}
/* Made when first asked for, not when this line is reached: render() runs
   from setMode() during start-up and asks whether the page is narrow before
   the bottom of the file has been read. */
let COMPACT_Q = null, ROOMY_Q = null;
function compactQ(){ return COMPACT_Q || (COMPACT_Q = mq("(max-width: 1100px)")); }
/* Room enough to keep a preview on screen while still writing: an iPad Pro
   in either direction, but not a phone. */
function roomyQ(){ return ROOMY_Q || (ROOMY_Q = mq("(min-width: 700px) and (min-height: 820px)")); }

let compactOn = null;          // null until the first pass, then true or false
let previewFull = false;       // the preview has taken over the screen
let modeChosen = false;        // they have said what kind of work this is

function isCompact(){ return compactQ().matches; }
function isRoomy(){ return roomyQ().matches; }

/* The pieces that move, remembered where they started so they can go back. */
const homeSlot = document.querySelector(".homebar");
const topSlot = document.querySelector(".build-top");

function applyBuildLayout(){
  const compact = isCompact();
  if (compact === compactOn) { paintBuildBar(); return; }
  compactOn = compact;
  document.documentElement.dataset.build = compact ? "compact" : "wide";

  const actions = document.querySelector(".build-actions");
  const titles = document.querySelector(".build-titles");
  /* Nothing to move about if the page never got built, which is how the
     checking scripts run it. */
  if (!actions || !titles || !homeSlot || !topSlot){ paintBuildBar(); return; }
  /* The top row is display:none below 1100px, so the one button on it that a
     teacher still needs moves into the bar rather than being duplicated. */
  const options = $("optionsBtn");
  if (compact){
    /* Save and the menu sit beside the cog; Lesson options joins the bar. */
    homeSlot.appendChild(actions);
    if (options) $("buildBarScroll").appendChild(options);
    $("buildBar").hidden = false;
    $("modeChip").hidden = false;
    $("saveSite").textContent = "Save";
  } else {
    if (options) titles.insertBefore(options, titles.firstChild);
    topSlot.appendChild(titles);
    topSlot.appendChild(actions);
    $("buildBar").hidden = true;
    $("modeChip").hidden = true;
    $("saveSite").textContent = "Save to the site";
    stopPreviewing();
  }
  paintBuildBar();
  fitPreview();
}

/* What belongs on the one row of controls, which depends on the kind of
   work: an assessment has no pages to add, a practical has both. */
function paintBuildBar(){
  if (!isCompact()) return;
  const scroll = $("buildBarScroll");
  if (!scroll || !$("assessTabs") || !$("modeChipName")) return;
  const assess = !!lesson.assessment;
  const practical = !!lesson.practical;
  /* The tab strip is moved in beside New page rather than copied, so the
     three buttons keep working exactly as they do on a desktop. */
  const tabs = $("assessTabs");
  if ((assess || practical) && !bankOpen){
    tabs.hidden = false;
    if (tabs.parentNode !== scroll) scroll.appendChild(tabs);
  } else {
    tabs.hidden = true;
  }
  /* The chip says what kind of work this is, and on the bank there is no
     kind: it is not part of the lesson at all. */
  const chip = $("modeChip");
  if (chip) chip.hidden = bankOpen;
  $("modeChipName").textContent = practical ? "Practical assessment"
    : assess ? "Assessment"
    : lesson.homework ? "Home learning" : "Lesson";
}

/* ---------- which kind of work ---------- */
function modePicker(force){
  openModal(box => {
    box.appendChild(el("h2","","What are you making?"));
    const list = el("div","modepick");
    [["Lesson", () => { lesson.homework = false; setMode(false, false); }],
     ["Assessment", () => setMode(true, false)],
     ["Practical assessment", () => { lesson.homework = false; setMode(false, true); }],
     ["Home learning", () => { lesson.homework = true; setMode(false, false); }]
    ].forEach(pair => {
      const b = el("button","modepick-item", pair[0]);
      b.addEventListener("click", () => {
        pair[1]();
        modeChosen = true;
        closeModal();
        paintBuildBar();
      });
      list.appendChild(b);
    });
    box.appendChild(list);
    if (!force){
      const no = el("button","btn-ghost modal-stay","Cancel");
      no.addEventListener("click", closeModal);
      box.appendChild(no);
    }
  });
}
on("modeChip", "click", () => modePicker(false));

/* ---------- the Save pop-up ----------
   A last look before it goes to the class. The title, year and unit it used
   to ask for live in Lesson options now, which is reachable in both layouts,
   so this only has to confirm and say what is about to be saved. */
function savePopup(){
  openModal(box => {
    box.appendChild(el("h2","","Save this lesson"));
    box.appendChild(el("p","modal-text",
      (lesson.title || "Untitled lesson")
      + (lesson.unit ? " · " + lesson.unit : "")));
    const go = el("button","btn-primary modal-cta","Save to the site");
    go.addEventListener("click", () => { closeModal(); saveToSite(); });
    box.appendChild(go);
    const later = el("button","btn-ghost modal-stay","Not yet");
    later.addEventListener("click", closeModal);
    box.appendChild(later);
  });
}

/* ---------- the live preview ---------- */
function stopPreviewing(){
  previewFull = false;
  document.documentElement.dataset.preview = "";
  const t = $("prevToggle");
  if (t) t.textContent = "Preview";
}
on("prevToggle", "click", () => {
  previewFull = !previewFull;
  document.documentElement.dataset.preview = previewFull ? "full" : "";
  $("prevToggle").textContent = previewFull ? "Back to editing" : "Preview";
  /* The bar's real height, so the preview starts underneath it however many
     buttons the bar happens to be carrying. */
  const bar = $("buildBar");
  if (bar) document.documentElement.style.setProperty("--buildbar-h",
             Math.round(bar.getBoundingClientRect().height) + "px");
  if (previewFull) refreshPreview();
  fitPreview();
});

/* On a roomy screen the preview sits along the bottom at the shape of a real
   lesson rather than a squashed one: the frame is laid out at a proper size
   and then scaled down, so text inside it stays in proportion. */
function fitPreview(){
  const frame = $("prev");
  const box = document.querySelector(".build-preview");
  if (!frame || !box) return;
  const roomy = isCompact() && isRoomy() && !previewFull;
  if (!roomy){
    frame.style.removeProperty("width");
    frame.style.removeProperty("height");
    frame.style.removeProperty("transform");
    const h = box.querySelector(".prev-hold");
    if (h){ h.style.removeProperty("height"); h.style.removeProperty("width"); h.style.removeProperty("margin"); }
    box.classList.remove("scaled");
    const list = document.querySelector(".build-list");
    if (list) list.style.removeProperty("padding-bottom");
    return;
  }
  box.classList.add("scaled");
  const holder = box.querySelector(".prev-hold") || box;
  const w = box.clientWidth;              // the holder's own width is set below
  if (!w) return;
  const NATURAL = 1280;                       // laid out as a small laptop
  const NAT_H = NATURAL * 9 / 16;
  /* Never more than this much of the screen: the point of it is to watch a
     lesson take shape while writing it, not to write in the strip left over
     above a preview. */
  const cap = Math.max(180, window.innerHeight * 0.36);
  const scale = Math.min(w / NATURAL, cap / NAT_H);
  frame.style.width = NATURAL + "px";
  frame.style.height = Math.round(NAT_H) + "px";
  frame.style.transform = "scale(" + scale + ")";
  holder.style.height = Math.round(NAT_H * scale) + "px";
  /* centred when the cap has made it narrower than the screen */
  holder.style.width = Math.round(NATURAL * scale) + "px";
  holder.style.margin = "0 auto";
  /* Leave exactly as much room under the cards as the preview takes, so the
     last task is reachable and there is no band of empty page either. */
  const list = document.querySelector(".build-list");
  if (list) list.style.paddingBottom = (box.getBoundingClientRect().height + 20) + "px";
}

try{
  compactQ().addEventListener("change", applyBuildLayout);
  roomyQ().addEventListener("change", () => { applyBuildLayout(); fitPreview(); });
}catch(e){
  compactQ().addListener(applyBuildLayout);      // older browsers
  roomyQ().addListener(fitPreview);
}
window.addEventListener("resize", fitPreview);


/* ---------------- go ---------------- */
loadDraft();
if (!lesson.topics) lesson.topics = {};


paintPickers();
setMode(!!lesson.assessment && !lesson.practical, !!lesson.practical);
applyBuildLayout();
loadUnitsAndMaybeLesson();
render();
refreshPreview();
fitPreview();
if (window.initSettings) initSettings($("setBtn"));
/* A fresh lesson on a narrow screen starts by asking what it is, because
   the row of kinds that asks on a desktop is not on the page there. One
   opened for editing already knows. */
if (isCompact() && !new URLSearchParams(location.search).get("edit")){
  setTimeout(() => { if (!modeChosen) modePicker(true); }, 300);
}
</script>
</body>
</html>
