/* The kinds of check a teacher can add, worded as a sentence they finish. */
const PY_CHECKS = [
  ["uses",       "Uses a...",              "which"],
  ["usesCount",  "Uses this many of a...", "count"],
  ["codeHas",    "The code contains...",   "text"],
  ["codeCount",  "The code contains this many...", "count"],
  ["codeLacks",  "The code avoids...",     "text"],
  ["defines",    "Defines a function...",  "name"],
  ["calls",      "Calls...",               "name"],
  ["outputHas",  "The output contains...", "text"],
  ["outputIs",   "The output is exactly...","text"],
  ["lineCount",  "At least this many lines","number"],
  ["runCount",   "Runs the code at least...", "number"]
];
const WEB_CHECKS = [
  ["tag",        "Has this tag...",        "tag"],
  ["classOrId",  "Has this class or id...","selector"],
  ["attr",       "An element has this attribute...","selector"],
  ["contentHas", "The page shows...",      "text"],
  ["cssHas",     "A CSS rule sets...",     "selector"],
  ["fileHas",    "A file contains...",     "text"],
  ["runCount",   "Runs the page at least...", "number"]
];
const USES_OPTIONS = ["for loop","while loop","if","else","elif","input","print",
                      "list","function","variable","comment","random","turtle"];

/* The checks that compare something a teacher typed against something a
   student wrote. Only those have any use for a case setting, or for the
   spaces one beside it: a dropdown or a number cannot be typed in the wrong
   case, and no amount of room around a number changes it. */
const CASED_KINDS = ["codeHas","codeCount","codeLacks","defines","calls",
                     "outputHas","outputIs",
                     "attr","contentHas","cssHas","fileHas"];

/* The two that pick from the list of Python things rather than a typed word,
   so both need one filling in when the kind is chosen. */
function picksFromList(kind){ return kind === "uses" || kind === "usesCount"; }
/* Where there is nothing in the code to look inside, there is nothing for
   "this line" to mean either. */
function readsCode(kind){ return kind !== "outputHas" && kind !== "outputIs" && kind !== "runCount"; }

/* A check's wording is styled now, so it is kept twice: labelHtml is what a
   student sees and label is the same words with the styling taken off.
   Everything that cannot show styling reads label, which is marking, the PDF
   and the summary at the end of a lesson, so it has to stay in step. */
function plainWords(html){
  const d = document.createElement("div");
  d.innerHTML = String(html || "");
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
/* and the other way about, for a check written before styling existed */
function asStyled(text){
  const d = document.createElement("div");
  d.textContent = String(text || "");
  return d.innerHTML;
}

/* ---------- the fields one kind of check needs ----------
   The line itself and every condition on it are the same sort of thing, so
   they ask for their settings with the same code. That is what lets a
   condition be any kind of check rather than one of three. */
function checkFields(c, row, kinds, repaint){
  const needs = (name, key, help) => {
    const f = el("div","bfield checkfield grow");
    f.appendChild(el("label","", name));
    const inp = el("input");
    inp.value = c[key] || "";
    if (help) inp.placeholder = help;
    inp.addEventListener("input", () => { c[key] = inp.value; saveDraft(); });
    f.appendChild(inp);
    row.appendChild(f);
  };
  /* the list of Python things, for the two kinds that pick from it */
  const whichOne = () => {
    const f = el("div","bfield checkfield grow");
    f.appendChild(el("label","","Which one"));
    const sel = document.createElement("select");
    USES_OPTIONS.forEach(o2 => {
      const o = document.createElement("option");
      o.value = o2; o.textContent = o2;
      sel.appendChild(o);
    });
    sel.value = c.value || USES_OPTIONS[0];
    sel.addEventListener("change", () => { c.value = sel.value; saveDraft(); });
    f.appendChild(sel);
    row.appendChild(f);
  };
  /* How many, and whether that is a floor, a ceiling or the exact number.
     "At least" is what a checklist usually means, so it leads; "exactly" is
     for when the shape of the answer is the point, three elifs and no more,
     and "at most" is for pushing them off a habit, such as one input where
     they wrote five. */
  const howMany = () => {
    const f = el("div","bfield checkfield");
    f.appendChild(el("label","","How many"));
    const pair = el("div","countpair");
    const sel = document.createElement("select");
    [["atLeast","at least"],["exactly","exactly"],["atMost","at most"]].forEach(o2 => {
      const o = document.createElement("option");
      o.value = o2[0]; o.textContent = o2[1];
      sel.appendChild(o);
    });
    sel.value = c.compare || "atLeast";
    sel.addEventListener("change", () => { c.compare = sel.value; saveDraft(); });
    pair.appendChild(sel);
    const num = el("input");
    num.type = "number"; num.min = "0"; num.max = "99";
    num.value = c.count === undefined || c.count === "" ? "1" : String(c.count);
    num.addEventListener("input", () => { c.count = num.value; saveDraft(); });
    pair.appendChild(num);
    f.appendChild(pair);
    row.appendChild(f);
  };

  const kind = c.kind || kinds[0][0];
  if (kind === "uses") whichOne();
  else if (kind === "usesCount"){ whichOne(); howMany(); }
  else if (kind === "codeCount"){
    needs("Text to count", "value", "elif");
    howMany();
  }
  else if (kind === "lineCount") needs("How many lines", "count", "5");
  else if (kind === "runCount") needs("How many times", "count", "1");
  else if (kind === "tag") needs("Tag name", "selector", "h1");
  else if (kind === "classOrId") needs("Class or id", "selector", ".title or #header");
  else if (kind === "attr"){
    needs("Element", "selector", "img");
    needs("Attribute", "attr", "src");
    needs("Value (optional)", "value", "cat.png");
  }
  else if (kind === "cssHas"){
    needs("Selector", "selector", ".title");
    needs("Property", "property", "color");
    needs("Value (optional)", "value", "red");
  }
  else if (kind === "fileHas"){
    const f = el("div","bfield checkfield");
    f.appendChild(el("label","","Which file"));
    const sel = document.createElement("select");
    [["html","HTML"],["css","CSS"],["js","JavaScript"]].forEach(o2 => {
      const o = document.createElement("option");
      o.value = o2[0]; o.textContent = o2[1];
      sel.appendChild(o);
    });
    sel.value = c.file || "html";
    sel.addEventListener("change", () => { c.file = sel.value; saveDraft(); });
    f.appendChild(sel);
    row.appendChild(f);
    needs("Text to look for", "value", "console.log");
  }
  else needs("Text to look for", "value", "");
}

/* Filling in whatever a newly chosen kind needs, so a check is never left
   asking for nothing, and a count never reads back as zero and ticks itself
   off whatever the student wrote. */
function settleKind(c){
  if (picksFromList(c.kind) && !c.value) c.value = USES_OPTIONS[0];
  if ((c.kind === "usesCount" || c.kind === "codeCount" ||
       c.kind === "lineCount" || c.kind === "runCount") && !String(c.count || "").trim())
    c.count = "1";
}

/* ---------- what the conditions add up to ----------
   Written out in letters rather than in the conditions themselves, which
   would be a paragraph. A is the line's own check and the rest follow it down
   the card, each row carrying its letter. */
function logicSentence(more){
  const list = more || [];
  if (!list.length) return "";
  const letter = (n) => String.fromCharCode(65 + n);
  const word = (m) => (m.join === "or" ? "or" : "and");
  let out = "A";
  let i = 0;
  while (i < list.length){
    if (!list[i].group){
      out += " " + word(list[i]) + " " + letter(i + 1);
      i++;
      continue;
    }
    const outer = word(list[i]);
    let inner = "";
    let howMany = 0;
    while (i < list.length && list[i].group){
      inner += (howMany ? " " + word(list[i]) + " " : "") + letter(i + 1);
      howMany++;
      i++;
    }
    out += " " + outer + " " + (howMany > 1 ? "(" + inner + ")" : inner);
  }
  return out;
}

function checklistPopup(block, isWeb){
  const kinds = isWeb ? WEB_CHECKS : PY_CHECKS;
  /* Which cards are open. Held against the checks themselves rather than
     against their positions, so moving one up or down does not open a
     different line than the one that was being edited. Nothing about it is
     saved: it is only a way of getting around a long checklist. */
  const open = new Set();
  if (block.checks.length === 1) open.add(block.checks[0]);

  openModal(box => {
    box.classList.add("narrow", "checkmodal");
    box.appendChild(el("h2","","Checklist"));
    box.appendChild(el("p","modal-text",
      "Each line becomes something the student can tick off. Keep the wording plain, " +
      "it is what they read when they are stuck."));
    const list = el("div");
    box.appendChild(list);

    function paint(){
      /* Every button in here rebuilds the whole list, which threw the pop-up
         back to the top: pressing the brackets on the fourth check jumped to
         the first one. What was pressed is where they are looking, so put them
         back exactly where they were. */
      const scroller = list.closest(".modal-scroll");
      const wasAt = scroller ? scroller.scrollTop : 0;
      list.innerHTML = "";
      if (!block.checks.length)
        list.appendChild(el("p","hint","Nothing yet, press \u201c+ New check\u201d."));
      block.checks.forEach((c, i) => {
        const shut = !open.has(c);
        const card = el("div","qsub checkcard");
        const head = el("div","qsub-head checkhead");

        /* Folded away, a line still has to say enough to pick it out by, so
           the wording stays on show and only the settings go. */
        const fold = el("button","btn-ghost bmini foldbtn", shut ? "\u25B8" : "\u25BE");
        fold.type = "button";
        fold.title = shut ? "Open this check" : "Fold this check away";
        fold.addEventListener("click", (e) => {
          e.stopPropagation();
          if (shut) open.add(c); else open.delete(c);
          paint();
        });
        head.appendChild(fold);

        const said = el("span","checksum");
        if (c.labelHtml) said.innerHTML = c.labelHtml;
        else said.textContent = c.label || "";
        if (!said.textContent.trim()){
          said.textContent = "New check";
          said.classList.add("empty");
        }
        said.title = shut ? "Open this check" : "Fold this check away";
        said.addEventListener("click", () => {
          if (shut) open.add(c); else open.delete(c);
          paint();
        });
        head.appendChild(said);

        /* What it looks for, in the words of the dropdown, so a folded line
           says what sort of check it is without being opened. */
        if (shut){
          const what = c.manual === true ? "Teacher checks this"
            : ((kinds.find(k => k[0] === (c.kind || kinds[0][0])) || [])[1] || "");
          const extra = (Array.isArray(c.more) ? c.more.filter(m => m && (m.value || m.count || m.selector)) : []).length;
          head.appendChild(el("span","checkkind",
            what + (extra ? "  +" + extra + " more" : "")));
        }

        const tools = el("span","btools");
        [["\u2191","Move up", () => { if (i){ block.checks.splice(i-1,0,block.checks.splice(i,1)[0]); saveDraft(); paint(); } }],
         ["\u2193","Move down", () => { if (i<block.checks.length-1){ block.checks.splice(i+1,0,block.checks.splice(i,1)[0]); saveDraft(); paint(); } }],
         ["\u2715","Remove", () => { block.checks.splice(i,1); open.delete(c); saveDraft(); paint(); }]
        ].forEach(t => {
          const btn = el("button","btn-ghost bmini", t[0]);
          btn.title = t[1];
          btn.addEventListener("click", t[2]);
          tools.appendChild(btn);
        });
        head.appendChild(tools);
        card.appendChild(head);

        /* A shut card stops here, the way a folded task does. Nothing below
           this line exists in the page until it is opened. */
        if (shut){ list.appendChild(card); return; }

        /* The wording a student reads, which can be styled. Both versions are
           written on every keystroke: the plain one is what marking and the
           PDF read, and letting it fall behind would show a student one thing
           and their teacher another. */
        const nameField = el("div","bfield wide");
        nameField.appendChild(el("label","","What the student sees"));
        const ed = window.richText(c.labelHtml || asStyled(c.label),
          (html) => {
            c.labelHtml = html;
            c.label = plainWords(html);
            saveDraft();
          },
          { rows:1, lists:false, code:"inline", pictures:false,
            placeholder:"What the student sees" });
        ed.classList.add("checkname");
        nameField.appendChild(ed);
        card.appendChild(nameField);

        /* An assessment has to add a coding task up somehow, and the checklist
           is the only thing about it that can be judged automatically. Each
           line is worth however many marks the teacher says. */
        if (lesson.assessment){
          const mrow = el("div","bfield");
          mrow.appendChild(el("label","","Marks for this"));
          const mstep = el("div","stepper");
          const mless = el("button","btn-ghost iconbtn","\u2212");
          const mnum = el("input"); mnum.type = "number"; mnum.className = "stepnum";
          mnum.min = "0"; mnum.max = "20";
          if (c.marks === undefined) c.marks = 1;
          mnum.value = String(c.marks);
          const mmore = el("button","btn-ghost iconbtn","+");
          const setMarks = (v) => {
            c.marks = Math.max(0, Math.min(20, Math.round(Number(v) || 0)));
            mnum.value = String(c.marks);
            saveDraft(); schedulePreview();
          };
          mless.addEventListener("click", () => setMarks((parseInt(mnum.value, 10) || 0) - 1));
          mmore.addEventListener("click", () => setMarks((parseInt(mnum.value, 10) || 0) + 1));
          mnum.addEventListener("input", () => setMarks(mnum.value));
          mstep.appendChild(mless); mstep.appendChild(mnum); mstep.appendChild(mmore);
          mrow.appendChild(mstep);
          card.appendChild(mrow);
        }

        /* Some things are too vague or too particular for any rule: "the code
           is tidy", "the colours suit the topic". Those are marked as the
           teacher's to judge, and no automatic check is asked for at all. */
        /* Everything a check needs sits on as few rows as it can: these cards
           stack up in a pop-up, and a tall one means scrolling to see a
           checklist that would fit if it used the width it already has. */
        const topRow = el("div","checkrow");
        card.appendChild(topRow);
        const whoField = el("div","bfield checkfield");
        whoField.appendChild(el("label","","Who checks this"));
        const manual = c.manual === true;
        const mbtn = el("button","btn-ghost bmini2" + (manual ? " right" : ""),
                        manual ? "Teacher" : "Checked automatically");
        mbtn.type = "button";
        mbtn.title = manual ? "You tick this off when you look at their work"
                            : "The page works this one out on its own";
        mbtn.addEventListener("click", () => { c.manual = !manual; saveDraft(); paint(); });
        whoField.appendChild(mbtn);
        topRow.appendChild(whoField);
        /* Nothing to look for when a person is doing the looking. The card has
           to go on the page before dropping out of this line, or a
           teacher-checked line would disappear from the list entirely. */
        if (manual){ list.appendChild(card); return; }

        const row = el("div","bfield checkfield grow");
        row.appendChild(el("label","","What to look for"));
        const pick = document.createElement("select");
        kinds.forEach(k => {
          const o = document.createElement("option");
          o.value = k[0]; o.textContent = k[1];
          pick.appendChild(o);
        });
        pick.value = c.kind || kinds[0][0];
        pick.addEventListener("change", () => {
          c.kind = pick.value;
          settleKind(c);
          saveDraft(); paint();
        });
        row.appendChild(pick);
        topRow.appendChild(row);

        /* the fields this kind of check needs, side by side on one row along
           with the two matching switches and the button for another condition */
        const mainRow = el("div","checkrow");
        card.appendChild(mainRow);
        checkFields(c, mainRow, kinds, paint);

        /* The two matching switches, the way an editor's search bar shows
           them: a letter pair for capitals and a space mark for spaces, each
           struck through while that thing is being ignored. They sit against
           the boxes they apply to rather than under headings of their own,
           which is what made these cards taller than they needed to be.

           They belong to the line rather than to one box on it, so they are
           shown as soon as anything on the line compares typed words, whether
           that is the check itself or a condition on it. */
        const kind = c.kind || kinds[0][0];
        const anyCased = CASED_KINDS.indexOf(kind) >= 0 ||
          (Array.isArray(c.more) && c.more.some(m => CASED_KINDS.indexOf(m.kind) >= 0));
        if (anyCased){
          const caseOn = c.caseSensitive === true;
          const cbtn = el("button","casebtn" + (caseOn ? " on" : ""), "Aa");
          cbtn.type = "button";
          cbtn.title = caseOn ? "Capitals must match what you typed. Click to ignore them."
                              : "Capitals are ignored, so Print and print both count. Click to match them exactly.";
          cbtn.setAttribute("aria-label", cbtn.title);
          cbtn.addEventListener("click", () => { c.caseSensitive = !caseOn; saveDraft(); paint(); });
          mainRow.appendChild(cbtn);

          const spaceOn = c.exactSpace === true;
          const sbtn = el("button","casebtn spacebtn" + (spaceOn ? " on" : ""), "\u2423");
          sbtn.type = "button";
          sbtn.title = spaceOn
            ? "Match exactly: the spaces have to be where you put them. Click to ignore them."
            : "Spaces are ignored, so \u201cx > 17\u201d also finds \u201cx>17\u201d. Click to match exactly.";
          sbtn.setAttribute("aria-label", sbtn.title);
          sbtn.addEventListener("click", () => { c.exactSpace = !spaceOn; saveDraft(); paint(); });
          mainRow.appendChild(sbtn);
        }

        /* ---------- extra conditions ----------
           One line of a checklist sometimes has to ask for two things at once:
           "uses an input, and that input mentions food". A condition is a
           whole check in its own right, so it can be any of the same kinds.
           Each one says how it joins on, what to look for, and where to look.

           Where is the part that matters. "This line" narrows it to the lines
           the thing before it matched, so the two halves are about the same
           piece of code rather than anywhere in the file. "This block" is what
           is written inside those lines: pick "uses an if" and a condition
           inside the block asks about what the if actually does, rather than
           about the condition on it. */
        if (!Array.isArray(c.more)) c.more = [];
        c.more.forEach((m, mi) => {
          const mr = el("div","morecond" + (m.group ? " grouped" : ""));
          const top = el("div","brow condtop");

          top.appendChild(el("span","condletter", String.fromCharCode(66 + mi)));

          const joinBtn = el("button","btn-ghost bmini2 joinbtn", (m.join === "or" ? "or" : "and"));
          joinBtn.type = "button";
          joinBtn.title = "Both must be true, or either one";
          joinBtn.addEventListener("click", () => { m.join = (m.join === "or") ? "and" : "or"; saveDraft(); paint(); });
          top.appendChild(joinBtn);

          /* Brackets, one deep. A bracketed condition goes with the bracketed
             ones straight above it, which is the difference between
             "A and B or C" and "A and (B or C)". Deeper than one and a
             teacher would have to count brackets to know what their own
             checklist asks for. */
          const grpBtn = el("button","casebtn brackbtn" + (m.group ? " on" : ""), "( )");
          grpBtn.type = "button";
          grpBtn.title = m.group
            ? "In brackets with the one above. Click to take it out of them."
            : "Click to put this in brackets with the one above.";
          grpBtn.setAttribute("aria-label", grpBtn.title);
          grpBtn.addEventListener("click", () => { m.group = !m.group; saveDraft(); paint(); });
          top.appendChild(grpBtn);

          const kindSel = document.createElement("select");
          kinds.forEach(k => {
            const o = document.createElement("option");
            o.value = k[0]; o.textContent = k[1];
            kindSel.appendChild(o);
          });
          kindSel.value = m.kind || "codeHas";
          kindSel.addEventListener("change", () => {
            m.kind = kindSel.value; settleKind(m); saveDraft(); paint();
          });
          top.appendChild(kindSel);

          const scopeSel = document.createElement("select");
          [["all","anywhere"],["match","this line"],["block","this block"]].forEach(k => {
            const o = document.createElement("option");
            o.value = k[0]; o.textContent = k[1];
            scopeSel.appendChild(o);
          });
          scopeSel.value = m.scope || "all";
          scopeSel.addEventListener("change", () => { m.scope = scopeSel.value; saveDraft(); });
          /* the output and the number of runs are not in the code, so
             narrowing to lines found earlier would look in the wrong place */
          scopeSel.disabled = !readsCode(m.kind || "codeHas");
          top.appendChild(scopeSel);

          const del = el("button","btn-ghost bmini","\u00D7");
          del.title = "Remove this condition";
          del.addEventListener("click", () => { c.more.splice(mi,1); saveDraft(); paint(); });
          top.appendChild(del);
          mr.appendChild(top);

          /* the same fields the line itself gets, because it is the same
             sort of thing being asked for */
          const condRow = el("div","checkrow condfields");
          checkFields(m, condRow, kinds, paint);
          mr.appendChild(condRow);
          card.appendChild(mr);
        });
        const addMore = el("button","btn-ghost bmini2 addcond","Add another condition");
        addMore.addEventListener("click", () => {
          c.more.push({ join:"and", kind:"codeHas", value:"", scope:"all" });
          open.add(c);
          saveDraft(); paint();
        });
        /* on the same row as the box it adds a condition to, not under it */
        mainRow.appendChild(addMore);
        if (c.more.length){
          const sum = el("div","logicline");
          sum.appendChild(el("span","logiclead","Ticked when"));
          sum.appendChild(el("b","logicsum", logicSentence(c.more)));
          sum.appendChild(helpDot([
            "A is what the line itself looks for, and the letters after it are the conditions under it.",
            "Read left to right, so \u201cA and B or C\u201d means \u201c(A and B) or C\u201d.",
            "The ( ) button puts a condition in brackets with the one above it, which is how you write \u201cA and (B or C)\u201d."
          ]));
          card.appendChild(sum);
        }

        /* Last, so it applies whatever kind of check this is. Left empty, the
           line says nothing under it. Teacher-checked lines never reach here:
           they have nothing to fail at, so there is nothing to say about it. */
        const hrow = el("div","bfield wide");
        hrow.appendChild(el("label","","What to say if they have not got it yet"));
        const hin = el("input");
        hin.value = c.hint || "";
        hin.placeholder = "Leave empty for no hint";
        hin.addEventListener("input", () => { c.hint = hin.value; saveDraft(); });
        hrow.appendChild(hin);
        card.appendChild(hrow);

        list.appendChild(card);
      });
      if (scroller) scroller.scrollTop = wasAt;
    }
    paint();

    const add = el("button","btn-ghost bmini2","+ New check");
    add.addEventListener("click", () => {
      const first = kinds[0][0];
      const made = { label:"", labelHtml:"", kind: first,
                     value: picksFromList(first) ? USES_OPTIONS[0] : "" };
      block.checks.push(made);
      /* whatever was just added is the thing being written, so it opens */
      open.clear();
      open.add(made);
      saveDraft(); paint();
    });
    box.appendChild(add);
    const done = el("button","btn-primary modal-cta","Done");
    done.addEventListener("click", () => {
      block.checks = block.checks.filter(c => (c.label || "").trim());
      block.checks.forEach(c => {
        settleKind(c);
        /* styling that has been taken back off is not worth saving, and an
           empty one would beat the plain wording when the line is drawn */
        if (!plainWords(c.labelHtml)) delete c.labelHtml;
        (Array.isArray(c.more) ? c.more : []).forEach(settleKind);
      });
      closeModal(); render(); schedulePreview();
    });
    box.appendChild(done);
  });
}

function markingSetup(into){
  if (!lesson.marking) lesson.marking = "rubric";   // the usual way to mark a practical
  const card = el("div","bcard");
  const head = el("div","bhead");
  head.appendChild(el("b","btype","How this is marked"));
  card.appendChild(head);
  const body = el("div","bbody");

  const row = el("div","brow");
  [["rubric","A grade from a rubric"],["score","A mark out of a total"]].forEach(pair => {
    const b = el("button","btn-ghost bmini2" + (lesson.marking === pair[0] ? " right" : ""), pair[1]);
    b.addEventListener("click", () => { lesson.marking = pair[0]; saveDraft(); render(); schedulePreview(); });
    row.appendChild(b);
  });
  body.appendChild(row);

  if (lesson.marking === "score"){
    const w = el("div","bfield");
    w.appendChild(el("label","","Total mark"));
    const st = el("div","stepper");
    const less = el("button","btn-ghost iconbtn","\u2212");
    const num = el("input"); num.type = "number"; num.className = "stepnum";
    num.value = String(lesson.outOf || 20);
    const more = el("button","btn-ghost iconbtn","+");
    const setN = (v) => { lesson.outOf = Math.max(1, v); num.value = String(lesson.outOf); saveDraft(); schedulePreview(); };
    less.addEventListener("click", () => setN((parseInt(num.value, 10) || 1) - 5));
    more.addEventListener("click", () => setN((parseInt(num.value, 10) || 1) + 5));
    num.addEventListener("input", () => { lesson.outOf = Math.max(1, parseInt(num.value, 10) || 1); saveDraft(); });
    st.appendChild(less); st.appendChild(num); st.appendChild(more);
    w.appendChild(st);
    body.appendChild(w);
  } else {
    if (!lesson.rubric) lesson.rubric = [];
    const w = el("div","bfield");
    const n = lesson.rubric.filter(g => g.name).length;
    w.appendChild(el("p","bhelp", n
      ? n + " grade" + (n === 1 ? "" : "s") + " set up."
      : "No grades yet."));
    const editBtn = el("button","btn-ghost bmini2","Edit the rubric");
    editBtn.addEventListener("click", rubricPopup);
    w.appendChild(editBtn);
    body.appendChild(w);
  }
  card.appendChild(body);
  into.appendChild(card);
}

function paintTargets(into){
  const used = {};
  lesson.blocks.forEach(b => { if (b.topic) used[b.topic] = true; });
  Object.keys(lesson.topics || {}).forEach(k => { used[k] = true; });
  const names = Object.keys(used);
  if (lesson.practical) markingSetup(into);
  const addBtn = el("button","btn-primary bmini2","+ New topic");
  addBtn.addEventListener("click", () => {
    let n = 1;
    while (lesson.topics["Topic " + n]) n++;
    lesson.topics["Topic " + n] = { label:"Topic " + n, strength:"", target:"" };
    saveDraft(); render();
  });
  const addRow = el("div","brow");
  addRow.appendChild(addBtn);
  addRow.appendChild(helpDot(lesson.practical
    ? "These become a bank you can pick from when marking, so you are not writing the same sentence twice."
    : "The topic a student did best in gives their Strength; their weakest gives their Target."));
  into.appendChild(addRow);
  if (!names.length && !Object.keys(lesson.topics || {}).length){
    into.appendChild(el("p","hint", lesson.practical
      ? "No topics yet, press \u201c+ New topic\u201d."
      : "No topics yet, press \u201c+ New topic\u201d, or tag some questions."));
    extremeSentences(into);       // these two stand on their own
    return;
  }
  names.forEach(name => {
    if (!lesson.topics[name]) lesson.topics[name] = { label:name, strength:"", target:"" };
    const t = lesson.topics[name];
    const card2 = el("div","bcard");
    const head = el("div","bhead");
    head.appendChild(el("b","btype", name));
    const del = el("button","btn-ghost bmini","\u2715");
    del.title = "Remove this topic";
    del.addEventListener("click", () => {
      delete lesson.topics[name];
      if (lesson.responses) delete lesson.responses[name];
      saveDraft(); render(); schedulePreview();
    });
    head.appendChild(del);
    card2.appendChild(head);
    const body = el("div","bbody");
    [["label", lesson.practical ? "Topic name" : "Friendly name"],
     ["strength", lesson.practical ? "Strength" : "When this is their BEST topic"],
     ["target", lesson.practical ? "Target" : "When this is their WEAKEST topic"]]
      .forEach(pair => {
        const w = el("div","bfield");
        w.appendChild(el("label","", pair[1]));
        const inp = el("textarea"); inp.rows = 2; inp.value = t[pair[0]] || "";
        inp.addEventListener("input", () => { t[pair[0]] = inp.value; saveDraft(); schedulePreview(); });
        w.appendChild(inp); body.appendChild(w);
      });
    card2.appendChild(body);
    into.appendChild(card2);
  });
  extremeSentences(into);
}

/* The two sentences that belong to the whole assessment rather than to any
   one topic: what to say when nothing was right, and when everything was.
   Strength first, the way round a student is shown them. */
function extremeSentences(into){
  [["zeroStrength","Strength for when a student gets everything wrong"],
   ["perfectTarget","Target for when a student gets everything right"]].forEach(pair => {
    const w = el("div","bfield");
    w.appendChild(el("label","", pair[1]));
    const inp = el("textarea"); inp.rows = 2; inp.value = lesson[pair[0]] || "";
    inp.addEventListener("input", () => { lesson[pair[0]] = inp.value; saveDraft(); schedulePreview(); });
    w.appendChild(inp);
    into.appendChild(w);
  });
}

/* the list of topics, each opening its own set of tasks */
function paintResponseTopics(into){
  if (!lesson.responses) lesson.responses = {};
  if (!lesson.extensions) lesson.extensions = [];
  const used = {};
  lesson.blocks.forEach(b => { if (b.topic) used[b.topic] = true; });
  Object.keys(lesson.topics || {}).forEach(k => { used[k] = true; });
  Object.keys(lesson.responses).forEach(k => { used[k] = true; });
  const names = Object.keys(used);
  into.appendChild(el("p","hint","Students get the tasks for their target topic, then the extension tasks."));
  if (!names.length) into.appendChild(el("p","hint","Add a topic tag to some questions first."));
  names.forEach(name => {
    if (!lesson.responses[name]) lesson.responses[name] = [];
    const n = lesson.responses[name].length;
    const row = el("button","ov-row");
    const nice = (lesson.topics[name] && lesson.topics[name].label) || name;
    row.appendChild(el("span","t", nice));
    row.appendChild(el("span","p", n + " task" + (n === 1 ? "" : "s")));
    row.appendChild(el("span","edit","Open \u2192"));
    row.addEventListener("click", () => { respEditing = name; render(); });
    into.appendChild(row);
  });
  const ext = el("button","ov-row");
  ext.appendChild(el("span","t","Extension tasks"));
  ext.appendChild(el("span","p", lesson.extensions.length + " task" + (lesson.extensions.length === 1 ? "" : "s") +
                                 " \u00b7 everyone gets these"));
  ext.appendChild(el("span","edit","Open \u2192"));
  ext.addEventListener("click", () => { respEditing = "__ext"; render(); });
  into.appendChild(ext);
}


let respEditing = null;
let assessTab = "questions";   // questions | targets | responses

/* Every section starts folded away, so the palette is the same short list
   each time it is opened. It used to remember which ones were open, which
   meant a section opened once stayed open for ever after and looked like a
   bug rather than a memory. */
function wirePalette(){
  document.querySelectorAll(".palgroup").forEach(group => {
    const heading = group.querySelector(".pal-head");
    const tasks = group.querySelector(".palbody");
    if (!heading || !tasks) return;

    const setOpen = (open) => {
      tasks.hidden = !open;
      heading.classList.toggle("open", open);
    };

    setOpen(false);
    heading.addEventListener("click", () => setOpen(tasks.hidden));
  });
  try{ localStorage.removeItem("hub_pal"); }catch(e){}   // the old memory
}
wirePalette();

document.querySelectorAll(".pal[data-add]").forEach(btn => {
  btn.draggable = true;
  btn.addEventListener("dragstart", (e) => {
    newTask = btn.dataset.add;
    dragFrom = null;
    btn.classList.add("dragging");
    if (e.dataTransfer){ e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", newTask); }
  });
  btn.addEventListener("dragend", () => { btn.classList.remove("dragging"); newTask = null; });
  btn.addEventListener("click", () => addBlock(newBlock(btn.dataset.add)));
});

/* Put a task into the lesson wherever a task should go. Takes the block
   rather than the kind, because the task bank hands over a copy of one it
   already has rather than a blank. */
function addBlock(made){
  if (!made) return;
  if (respEditing){                       // a response or extension set is open
    const arr = respEditing === "__ext" ? lesson.extensions : lesson.responses[respEditing];
    arr.push(made);
    openOnly(arr, made);
    lastAddedAt = arr.length - 1;
    scrollToBlock = made;
    render(); schedulePreview();
    return;
  }
  if (made.type === "page" || lesson.assessment){
    lesson.blocks.push(made);
    lastAddedAt = lesson.blocks.length - 1;
    if (made.type === "page"){ viewAll = false; tellPreview(made); }
  } else {
    /* Lessons are made of pages, so a task always goes on one. It joins the
       page on screen, or a new page if the lesson has none yet. */
    let page = targetPage();
    if (!page){
      page = BLANK.page();
      page.title = "New page";
      lesson.blocks.push(page);
      openPageRef = page;
    }
    page.blocks.push(made);
    /* it is the one about to be written, so the rest of the page shuts, and
       All pages is left because nothing can be edited from there */
    openOnly(page.blocks, made);
    viewAll = false;
    lastAddedAt = -1;                    // it is inside a page, so the page is the target
  }
  /* Named rather than counted. Picking it out of the cards by number went
     wrong as soon as tasks sat inside pages, because every nested card is a
     .bcard too and the last one is rarely the new one. */
  scrollToBlock = made;
  render(); schedulePreview();
}
function showTitle(){
  const t = (lesson.title || "").trim();

  $("titleShow").textContent = t ? " \u2022 " + t + v : v;

/* ---------------- versions of a lesson ----------------
   A version is a whole lesson of its own: its own id, its own students'
   work, its own place in the classes that were given it. What makes it a
   version is versionOf, which names the lesson it was made from, and that is
   all the hub needs to fold it under that lesson's Versions button instead
   of listing it beside everything else.

   It is made from a lesson that has already been saved, because the thing it
   points at has to exist. Pressing the button leaves the original untouched
   and turns this tab into the new version, which is why the pop-up says so
   in so many words. */
let teacherCodes = null;              // null until asked for, [] when there is nobody
async function loadTeacherCodes(){
  if (teacherCodes) return teacherCodes;
  const API = (window.HUB && window.HUB.API) || "";
  if (OFFLINE || !API){ teacherCodes = []; return teacherCodes; }
  try{
    const r = await fetch(API + "/api/teacher/teachers", { headers: window.teacherAuth.headers(), cache:"no-store" });
    const d = await r.json();
    teacherCodes = (d.teachers || []).map(t => String(t.code || "")).filter(Boolean);
  }catch(e){ teacherCodes = []; }
  return teacherCodes;
}
/* Whoever was last chosen in the teacher console on this machine. The builder
   has no sign-in picker of its own, and a version is nearly always being made
   by the person sitting there. */
function lastTeacher(){
  try{ return localStorage.getItem("hub_me") || ""; }catch(e){ return ""; }
}
function versionField(){
  const w = el("div","bfield");
  w.appendChild(el("label","","Versions"));

  if (lesson.versionOf){
    const line = el("p","vernow");
    line.appendChild(el("span","statechip open", lesson.versionName || "Version"));
    line.appendChild(el("span","", "of “" + parentTitle() + "”" +
                                   (lesson.versionCode ? " · " + lesson.versionCode : "")));
    w.appendChild(line);
    if (lesson.versionNote) w.appendChild(el("p","bhelp", lesson.versionNote));
    const row = el("div","brow");
    const edit = el("button","btn-ghost bmini2","Change these details");
    edit.addEventListener("click", () => versionPopup(true));
    const off = el("button","btn-ghost bmini2","Make it a lesson of its own");
    off.addEventListener("click", unversionPopup);
    const another = el("button","btn-ghost bmini2","Make another version");
    another.title = "Start from this one and save it as another version of “" + parentTitle() + "”";
    another.addEventListener("click", () => versionPopup(false));
    row.appendChild(edit); row.appendChild(another); row.appendChild(off);
    w.appendChild(row);
    return w;
  }

  if (!lesson.savedAs){
    w.appendChild(el("p","bhelp",
      "Save this lesson to the site first. A version is made from a lesson that is already there."));
    return w;
  }
  const row = el("div","brow");
  const mk = el("button","btn-ghost bmini2","Make this a different version");
  mk.addEventListener("click", () => versionPopup(false));
  row.appendChild(mk);
  row.appendChild(helpDot(
    ["Everything on this page is saved as a new lesson, and “" + (lesson.title || "this lesson") +
     "” is left exactly as it is. You choose which version you want when you give the lesson out.",
     "Use it for a version for a different set, for another teacher, or for a class that needs the "
     + "work laid out another way."]));
  w.appendChild(row);
  w.appendChild(el("p","bhelp","This is the original. It is the one that goes out unless somebody picks another version."));
  return w;
}

/* Everything that turns this tab into a new version of the lesson it is
   holding: pointed at the right lesson, given an id of its own, and saved.
   Shared by the pop-up that asks for the details and by the address the
   console sends when it has already asked.

   Nothing is changed for good until the save has worked. A failure puts every
   field back as it was, so a tab that could not reach the server is still the
   lesson it was opened with rather than a half made version of it. */
async function makeVersion(name, note, code){
  /* Flattened: starting from a version makes another version of the lesson
     that one came from, never a version of the version. Two levels would give
     the hub a tree to draw and a teacher nothing useful. */
  const from = lesson.versionOf || lesson.savedAs;
  if (!from) throw new Error("Save this lesson to the site first.");
  const was = { of: lesson.versionOf, name: lesson.versionName, note: lesson.versionNote,
                code: lesson.versionCode, id: lesson.savedAs, share: lesson.code };
  lesson.versionOf = from;
  lesson.versionName = String(name || "").trim().slice(0, 60);
  lesson.versionNote = String(note || "").trim().slice(0, 300);
  lesson.versionCode = String(code || "").trim().toUpperCase().slice(0, 20);
  lesson.savedAs = null;                 // so it is saved as a new lesson, not over the old one
  /* And a four digit code of its own. Carrying the original's over would put
     two lessons on one code, and the front page opens whichever it comes to
     first. Offline only, but that is where codes are used. */
  lesson.code = "";
  /* Offline there is no server to hand an id back: the version comes out as a
     file to drop into the lessons folder, so the id it will have is settled
     here instead. */
  if (OFFLINE) lesson.savedAs = newVersionId();
  try{
    await saveToSite();
    if (!lesson.savedAs) throw new Error("It was not saved.");
    showTitle();
  }catch(e){
    lesson.versionOf = was.of; lesson.versionName = was.name;
    lesson.versionNote = was.note; lesson.versionCode = was.code;
    lesson.savedAs = was.id; lesson.code = was.share;
    throw e;
  }
}

/* Opened from the console with the details already filled in there, or
   without them when somebody typed the address themselves. Either it is made
   straight away or the pop-up asks, which is the same two ways round the
   builder's own buttons work. */
function startVersion(given){
  if (!given || !given.name){ versionPopup(false); return; }
  makeVersion(given.name, given.note, given.code)
    .catch(e => say("Could not make the version", e.message));
}

/* The name, what has changed, and whose it is. Making one saves straight
   away, so the version is in the hub from the moment it is made rather than
   only once somebody remembers to press Save. */
function versionPopup(editing){
  openModal(box => {
    /* Always the lesson the new one will be a version of, which for a tab
       that already holds a version is the one it came from. */
    const of = (editing || lesson.versionOf) ? parentTitle() : (lesson.title || "this lesson");
    box.appendChild(el("h2","", editing ? "This version of “" + of + "”"
                                        : "Make a different version of “" + of + "”"));
    if (!editing){
      /* Offline there are no classes to keep anything: a lesson is handed out
         by its own link and its own four digit code, and the version is given
         a pair of its own. */
      box.appendChild(el("p","modal-text",
        "Everything on this page is saved as a new lesson. “" + of + "” is left as it is, and " +
        (OFFLINE ? "the version gets a link and a code of its own."
                 : "any class that has it keeps it.") +
        " This tab carries on with the new version."));
    }

    const w1 = el("div","bfield");
    w1.appendChild(el("label","","What is this version called?"));
    const nameIn = el("input");
    nameIn.value = editing ? (lesson.versionName || "") : "";
    nameIn.placeholder = "Lower ability";
    w1.appendChild(nameIn); box.appendChild(w1);

    const w2 = el("div","bfield");
    w2.appendChild(el("label","","What has changed?"));
    const noteIn = document.createElement("textarea");
    noteIn.rows = 3;
    noteIn.value = editing ? (lesson.versionNote || "") : "";
    noteIn.placeholder = "Shorter reading, the code is started off for them, and the extension is left out.";
    w2.appendChild(noteIn); box.appendChild(w2);

    const w3 = el("div","bfield");
    w3.appendChild(el("label","","Which teacher is it for?"));
    const codeBox = el("div","");
    w3.appendChild(codeBox); box.appendChild(w3);
    /* A list where the teachers are known, a box to type in where they are
       not, which is what offline looks like. Either way it reads the same. */
    /* Until the teachers have come back. Pressing the button in that first
       moment should not hand a new version the code of the one it was copied
       from. */
    let readCode = () => editing ? (lesson.versionCode || "") : "";
    loadTeacherCodes().then(codes => {
      codeBox.innerHTML = "";
      const mine = editing ? (lesson.versionCode || lastTeacher()) : lastTeacher();
      if (!codes.length){
        const inp = el("input");
        inp.value = mine;
        inp.placeholder = "HTS";
        codeBox.appendChild(inp);
        readCode = () => inp.value.trim().toUpperCase().slice(0, 20);
        return;
      }
      const sel = document.createElement("select");
      const none = document.createElement("option");
      none.value = ""; none.textContent = "Nobody in particular";
      sel.appendChild(none);
      codes.forEach(c => {
        const o = document.createElement("option");
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      sel.value = codes.indexOf(mine) >= 0 ? mine : "";
      codeBox.appendChild(sel);
      readCode = () => sel.value;
    });

    const msg = el("p","hint","");
    const go = el("button","btn-primary modal-cta", editing ? "Save these details" : "Make the version");
    go.addEventListener("click", async () => {
      const name = nameIn.value.trim().slice(0, 60);
      if (!name){ msg.textContent = "Give the version a name, so it can be told from the others."; nameIn.focus(); return; }
      const note = noteIn.value.trim().slice(0, 300);
      const code = readCode();
      if (editing){
        lesson.versionName = name; lesson.versionNote = note; lesson.versionCode = code;
        saveDraft(); showTitle();
        closeModal();
        await saveToSite();
        return;
      }
      msg.textContent = "Making it…";
      try{ await makeVersion(name, note, code); closeModal(); }
      catch(e){ msg.textContent = e.message; }
    });
    box.appendChild(go);
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(no);
    scrollBody(box);
    setTimeout(() => { try{ nameIn.focus(); }catch(e){} }, 30);
  });
}

/* Cutting a version loose. It keeps its id, its work and the classes that
   have it, and simply stops being folded under the lesson it came from. */
function unversionPopup(){
  const of = parentTitle();
  openModal(box => {
    box.appendChild(el("h2","","Make this a lesson of its own?"));
    box.appendChild(el("p","modal-text",
      "It stops being a version of “" + of + "” and appears in the hub beside it. " +
      "Nothing else changes: the work students have done on it is kept, and the classes that " +
      "have it still have it. It keeps its title as well, so you may want a new one."));
    const yes = el("button","btn-primary modal-cta","Make it its own lesson");
    yes.addEventListener("click", async () => {
      lesson.versionOf = ""; lesson.versionName = ""; lesson.versionNote = ""; lesson.versionCode = "";
      saveDraft(); showTitle();
      closeModal();
      await saveToSite();
    });
    box.appendChild(yes);
    const no = el("button","btn-ghost modal-stay","Leave it as a version");
    no.addEventListener("click", closeModal);
    box.appendChild(no);
  });
}

/* Without a server a year or unit is nothing but a word written into
   lessons/index.json, so a new one is simply added to what is on offer
   here. It reaches the site when the line for this lesson is pasted in. */
on("lYear", "change", async () => {
  const v = $("lYear").value;
  if (v === "__new"){
    const name = await askNew("New year group", "Name (e.g. Year 8)");
    if (!name){ $("lYear").value = lesson.year || ""; return; }
    if (OFFLINE) cat.years = (cat.years || []).concat([{ name }]);
    else {
      try{ await catPost({ op:"add-year", name: name }); }catch(e){ say("Could not create it", e.message); }
      await loadUnitsAndYears();
    }
    lesson.year = name;
  } else {
    lesson.year = v;
  }
  lesson.unit = "";                       // units belong to a year
  /* And a point belongs to a specification, so moving between year groups
     working towards different ones cannot keep it either. */
  lesson.subunit = ""; lesson.point = "";
  paintPickers(); saveDraft();
});
on("lUnit", "change", async () => {
  const v = $("lUnit").value;
  /* For GCSE and A Level this picker is the point of the specification, and
     choosing a different one starts its sub-point again rather than leaving
     2.2.1 filed under 1.1. */
  if (specLevel()){
    fileLessonUnder(v ? specPointOf(v) : null, "");
    paintPickers(); saveDraft(); schedulePreview();
    return;
  }
  if (v === "__new"){
    const name = await askNew("New unit", "Name (e.g. 8.1 Programming with Python)");
    if (!name){ paintPickers(); return; }
    if (OFFLINE) cat.units = (cat.units || []).concat([{ name, year: lesson.year || "" }]);
    else {
      try{ await catPost({ op:"add-unit", name: name, year: lesson.year || "" }); }
      catch(e){ say("Could not create it", e.message); }
      await loadUnitsAndYears();
    }
    lesson.unit = name;
  } else {
    lesson.unit = v;
  }
  paintPickers(); saveDraft();
});
/* The sub-point. Empty means the lesson covers the whole of its point, which
   the hub already has a place for: "Show all of 2.2", beside Refresh. */
on("lSub", "change", () => {
  fileLessonUnder(specStrandOfLesson(), $("lSub").value);
  paintPickers(); saveDraft(); schedulePreview();
});

/* Setting the passcode for a page. Only its hash reaches the lesson file, so
   a student reading lessons/whatever.json cannot find the word; the plain
   version is kept in this browser's draft so the teacher can still see what
   they chose while they are writing the lesson. Reopening a saved lesson on
   another machine shows the pill as set but cannot show the word itself. */
function askPasscode(b){
  openModal(box => {
    box.appendChild(el("h2","","Passcode for this page"));
    box.appendChild(el("p","modal-text",
      "Students type this to move on to it. Read it out when the class is ready."));
    const w = el("div","bfield");
    w.appendChild(el("label","","Passcode"));
    const inp = el("input");
    inp.autocomplete = "off";
    inp.spellcheck = false;
    inp.value = b.passCode || "";
    inp.placeholder = b.passHash && !b.passCode ? "Set on another computer, type a new one" : "";
    w.appendChild(inp);
    box.appendChild(w);
    const msg = el("p","bhelp","");
    box.appendChild(msg);
    const go = el("button","btn-primary modal-cta","Save the passcode");
    go.addEventListener("click", () => {
      const v = inp.value.trim();
      if (v.length < 3){ msg.textContent = "Make it at least three characters."; return; }
      /* Matched the same way the lesson page matches it: upper case, so
         nobody is caught out by a capital letter. */
      b.passCode = v;
      b.passHash = strHash(v.toUpperCase());
      closeModal(); render(); schedulePreview();
    });
    box.appendChild(go);
    const no = el("button","btn-ghost modal-stay","Cancel");
    no.addEventListener("click", closeModal);
    box.appendChild(no);
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}

/* Every locked page that has not got a passcode yet, by its number. */
function pagesMissingPasscode(){
  const out = [];
  lesson.blocks.forEach((b, i) => {
    if (b.type !== "page" || i === 0) return;
    if (b.startLocked !== false && !b.passHash) out.push(i + 1);
  });
  return out;
}

/* ---------------- adding a task under the ones already on a page ----------------
   The same tasks as the palette down the left, in the same groups and the
   same order, folded away so the row does not become a wall of buttons. Read
   from the palette itself rather than written out again, because two lists of
   the same thing drift apart and nobody notices for a term. */
function taskGroups(){
  const from = (lesson.assessment && !openArray()) ? "palAssess" : "palLesson";
  const box = $(from);
  if (!box) return [];
  /* A whole group hidden from the palette is hidden from this row too. The
     buttons inside it are not themselves marked hidden, so asking only
     about those offered Exam question on a KS3 page, where the palette had
     quite correctly left the group out. */
  return Array.from(box.querySelectorAll(".palgroup")).filter(group => !group.hidden).map(group => ({
    name: (group.querySelector(".pal-head") || {}).textContent || "",
    /* a task hidden from the palette is hidden from this row too, or the two
       lists say different things about what a teacher may add */
    kinds: Array.from(group.querySelectorAll(".pal[data-add]")).filter(btn => !btn.hidden).map(btn => ({
      kind: btn.dataset.add,
      label: (btn.querySelector("b") || {}).textContent || btn.dataset.add
    }))
  })).filter(g => g.kinds.length);
}

/* The containers a task is added from. Given whichever list is being looked
   at: the tasks on a page, the questions in an assessment, or the practice
   under one topic. */
function addTaskRow(target, inside){
  const wrap = el("div","pageadd");
  const bar = el("div","pageadd-bar");        // the containers, side by side
  const tray = el("div","pageadd-tray");      // whichever one is open, below
  tray.hidden = true;
  wrap.appendChild(bar); wrap.appendChild(tray);
  /* Containers do not go inside themselves. A choice inside extension tasks is
     fine and useful; a choice inside a choice is a maze. */
  const groups = taskGroups().map(g => ({
    name: g.name,
    kinds: g.kinds.filter(k => {
      if (inside === "choice") return k.kind !== "choice" && k.kind !== "extension";
      /* Extension tasks are a page's own "finished early?" flap, so they go
         on a page and nowhere else. A group inside either of these is fine,
         and a group inside a group is the whole point of one. */
      if (inside === "extension" || inside === "group") return k.kind !== "extension";
      return true;
    })
  })).filter(g => g.kinds.length);

  function openGroup(group, chip){
    const already = chip.classList.contains("open");
    bar.querySelectorAll(".pageadd-chip").forEach(c => c.classList.remove("open"));
    tray.innerHTML = "";
    if (already){ tray.hidden = true; return; }
    chip.classList.add("open");
    group.kinds.forEach(item => {
      const btn = el("button","btn-ghost bmini2", item.label);
      btn.addEventListener("click", () => {
        const made = newBlock(item.kind);
        if (!made) return;
        target.push(made);
        openOnly(target, made);
        viewAll = false;
        scrollToBlock = made;
        render(); schedulePreview();
      });
      tray.appendChild(btn);
    });
    tray.hidden = false;
  }

  const chips = groups.map(group => {
    const chip = el("button","pageadd-chip","+ " + group.name);
    chip.type = "button";
    chip.addEventListener("click", () => openGroup(group, chip));
    bar.appendChild(chip);
    return { group, chip };
  });

  /* On a wide screen the containers wrap onto as many lines as they need and
     that is the end of it. On a phone that would push the page's own tasks a
     long way down, so the row is held to two lines with a button that grows it
     one line at a time, and shrinks it again the same way once it is all out.

     What was here before moved whatever spilled into a More pop-up. Deciding
     what had spilled meant measuring the row, and when that measurement landed
     before the middle column had its width every chip looked wrapped, so a
     desktop builder would show one container and hide the other eight behind
     More. Nothing is moved now: the bar is only ever clipped, so a bad
     measurement can no longer rearrange anything. */
  const LIMIT = 2;                    // lines shown before a phone hides any
  let shown = LIMIT;
  const more = el("button","pageadd-more","More");
  more.type = "button";
  more.hidden = true;
  wrap.insertBefore(more, tray);      // above the open container, not below it

  /* Where each line of chips begins. Clipping the bar does not change how they
     wrap, so this reads the same whether the row is open or held down. */
  function lineTops(){
    const tops = [];
    chips.forEach(c => {
      const t = c.chip.offsetTop;
      if (!tops.some(v => Math.abs(v - t) < 4)) tops.push(t);
    });
    return tops.sort((a, b) => a - b);
  }

  function fit(){
    if (!wrap.isConnected) return;
    const tops = lineTops();
    if (!tops.length) return;
    const loose = () => {
      more.hidden = true;
      bar.classList.remove("clamped");
      bar.style.removeProperty("max-height");
    };
    if (!isCompact() || tops.length <= LIMIT) return loose();
    shown = Math.max(LIMIT, Math.min(shown, tops.length));
    if (shown >= tops.length){
      /* everything is out, so the button turns round */
      bar.classList.remove("clamped");
      bar.style.removeProperty("max-height");
      more.hidden = false;
      more.textContent = "Less";
      return;
    }
    more.hidden = false;
    more.textContent = "More";
    bar.classList.add("clamped");
    /* The bottom of the lowest chip on the last line being shown. Chips are not
       all one height, because a long name wraps to two lines inside its own
       pill on a narrow screen, so taking the first chip's height here left the
       row a line short of what it was meant to be showing. */
    const cut = tops[shown - 1];
    let bottom = 0;
    chips.forEach(c => {
      if (c.chip.offsetTop <= cut + 4){
        bottom = Math.max(bottom, c.chip.offsetTop + c.chip.offsetHeight);
      }
    });
    bar.style.maxHeight = (bottom - tops[0]) + "px";
  }
  more.addEventListener("click", () => {
    shown += (shown >= lineTops().length) ? -1 : 1;
    fit();
  });
  wrap._fit = fit;
  /* after the browser has laid the row out: until then nothing has a width and
     every chip reads as though it had wrapped */
  setTimeout(fit, 0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  return wrap;
}

/* One listener for every row on the page rather than one per row per render.
   The builder rebuilds its cards on every change and the old per-row resize
   listeners were never taken off again, so they gathered all session. */
window.addEventListener("resize", () => {
  document.querySelectorAll(".pageadd").forEach(w => { if (w._fit) w._fit(); });
});

/* a small prompt that returns what was typed */
function askNew(title, label){

      const go = el("button","btn-primary modal-cta","Create");
